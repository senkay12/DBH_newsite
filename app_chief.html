<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XField Şef</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: sol tarafta ekran dizini + açıklama, sağda telefon çerçevesi içinde şef uygulaması */
:root{
  --bg:#eef1f3; --panel:#ffffff; --ink:#15232b; --muted:#5d6b73; --line:#d8dee2;
  --accent:#0c6b7a; --accent-soft:#e0f0f2; --new:#b8590b; --new-soft:#fdf0e3;
  --ok:#1d7a46; --ok-soft:#e3f3ea; --warn:#a76a00; --warn-soft:#fbf1dc; --bad:#b3261e; --bad-soft:#fbe6e4;
  --phone:#0f1a20; --screen:#f6f8f9; --card:#ffffff;
  --display:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --body:"IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1417; --panel:#151d21; --ink:#e3eaee; --muted:#93a2aa; --line:#2a363c;
    --accent:#4fb3c2; --accent-soft:#16343a; --new:#f0a35c; --new-soft:#3a2614;
    --ok:#5cc58a; --ok-soft:#173326; --warn:#e3b04f; --warn-soft:#382b12; --bad:#f07a71; --bad-soft:#3d1c1a;
    --phone:#05090b; --screen:#11181c; --card:#19232a; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1417; --panel:#151d21; --ink:#e3eaee; --muted:#93a2aa; --line:#2a363c;
  --accent:#4fb3c2; --accent-soft:#16343a; --new:#f0a35c; --new-soft:#3a2614;
  --ok:#5cc58a; --ok-soft:#173326; --warn:#e3b04f; --warn-soft:#382b12; --bad:#f07a71; --bad-soft:#3d1c1a;
  --phone:#05090b; --screen:#11181c; --card:#19232a; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:1180px;margin:0 auto;padding:24px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:28px;align-items:start}
@media (max-width:900px){.wrap{grid-template-columns:minmax(0,1fr)}.phone-col{order:-1}}

/* Sol panel */
.side h1{font-family:var(--display);font-size:24px;margin:0 0 4px;text-wrap:balance}
.side .sub{color:var(--muted);margin:0 0 18px;max-width:62ch}
.legend{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:18px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;letter-spacing:.02em;padding:2px 7px;border-radius:999px;white-space:nowrap}
.tag.new{background:var(--new-soft);color:var(--new)}
.tag.cur{background:var(--accent-soft);color:var(--accent)}
.toggle{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 12px 4px 6px;font-size:13px}
.toggle .knob{width:30px;height:18px;border-radius:9px;background:var(--line);position:relative;transition:background .15s}
.toggle .knob::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:left .15s}
.toggle[aria-pressed="true"] .knob{background:var(--new)}
.toggle[aria-pressed="true"] .knob::after{left:14px}
.index{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px;margin-bottom:22px}
.index button{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px}
.index button[aria-current="true"]{border-color:var(--accent);box-shadow:inset 3px 0 0 var(--accent)}
.index .nm{font-weight:600;font-size:14px}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.note h2{font-size:17px;margin:0 0 4px}
.note .why{color:var(--muted);margin:0 0 12px;max-width:65ch}
.note h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
.note ul{margin:0;padding-left:18px;display:grid;gap:4px}
.note code{font-family:var(--mono);font-size:12px;background:var(--accent-soft);color:var(--accent);padding:1px 5px;border-radius:4px}
.note code.n{background:var(--new-soft);color:var(--new)}
.foot{color:var(--muted);font-size:12px;margin-top:14px;max-width:70ch}

/* Telefon */
.phone-col{position:sticky;top:16px}
.phone{width:100%;max-width:390px;margin:0 auto;height:800px;max-height:calc(100vh - 32px);min-height:620px;background:var(--phone);border-radius:46px;padding:12px;box-shadow:0 18px 40px rgba(0,0,0,.25)}
.screen{height:100%;background:var(--screen);overflow:hidden;display:flex;flex-direction:column;position:relative}
.appbar,.scroll,.tabs{padding-left:max(14px,calc((100% - 680px)/2));padding-right:max(14px,calc((100% - 680px)/2))}
.appbar{padding-top:max(12px,env(safe-area-inset-top))}
.tabs{padding-bottom:max(14px,env(safe-area-inset-bottom))}
.toast{max-width:640px;margin:0 auto}
.status{display:flex;justify-content:space-between;padding:12px 26px 4px;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums}
.appbar{display:flex;align-items:center;gap:10px;padding-bottom:10px}
.appbar .back{border:0;background:var(--card);width:32px;height:32px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 1px var(--line)}
.appbar .t{font-weight:700;font-size:17px;line-height:1.2}
.appbar .s{font-size:12px;color:var(--muted)}
.scroll{flex:1;overflow-y:auto;padding-top:10px;padding-bottom:16px;display:flex;flex-direction:column;gap:12px}
.tabs{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--card);padding:6px 4px 14px}
.tabs button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);position:relative;padding:4px 0}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="true"]{color:var(--accent);font-weight:600}
.tabs .dot{position:absolute;top:0;right:calc(50% - 18px);background:var(--bad);color:#fff;font-size:9.5px;font-weight:700;border-radius:8px;padding:0 5px;line-height:15px}

/* Uygulama bileşenleri */
.card{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 0 0 1px var(--line);position:relative}
.card h4{margin:0 0 8px;font-size:13px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.card h4 .lbl{text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600;font-size:11.5px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kpi{background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:0 0 0 1px var(--line);position:relative}
.kpi .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k{font-size:11.5px;color:var(--muted)}
.kpi .d{font-size:11.5px;font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.row{display:flex;align-items:center;gap:10px}
.av{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:700;background:var(--accent-soft);color:var(--accent);flex:none}
.grow{flex:1;min-width:0}
.nm{font-weight:600;font-size:14px}
.mut{color:var(--muted);font-size:12px}
.num{font-variant-numeric:tabular-nums}
.pill{font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)}
.list{display:flex;flex-direction:column}
.list > *{padding:10px 0;border-top:1px solid var(--line)}
.list > *:first-child{border-top:0;padding-top:2px}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:6px 10px;font-size:12.5px;font-weight:600}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
:root[data-theme="dark"] .btn.pri{color:#06232a}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.pri{color:#06232a}}
.btn.bad{color:var(--bad)}
.q{display:grid;grid-template-columns:4px minmax(0,1fr);gap:10px}
.q .sev{border-radius:2px}
.q .top{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.q .imp{font-weight:700;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.src{font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.chipbar{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chipbar button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:4px 10px;font-size:12px;white-space:nowrap}
.chipbar button[aria-pressed="true"]{background:var(--ink);color:var(--screen);border-color:var(--ink)}
.newtag{position:absolute;top:-8px;right:10px}
.ai{background:linear-gradient(0deg,var(--card),var(--card)) padding-box;border:1px solid var(--new)}
.small{font-size:12.5px}
table.t{width:100%;border-collapse:collapse;font-size:12.5px}
table.t th{text-align:left;color:var(--muted);font-weight:600;font-size:11px;padding:4px 0}
table.t td{padding:6px 0;border-top:1px solid var(--line);font-variant-numeric:tabular-nums}
table.t td.r,table.t th.r{text-align:right}
.ps{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center}
.ring{width:78px;height:78px}
.psrow{display:grid;grid-template-columns:96px minmax(0,1fr) 30px;gap:8px;align-items:center;font-size:12px}
.toast{position:absolute;left:14px;right:14px;bottom:78px;background:var(--ink);color:var(--screen);border-radius:12px;padding:10px 14px;font-size:13px;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.push{background:color-mix(in srgb,var(--card) 88%,transparent);border-radius:16px;padding:10px 12px;box-shadow:0 0 0 1px var(--line)}
.push .h{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
.lock{background:linear-gradient(160deg,#20424a,#0f2329);border-radius:18px;padding:14px 10px;display:flex;flex-direction:column;gap:8px}
.lock .clock{color:#fff;text-align:center;font-size:40px;font-weight:300;line-height:1;margin:6px 0 2px}
.lock .date{color:#cfe3e7;text-align:center;font-size:12px;margin-bottom:6px}
.rank{width:22px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.tabs{padding-left:max(4px,calc((100% - 680px)/2));padding-right:max(4px,calc((100% - 680px)/2));padding-bottom:max(14px,env(safe-area-inset-bottom))}

/* Android 9:16 cihaz görünümü */
body{min-height:100vh;display:grid;place-items:center;background:var(--bg)}
.device{position:relative;height:min(calc(100vh - 32px),calc((100vw - 32px)*16/9));height:min(calc(100dvh - 32px),calc((100vw - 32px)*16/9));aspect-ratio:9/16;background:#0b0f12;border-radius:34px;padding:7px;box-shadow:0 0 0 1px #2b3338,0 20px 50px rgba(0,0,0,.28)}
.device .screen{height:100%;border-radius:28px}
.punch{position:absolute;top:17px;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#000;box-shadow:0 0 0 2px #161b1f;z-index:5}
.status{display:flex;justify-content:space-between;align-items:center;padding:9px 22px 2px;font-size:13px;font-weight:500}
.sicons{display:flex;align-items:center;gap:5px}
.appbar{padding-top:6px}
.appbar .back{background:none;box-shadow:none;width:40px;height:40px;margin-left:-8px;border-radius:50%}
.appbar .back:hover{background:var(--accent-soft)}
.appbar .t{font-size:20px;font-weight:600}
.tabs{padding-top:10px;padding-bottom:6px}
.tabs button{gap:4px;font-size:11.5px;font-weight:500}
.tabs .ind{position:relative;width:56px;height:30px;border-radius:15px;display:grid;place-items:center;transition:background .15s}
.tabs button[aria-current="true"] .ind{background:var(--accent-soft)}
.tabs .dot{top:-3px;right:6px}
.gesture{background:var(--card);height:20px;display:grid;place-items:center}
.gesture i{width:108px;height:4px;border-radius:2px;background:var(--ink);opacity:.55}
.toast{left:12px;right:12px;bottom:96px;border-radius:6px;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.card{border-radius:16px}
.btn{border-radius:20px;padding:7px 14px}
/* Gerçek telefonda çerçevesiz, tam ekran */
@media (max-width:540px){
  body{display:block}
  .device{height:100vh;height:100dvh;width:100%;aspect-ratio:auto;padding:0;border-radius:0;box-shadow:none;background:none}
  .device .screen{border-radius:0}
  .punch,.status,.gesture{display:none}
  .appbar{padding-top:max(12px,env(safe-area-inset-top))}
  .tabs{padding-bottom:max(10px,env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="device">
<div class="punch" aria-hidden="true"></div>
<div class="screen" id="screen">
  <div class="status" aria-hidden="true"><span class="num">11:45</span><span class="sicons">
    <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor"><path d="M12 20.5 1.5 9.2a15 15 0 0 1 21 0z"/></svg>
    <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M2 22h20V2z"/></svg>
    <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M9 2h6v2h2a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h2zm-1 6v12h8V8z"/></svg>
    <span style="font-size:11.5px">78%</span></span></div>
  <div class="appbar" id="appbar"></div>
  <div class="scroll" id="view"></div>
  <nav class="tabs" id="tabs" aria-label="Uygulama menüsü"></nav>
  <div class="gesture" aria-hidden="true"><i></i></div>
  <div class="toast" id="toast" role="status"></div>
</div>
</div>

<script>
// ---------- Örnek veri ----------
const TL = n => '₺' + Math.round(n).toLocaleString('tr-TR');
const pct = n => '%' + Math.round(n*100);
const team = [
  {id:'emre',  ad:'Emre Yıldız',  durum:'sahada',  z:[14,22], satis:48200, hedef:62000, etkin:.71, ps:72, son:'Kaya Market · 11:42', x:120,y:150},
  {id:'kerem', ad:'Kerem Aydın',  durum:'devamsiz',z:[0,18],  satis:0,     hedef:55000, etkin:0,   ps:null, son:'Rapor · 08:10 bildirdi', x:0,y:0},
  {id:'selin', ad:'Selin Arslan', durum:'sahada',  z:[17,21], satis:61900, hedef:58000, etkin:.86, ps:81, son:'Göksu Şarküteri · 11:40', x:230,y:110},
  {id:'burak', ad:'Burak Koç',    durum:'rotadisi',z:[9,20],  satis:22400, hedef:52000, etkin:.55, ps:64, son:'47 dk rota dışı · Dokuma', x:300,y:200},
  {id:'hakan', ad:'Hakan Şimşek', durum:'sahada',  z:[12,19], satis:39800, hedef:50000, etkin:.68, ps:70, son:'Ahatlı Gıda · 11:31', x:180,y:240},
  {id:'zeynep',ad:'Zeynep Kurt',  durum:'sahada',  z:[15,20], satis:54100, hedef:54000, etkin:.80, ps:78, son:'Şafak Büfe · 11:44', x:80,y:220},
  {id:'onur',  ad:'Onur Çelik',   durum:'mola',    z:[11,22], satis:31500, hedef:57000, etkin:.59, ps:66, son:'Mola · 25 dk', x:250,y:60},
  {id:'gokhan',ad:'Gökhan Polat', durum:'sahada',  z:[13,19], satis:44700, hedef:49000, etkin:.74, ps:75, son:'Teomanpaşa Market · 11:38', x:60,y:90},
];
const DUR = {sahada:['Sahada','ok'], devamsiz:['Devamsız','bad'], rotadisi:['Rota dışı','warn'], mola:['Molada','info']};
const ini = s => s.split(' ').map(p=>p[0]).join('').slice(0,2);
const sum = (k,i) => team.reduce((a,t)=>a+(i===undefined?t[k]:t[k][i]),0);

const queue = [
  {id:1, tip:'Devamsızlık', sev:'bad', imp:24600, src:'Canlı izleme', t:'Kerem Aydın raporlu. 18 planlı müşteri boşta.', d:'6 müşteri "mutlaka sipariş" listesinde. Pazartesi siparişleri Perşembe sevkiyatını besliyor.', acts:[['Rotayı devret','devamsizlik','pri'],['Sipariş kurtar','devamsizlik']]},
  {id:2, tip:'Rota sapması', sev:'warn', imp:14200, src:'Canlı izleme', t:'Burak Koç 47 dk rota dışında (Dokuma).', d:'11 ziyaret kaldı, hedefin %43\'ünde. Bu hızla gün %58 kapanır.', acts:[['Plasiyeri aç','plasiyer:burak','pri'],['Ara','toast:Arama başlatılıyor (mockup)']]},
  {id:3, tip:'Kayıp riski', sev:'warn', imp:9800, src:'Pusula', t:'Ekin Şarküteri: sipariş 3 haftada %62 düştü.', d:'Son ziyarette rakip stand fotoğraflandı. Aylık kayıp tahmini.', acts:[['Eşlik ziyareti planla','toast:Perşembe 10:00 eşlik ziyareti taslağı oluşturuldu (mockup)','pri'],['Mağazayı aç','magaza']]},
  {id:4, tip:'Onay', sev:'info', imp:6300, src:'Onaylar', t:'Öz Akdeniz Büfe için %7 iskonto talebi.', d:'Limit %5. Selin Arslan 2 saattir onay bekliyor, müşteri yanında.', acts:[['Onayla','toast:İskonto onaylandı, Selin\'e bildirildi (mockup)','pri'],['Reddet','toast:Red nedeni seçme ekranı açılır (mockup)','bad']]},
  {id:5, tip:'Stok dışı', sev:'warn', imp:4100, src:'Görüntü tanıma', t:'Kaya Market: 3 SKU rafta yok.', d:'11:38 raf fotoğrafından tespit edildi. Depoda stok var.', acts:[['Merch görevi ata','toast:Cem Uysal\'a raf dolum görevi atandı (mockup)','pri'],['Mağazayı aç','magaza']]},
  {id:6, tip:'Hedef riski', sev:'info', imp:3900, src:'Tahmin', t:'Onur Çelik günü %61 ile kapatacak.', d:'Etkin ziyaret oranı %59, ekip ortalaması %72.', acts:[['Koçluk önerisini gör','plasiyer:onur','pri']]},
  {id:7, tip:'Masraf', sev:'info', imp:1240, src:'Onaylar', t:'4 masraf kalemi onay bekliyor.', d:'Yakıt, otopark, yemek. Hepsi politika sınırında.', acts:[['Onaylara git','onaylar','pri']]},
];
const SEVC = {bad:'var(--bad)',warn:'var(--warn)',info:'var(--accent)'};

const coaching = {
  burak:{skill:.62, will:.35, kpi:'Etkin ziyaret %55 (ekip %72), rota uyumu %61', konu:'Son 2 haftada öğleden sonra rota dışına çıkma sıklaştı. Motivasyon konuşması: hedef bölünmesi ve öğleden sonra rotasının yeniden sıralanması. Perşembe eşlik ziyareti önerilir.'},
  onur:{skill:.38, will:.70, kpi:'Etkin ziyaret %59, sepet başı SKU 4,1 (ekip 6,3)', konu:'İstekli ama satış tekniği zayıf: sepet genişletmede zorlanıyor. Çapraz satış senaryosu üzerine 15 dk saha içi eğitim. Selin Arslan ile bir gün birlikte çalışması önerilir.'},
  emre:{skill:.72, will:.74, kpi:'Etkin ziyaret %71, Perfect Store 72', konu:'Dengeli performans. Raf payı hedefini öne çıkarın: Kaya Market ve iki market daha %40 hedefinin altında.'},
};

const reassign = [
  {to:'Selin Arslan', n:6, km:'+9 km', kap:'4 ziyaret boşluğu + 2 öğleden sonra', must:3},
  {to:'Gökhan Polat', n:5, km:'+6 km', kap:'5 ziyaret boşluğu', must:2},
  {to:'Zeynep Kurt',  n:4, km:'+11 km', kap:'4 ziyaret boşluğu', must:1},
  {to:'Perşembe\'ye ertele', n:3, km:'—', kap:'Düşük öncelik, sipariş günü değil', must:0},
];
const recovery = [

  const shelf = (row, items) => items.map((it,i)=>{const x=6+i*27;const y=10+row*44;
    if(it==='x') return `<rect x="${x}" y="${y}" width="24" height="34" fill="none" stroke="var(--bad)" stroke-width="1.5" stroke-dasharray="3 2"/><text x="${x+12}" y="${y+21}" font-size="11" text-anchor="middle" fill="var(--bad)">?</text>`;
    const c = it==='b'?'var(--accent)':'var(--muted)'; const o = it==='b'?.85:.35;
    return `<rect x="${x}" y="${y}" width="24" height="34" rx="2" fill="${c}" opacity="${o}"/>${it==='b'?`<rect x="${x-1}" y="${y-1}" width="26" height="36" fill="none" stroke="var(--new)" stroke-width="1"/>`:''}`}).join('');
  return `
  <div class="card">${curTag()}<div class="row"><div class="grow"><div class="nm">Kaya Market</div><div class="mut">Varsak, Kepez · Plasiyer Emre Yıldız · Merch Cem Uysal</div></div><span class="pill warn">Bakiye ${TL(6850)} · 38 gün</span></div></div>
  <div class="card isnew">${newTag()}<h4><span class="lbl">Perfect Store</span><span class="mut">son ziyaret 11:38</span></h4>
   <div class="ps">${ring(68)}<div style="display:grid;gap:6px">${parts.map(([k,v])=>`<div class="psrow"><span>${k}</span>${bar(v/100, v>=75?'var(--ok)':v>=65?'var(--warn)':'var(--bad)')}<span class="num" style="text-align:right">${v}</span></div>`).join('')}</div></div>
   <p class="small mut" style="margin:8px 0 0">Ağırlıklar yönetimden ayarlanır: bulunurluk 30, planogram 25, raf payı 20, stand 15, fiyat 10.</p>
  </div>
  <div class="card isnew">${newTag()}<h4><span class="lbl">Raf fotoğrafı analizi</span><span class="src">Görüntü tanıma</span></h4>
   <svg viewBox="0 0 330 140" style="width:100%;background:var(--screen);border-radius:8px" role="img" aria-label="Raf fotoğrafı tespit sonucu: 42 facing, 13 bizim, 3 eksik SKU">
    <line x1="0" y1="46" x2="330" y2="46" stroke="var(--line)" stroke-width="3"/><line x1="0" y1="90" x2="330" y2="90" stroke="var(--line)" stroke-width="3"/><line x1="0" y1="134" x2="330" y2="134" stroke="var(--line)" stroke-width="3"/>
    ${shelf(0,['b','b','b','r','r','r','x','r','r','r','r','b'])}${shelf(1,['r','r','b','b','x','r','r','r','b','b','r','r'])}${shelf(2,['b','b','r','r','r','r','x','r','b','b','r','r'])}
   </svg>
   <div class="kpis" style="margin-top:8px">
    <div class="kpi"><div class="k">Raf payı</div><div class="v" style="font-size:18px;color:var(--bad)">%31</div><div class="mut">Hedef %40 · 13/42 facing</div></div>
    <div class="kpi"><div class="k">Rafta yok</div><div class="v" style="font-size:18px">3 SKU</div><div class="mut">Depoda stok var</div></div>
   </div>
   <div class="small" style="margin-top:8px">Şeftali meyve suyu 1L · Limonlu gazoz 330ml · Soğuk çay 500ml</div>
   <div class="btns">${act(['Merch görevi ata','toast:Cem Uysal\'a raf dolum görevi atandı (mockup)','pri'])}</div>
  </div>
  <div class="card ai isnew">${newTag()}<h4><span class="lbl">Ziyaret öncesi özet</span><span class="src">AI taslağı</span></h4>
   <p class="small" style="margin:0">Son 4 haftada ciro ${TL(41200)}, önceki 4 haftaya göre %8 düşük. Düşüş soğuk içecekte: soğutucu doluluğu %55. Açık bakiye ${TL(6850)}, 38 gündür ödenmedi. Önerilen konuşma: soğutucu dolumu ve şeftali 1L'nin yeniden listelenmesi. Bakiye için tahsilat planı konuşulmalı.</p>
   <div class="mut" style="font-size:11px;margin-top:6px">Kaynaklar: satış geçmişi · 11:38 raf analizi · cari hesap · Pusula bulgusu #2214</div>
  </div>
  <div class="card">${curTag()}<h4><span class="lbl">Cari ve son faturalar</span></h4><div class="list small">
   <div class="row"><span class="grow">FTR-2026-118834 · 16 Kas</span><span class="num">${TL(3920)}</span></div>
   <div class="row"><span class="grow">FTR-2026-117412 · 9 Kas</span><span class="num">${TL(2930)}</span></div>
  </div></div>`;
 },
 onaylar(){
  return `<div class="card">${curTag()}<div class="list">${approvals.map(a=>`<div><div class="row"><span class="pill ${a.sev}">${a.tip}</span><span class="grow"></span><span class="mut isnew" style="position:relative">${a.yas} bekliyor</span></div><div class="nm" style="margin-top:4px">${a.k}</div><div class="mut">${a.d}</div><div class="btns">${act(['Onayla','toast:Onaylandı (mockup)','pri'])}${act(['Reddet','toast:Red nedeni seçme ekranı açılır (mockup)','bad'])}</div></div>`).join('')}</div></div>`;
 },
 lig(){
  const max=league[0].p;
  return `
  <div class="card isnew">${newTag()}<div class="nm">Kasım · Soğutucu Dolum Ligi</div><div class="mut">Puan: soğutucu doluluk artışı ×2, Perfect Store artışı ×1, etkin ziyaret ×1 · bitiş 30 Kasım</div></div>
  <div class="card isnew"><div class="list">${league.map((l,i)=>`<div class="row"><span class="rank">${i+1}</span><div class="av">${ini(l.ad)}</div><div class="grow"><div class="nm" style="font-size:13px">${l.ad}</div>${bar(l.p/max, i<3?'var(--new)':'var(--accent)')}</div><div style="text-align:right"><div class="num" style="font-weight:700">${l.p.toLocaleString('tr-TR')}</div><div class="mut num">${l.d==='0'?'—':l.d}</div></div></div>`).join('')}</div></div>
  <div class="btns">${act(['Yeni yarışma kur','toast:Kural seçme sihirbazı açılır (mockup)','pri'])}${act(['Ekiple paylaş','toast:Lig tablosu ekibe duyuru olarak gönderildi (mockup)'])}</div>`;
 },
 bildirimler(){
  return `
  <div class="lock isnew">${newTag()}<div class="clock">11:45</div><div class="date">23 Kasım Pazartesi</div>
   ${pushes.map(p=>`<div class="push"><div class="h"><span><b style="color:var(--ink)">XField Şef</b> · ${p.h}</span><span>${p.t}</span></div><div class="small" style="margin-top:2px">${p.b}</div></div>`).join('')}
  </div>
  <div class="card isnew">${newTag()}<h4><span class="lbl">Bildirim tercihleri</span></h4><div class="list small">
   ${[['Devamsızlık ve rota sapması','Hemen'],['Onay talepleri','Hemen'],['Stok dışı ve görüntü tanıma','Saatlik özet'],['Günün planı','09:00'],['Lig değişimleri','Kapalı']].map(([k,v])=>`<div class="row"><span class="grow">${k}</span><span class="pill info">${v}</span></div>`).join('')}
  </div></div>`;
 },
};

function qItem(q){
  return `<div class="q"><div class="sev" style="background:${SEVC[q.sev]}"></div><div><div class="top"><span class="mut">${q.tip} · <span class="src">${q.src}</span></span><span class="imp">${TL(q.imp)}</span></div><div class="nm" style="margin-top:2px">${q.t}</div><div class="mut">${q.d}</div><div class="btns">${q.acts.map(act).join('')}</div></div></div>`;
}
function repRow(t){
  const [lbl,cls]=DUR[t.durum];
  return `<div class="row" data-rep="${t.id}" style="cursor:pointer" tabindex="0" role="button" aria-label="${t.ad} detayı"><div class="av">${ini(t.ad)}</div><div class="grow"><div class="row" style="gap:6px"><span class="nm">${t.ad}</span><span class="pill ${cls}">${lbl}</span></div><div class="mut">${t.son}</div>${t.durum==='devamsiz'?'':bar(t.satis/t.hedef, t.satis>=t.hedef?'var(--ok)':undefined)}</div><div style="text-align:right"><div class="num" style="font-weight:600;font-size:13px">${t.z[0]}/${t.z[1]}</div><div class="mut num">${t.durum==='devamsiz'?'—':pct(t.satis/t.hedef)}</div></div></div>`;
}

// ---------- Render ----------
const $ = id => document.getElementById(id);
function render(){
  const sc = SCREENS[state.screen];
  const isTab = ['bugun','aksiyonlar','ekip','magaza'].includes(state.screen) || state.screen==='daha';
  const title = state.screen==='plasiyer' ? (team.find(t=>t.id===state.rep)||{}).ad : sc.ad;
  const sub = {bugun:'Murat Demir · Antalya Kepez-1',aksiyonlar:'Etkiye göre sıralı',ekip:'8 plasiyer · canlı',plasiyer:'Gün görünümü',devamsizlik:'Kerem Aydın · 23 Kasım',magaza:'Müşteri kartı',onaylar:'5 bekleyen',lig:'Kasım dönemi',bildirimler:'Push önizlemesi'}[state.screen];
  $('appbar').innerHTML = `${['bugun','aksiyonlar','ekip','magaza'].includes(state.screen)?'':'<button class="back" data-back aria-label="Geri"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12H4m6-6-6 6 6 6"/></svg></button>'}<div><div class="t">${state.screen==='bugun'?'Günaydın, Murat Bey':title}</div><div class="s">${sub}</div></div>`;
  $('view').innerHTML = views[state.screen]();
  $('view').scrollTop = 0;
  $('tabs').innerHTML = TABS.map(([id,l,d])=>`<button data-tab="${id}" aria-current="${sc.tab===id}"><span class="ind"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>${id==='aksiyonlar'?'<span class="dot">7</span>':''}</span>${l}</button>`).join('');
}
let hist=[];
function go(target){
  if(target.startsWith('toast:')) return toast(target.slice(6));
  if(target.startsWith('plasiyer:')){ state.rep=target.split(':')[1]; target='plasiyer'; }
  if(target==='daha') target='onaylar';
  if(!SCREENS[target]) return;
  if(target!==state.screen) hist.push(state.screen);
  state.screen=target; render();
  try{ if(location.hash!=='#'+target) history.replaceState(null,'','#'+target); }catch(_){ /* korumalı çerçevede adres güncellenemez; gezinme yine çalışır */ }
}
let tt; function toast(msg){ const el=$('toast'); el.textContent=msg; el.classList.add('on'); clearTimeout(tt); tt=setTimeout(()=>el.classList.remove('on'),2600); }

document.addEventListener('click', e=>{
  const g=e.target.closest('[data-go]'); if(g){ go(g.dataset.go); return; }
  const tb=e.target.closest('[data-tab]'); if(tb){ hist=[]; go(tb.dataset.tab); return; }
  const r=e.target.closest('[data-rep]'); if(r){ const t=team.find(x=>x.id===r.dataset.rep); if(t.durum==='devamsiz') go('devamsizlik'); else go('plasiyer:'+t.id); return; }
  const f=e.target.closest('[data-filter]'); if(f){ state.filter=f.dataset.filter; render(); return; }
  if(e.target.closest('[data-back]')){ go(hist.pop()||'bugun'); hist.pop(); return; }
});
document.addEventListener('keydown', e=>{ if((e.key==='Enter'||e.key===' ') && e.target.matches('[data-rep]')){ e.preventDefault(); e.target.click(); }});
window.addEventListener('hashchange', ()=>{ const h=location.hash.slice(1); if(SCREENS[h] && h!==state.screen){ state.screen=h; render(); }});
const h0=location.hash.slice(1); if(SCREENS[h0]) state.screen=h0;
render();
</script>
</body>
</html>
