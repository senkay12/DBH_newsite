<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EFB455">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>XMobile — Canlı Sunum (Mevcut yapı + Kasım 2026 yenilikleri)</title>
<style>
:root{
  --red:#EFB455; --acc:#9A2C1F; --red-d:#7A2216; --red-dd:#5E1A12; --bar:#3A3D42; --bar2:#5F656D;
  --bg:#F2F3F5; --card:#fff; --line:#E3E5E8; --fg:#1E2329; --fg2:#5B636E; --fg3:#9AA1AB;
  --ok:#1E8E5A; --okbg:#E3F5EC; --warn:#8A6500; --teal:#7A2216; --blue:#1D5FD1; --bluebg:#E8F0FD;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:Roboto,"Segoe UI",Arial,sans-serif;background:#1d2026;color:var(--fg);min-height:100vh;display:flex;justify-content:center;align-items:center;padding:24px;-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select,textarea{font:inherit;color:inherit}
/* ---------- phone ---------- */
.phone{width:412px;height:880px;background:#000;border-radius:40px;padding:12px;box-shadow:0 30px 80px rgba(0,0,0,.5);flex:none}
.screen{width:100%;height:100%;border-radius:30px;overflow:hidden;background:var(--bg);position:relative;display:flex;flex-direction:column}
.status{height:26px;background:var(--red);color:#000;display:flex;align-items:center;justify-content:space-between;padding:0 18px;font-size:13px;font-weight:500;flex:none}
.status.dark{background:var(--red-dd)}
.appbar{height:52px;background:#fff;display:flex;align-items:center;padding:0 6px;gap:2px;border-bottom:1px solid var(--line);flex:none}
.appbar .ib{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.appbar .ib:active{background:#eee}
.appbar .title{flex:1;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
.ico{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.on{color:#1E9E4A}.off{color:#C0392B}
.body{flex:1;overflow-y:auto;position:relative}
.bottom{display:flex;background:#E9EAEC;flex:none;min-height:52px}
.bottom button{flex:1;font-weight:700;font-size:14px;padding:8px 4px;line-height:1.15}
.bottom button.primary{background:var(--red);color:#000}
.bottom button:active{filter:brightness(.92)}
/* custhead */
.custhead{background:var(--bar);color:#fff;display:flex;align-items:center;gap:10px;padding:8px 12px;flex:none}
.thumb{width:44px;height:44px;border-radius:6px;background:#EEF0F2;display:flex;align-items:center;justify-content:center;color:#A0A6AE;flex:none}
.custhead .c1{font-weight:700;font-size:14px}.custhead .c2{font-weight:700;font-size:14px}
.pill{border-radius:20px;padding:3px 10px;font-weight:700;font-size:13px;white-space:nowrap}
.pill.neg{background:#F3DED8;color:#9A2C1F}.pill.pos{background:var(--okbg);color:var(--ok)}
.tabs{display:flex;background:var(--bar2);overflow-x:auto;flex:none}
.tabs button{color:#fff;font-weight:700;font-size:15px;padding:13px 16px;white-space:nowrap;opacity:.95}
.tabs button.act{background:var(--bar);opacity:1;color:#C9CDD3}
.daytabs{display:flex;background:var(--bar);overflow-x:auto;flex:none}
.daytabs button{color:#fff;padding:9px 12px;text-align:left;white-space:nowrap;min-width:92px}
.daytabs button b{font-size:16px}.daytabs button small{display:block;font-size:12px;opacity:.85}
.daytabs .cnt{display:inline-block;background:rgba(255,255,255,.25);border-radius:12px;padding:0 7px;font-size:12px;margin-left:6px}
.daytabs button.act{background:#55595F}
.search{display:flex;gap:8px;align-items:center;padding:10px 12px;background:#ECEDEF}
.search .box{flex:1;display:flex;align-items:center;gap:8px;background:#fff;border-radius:10px;padding:9px 12px;color:var(--fg3)}
.search .box input{border:0;outline:0;flex:1;background:transparent;color:var(--fg)}
/* cards & lists */
.card{background:#fff;border-radius:12px;margin:10px 12px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.row{display:flex;align-items:center;gap:10px}
.sp{flex:1}
.muted{color:var(--fg2)}.small{font-size:12px}.tiny{font-size:11px}
.h3{font-weight:700;font-size:15px}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv .chip{background:#5F656D;color:#fff;border-radius:6px;font-size:11px;padding:2px 8px;display:inline-block;margin-bottom:3px}
.kv .v{font-weight:600;font-size:14px}
.list .it{background:#fff;border-bottom:1px solid var(--line);padding:12px 14px;display:flex;gap:10px;align-items:center}
.list .it:active{background:#f6f6f6}
.cust .no{color:var(--fg3);font-weight:700}.cust .code{font-weight:700}
.dot{width:14px;height:14px;border-radius:50%;background:#111;display:inline-block;vertical-align:middle}
.dot.sale{background:var(--ok)}.dot.nosale{background:#E2A400}.dot.planned{background:#111}.dot.none{background:#C5CAD1}
.amt{font-weight:700;font-size:13px;padding:2px 8px;border-radius:6px}
.amt.neg{color:#9A2C1F;background:#F8ECE6}.amt.pos{color:var(--ok);background:var(--okbg)}
.badge{display:inline-flex;align-items:center;gap:3px;border-radius:8px;padding:2px 7px;font-size:12px;font-weight:600}
.badge.g{background:var(--okbg);color:var(--ok)}.badge.r{background:#F8ECE6;color:#9A2C1F}.badge.b{background:var(--bluebg);color:var(--blue)}
.new{background:#000;color:#EFB455;border-radius:4px;font-size:10px;font-weight:700;padding:1px 5px;margin-left:6px;vertical-align:middle;letter-spacing:.4px}
.btn{border-radius:8px;padding:11px 16px;font-weight:700;font-size:15px;text-align:center}
.btn.red{background:var(--red);color:#000}.btn.gray{background:#F0F1F3;color:var(--fg)}.btn.blue{background:var(--bluebg);color:var(--blue)}
.btn.out{border:1px solid var(--line);background:#fff}
.btn:active{filter:brightness(.93)}
.field{margin:10px 0}.field label{display:block;font-size:12px;color:var(--fg2);margin-bottom:4px;font-weight:600}
.field input,.field select,.field textarea{width:100%;border:1px solid #CDD2D8;border-radius:8px;padding:9px 10px;background:#fff;outline:0}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.empty{text-align:center;color:var(--fg3);padding:40px 20px}
/* home */
.hero{background:#EFB455;color:#000;padding:18px 16px;display:flex;align-items:center;gap:14px;position:relative}
.hero .av{width:70px;height:70px;border-radius:50%;background:#D9D9D9;display:flex;align-items:center;justify-content:center;color:#888}
.hero .nm{font-size:20px;font-weight:700}.hero .ver{position:absolute;right:14px;top:12px;font-size:11px;opacity:.75;text-align:right}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:12px}
.quick button{background:#fff;border-radius:10px;padding:14px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.quick svg{color:var(--acc);width:30px;height:30px}
.bars{display:flex;align-items:flex-end;justify-content:space-around;height:150px;padding:10px 6px 0}
.bars .b{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--fg2);width:64px}
.bars .b i{display:block;width:36px;border-radius:3px 3px 0 0}
.seg{display:flex;background:#ECEDEF;border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:7px;border-radius:8px;font-size:13px;font-weight:600;color:var(--fg2)}
.seg button.act{background:#fff;color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.1)}
/* visit hub */
.visithead{background:#55595F;color:#fff;padding:10px 14px;font-size:15px;line-height:1.5}
.acts{display:flex;justify-content:space-around;background:var(--red);padding:8px 4px}
.acts button{color:#000;display:flex;flex-direction:column;align-items:center;font-size:10px;gap:2px;width:60px}
.acts svg{width:26px;height:26px}
.task{display:flex;align-items:center;gap:12px;background:#fff;margin:8px 12px;border-radius:10px;padding:13px 14px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.task .ic{width:38px;height:38px;border-radius:50%;background:#F8ECE6;color:var(--acc);display:flex;align-items:center;justify-content:center;flex:none}
.task.done .ic{background:var(--okbg);color:var(--ok)}
.req{font-size:10px;color:#9A2C1F;font-weight:700}
.today{background:#FFF8E6;border:1px solid #F3D98B;border-radius:12px;margin:10px 12px;padding:12px 14px}
.today .lbl{font-size:11px;font-weight:800;letter-spacing:1px;color:var(--warn)}
.today li{list-style:none;padding:5px 0;font-size:14px;display:flex;gap:8px}
.today li:before{content:"!";color:#fff;background:#D08A00;border-radius:50%;width:18px;height:18px;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;flex:none;margin-top:1px}
/* products */
.prod{display:flex;gap:12px;background:#fff;border-bottom:1px solid var(--line);padding:12px}
.prod .img{width:58px;height:74px;border-radius:6px;background:#F0F1F3;display:flex;align-items:center;justify-content:center;flex:none}
.prod .nm{font-size:14px}.prod .nm b{font-weight:700}
.prod .pr{font-weight:700;margin:3px 0}
.cartbtn{width:46px;height:46px;border-radius:50%;background:var(--red);color:#000;display:flex;align-items:center;justify-content:center;flex:none;align-self:center;position:relative}
.cartbtn .q{position:absolute;top:-4px;right:-4px;background:#111;color:#fff;border-radius:10px;font-size:11px;padding:1px 6px}
.fab{position:absolute;right:16px;bottom:16px;width:58px;height:58px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,.3);font-size:24px;z-index:5}
.fab .new{position:absolute;top:-6px;left:-14px}
table.t{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
table.t th{background:#5F656D;color:#fff;font-weight:600;padding:8px 6px;text-align:left;font-size:12px}
table.t td{border-bottom:1px solid var(--line);padding:8px 6px}
table.t td.n{text-align:right}
/* overlays */
.ov{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:14px}
.ov.sheet{align-items:flex-end;padding:0}
.dlg{background:#fff;border-radius:14px;width:100%;max-height:92%;overflow-y:auto;padding:22px 20px;position:relative}
.dlg .bang{width:46px;height:46px;border-radius:50%;border:3.5px solid #8A6500;color:#8A6500;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;margin:0 auto 10px}
.dlg .bang.blue{border-color:#3B8EDB;color:#3B8EDB}
.dlg h2{text-align:center;font-size:21px;font-weight:800}
.dlg .st{text-align:center;color:var(--fg2);font-size:14px;margin-top:2px}
.dlg hr{border:0;border-top:1px solid var(--line);margin:14px 0}
.dlg .x{position:absolute;right:14px;top:14px;width:34px;height:34px;border-radius:50%;background:#EEF0F2;display:flex;align-items:center;justify-content:center}
.sec{font-size:12px;font-weight:800;letter-spacing:.8px;color:var(--fg3);margin-top:12px}
.sheetbox{background:#fff;border-radius:22px 22px 0 0;width:100%;max-height:90%;overflow-y:auto;padding:10px 18px 22px}
.grab{width:46px;height:5px;border-radius:3px;background:#CDD2D8;margin:2px auto 12px}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat3 div{background:#F2F3F5;border-radius:12px;padding:10px 12px}
.stat3 small{display:block;font-size:11px;font-weight:700;color:var(--fg2);letter-spacing:.5px}
.stat3 b{font-size:17px}
.sug{background:#F2F3F5;border-radius:16px;padding:14px;margin:10px 0}
.sug .hd{display:flex;gap:10px;align-items:flex-start}
.spark{width:30px;height:30px;border-radius:8px;background:var(--bluebg);color:var(--blue);display:flex;align-items:center;justify-content:center;flex:none}
.sug .acts2{display:flex;gap:6px;margin-top:10px;margin-left:40px;flex-wrap:wrap}
.sug .acts2 button{padding:8px 12px;border-radius:10px;font-weight:600;color:var(--fg2)}
.sug .acts2 button.a{background:var(--bluebg);color:var(--blue)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.chips button{background:#F0F1F3;border-radius:22px;padding:10px 6px;font-size:14px}
.chips button.act{background:var(--red);color:#000}
.toast{position:absolute;left:50%;bottom:72px;transform:translateX(-50%);background:#222;color:#fff;border-radius:20px;padding:9px 16px;font-size:13px;z-index:80;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
/* drawer */
.drawer{position:absolute;inset:0;z-index:40;display:flex}
.drawer .l{width:42%;background:#EEF0F2;overflow-y:auto;display:flex;flex-direction:column}
.drawer .r{width:58%;background:#fff;overflow-y:auto;box-shadow:4px 0 16px rgba(0,0,0,.2)}
.drawer .l button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 6px;font-size:12px;border-bottom:1px solid #E1E3E6;color:var(--fg2)}
.drawer .l button.act{background:#fff;color:var(--acc);font-weight:700}
.drawer .l button svg{width:26px;height:26px}
.drawer .r .grp{font-size:11px;font-weight:800;letter-spacing:.8px;color:var(--fg3);padding:12px 14px 4px}
.drawer .r button{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;font-size:14px;text-align:left;border-bottom:1px solid #F0F1F3}
.drawer .r button svg{width:22px;height:22px;color:var(--acc);flex:none}
.drawer .close{margin-top:auto;background:var(--red)!important;color:#000!important}
.matrix td.st{color:#D08A00;font-weight:800}
.mic{display:inline-flex;align-items:center;gap:8px;background:var(--bluebg);color:var(--blue);border-radius:12px;padding:10px 14px;font-weight:700}
.listening{background:#F8ECE6;color:#9A2C1F;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.6}}
.login{flex:1;background:#EFB455;display:flex;flex-direction:column;justify-content:center;padding:26px}
.login .logo{color:#000;font-size:34px;font-weight:800;text-align:center;letter-spacing:1px;margin-bottom:6px}
.login .tag{color:#5E1A12;text-align:center;font-size:13px;margin-bottom:20px}
.login .card{margin:0}
.chk{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;margin:6px 0 12px}
.chk label{display:flex;align-items:center;gap:5px}
.prog{height:10px;background:#E1E3E6;border-radius:5px;overflow:hidden}.prog i{display:block;height:100%;background:var(--red);transition:width .2s}
.gauge{display:flex;flex-direction:column;align-items:center;gap:6px}
.map{position:relative;height:100%;min-height:600px;background:#E9EFE6;overflow:hidden}
.map .pin{position:absolute;transform:translate(-50%,-100%);background:var(--acc);color:#fff;border-radius:14px 14px 14px 0;font-size:11px;font-weight:700;padding:3px 7px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.photo{aspect-ratio:1;border-radius:8px;background:linear-gradient(135deg,#d6dbe1,#eef0f3);display:flex;align-items:center;justify-content:center;color:#8A929C;font-size:11px;text-align:center;padding:4px}

/* ---------- mobil tarayıcı: tam ekran ---------- */
@media (max-width:600px), (pointer:coarse){
  body{padding:0;background:var(--bg);display:block}
  .phone{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}
  .screen{border-radius:0;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
  .status{display:none}
  input,select,textarea{font-size:16px!important}
  .body{-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
  .appbar .ib{width:36px}
}
html.mob body{padding:0;background:var(--bg);display:block}
html.mob .phone{width:100%;height:100vh;height:100dvh;border-radius:0;padding:0;box-shadow:none}
html.mob .screen{border-radius:0}
html.mob .status{display:none}

/* ================= YENİ TASARIM ================= */
body{flex-direction:column}
.dtog{margin-bottom:14px}
html.mob .dtog{display:none}
.useg{display:inline-flex;background:#2A2E35;border-radius:24px;padding:4px;gap:4px}
.useg button{padding:9px 16px;border-radius:20px;color:#C9CDD3;font-size:14px;font-weight:600}
.useg button.act{background:#fff;color:#000000}
.screen .useg{background:#EEF0F3;display:flex;margin-top:10px}
.screen .useg button{flex:1;color:#5B6470}
.screen .useg button.act{background:#fff;color:#000000;box-shadow:0 1px 2px rgba(0,0,0,.12)}
.screen.nu{--red:#EFB455;--acc:#9A2C1F;--bg:#F6F7F9;--line:#E6E8EC;--fg:#000000;--fg2:#5B6470;--fg3:#6B7380;--ok:#17703F;--okbg:#E3F4EA;--warn:#8A5A00;--teal:#7A2216;--blue:#1F5FD1;--bluebg:#E8F0FE;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg)}
.nu .status{background:var(--bg);color:var(--fg)}
.ntop{display:flex;align-items:center;gap:6px;padding:10px 12px 8px 16px;background:var(--bg);flex:none}
.nib{width:40px;height:40px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--fg);flex:none}
.nib:active{background:#E6E8EC}
.nib.out{border:1px solid var(--line);border-radius:16px;width:48px;height:48px;background:#fff}
.ntitle{font-size:21px;font-weight:700;letter-spacing:-.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nsub{font-size:13px;color:var(--fg2);line-height:1.4}
.npill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:7px 11px;font-size:12px;font-weight:600;background:#fff;border:1px solid var(--line);flex:none;color:var(--fg)}
.npill i{width:8px;height:8px;border-radius:50%;background:#17A35A}
.npill.off i{background:#9AA1AB}
.nband{background:#FFF4D6;color:#8A5A00;font-size:13px;font-weight:600;padding:9px 16px;display:flex;gap:8px;align-items:center;flex:none}
.nband .ico{width:18px;height:18px}
.ncard{background:#fff;border-radius:20px;margin:10px 12px;padding:16px;border:1px solid var(--line)}
.ncard.np0{padding:2px 0}
.ninfo{background:#FCEFD6;border-color:#F3D9A6}
.nnext{box-shadow:0 8px 24px rgba(21,25,30,.08);border-color:#D5D9DF}
.nsec{font-size:13px;font-weight:700;color:var(--fg2);margin:18px 18px 2px}
.nlabel{font-size:12px;font-weight:600;color:var(--fg3);margin-bottom:2px}
.nbig{font-size:24px;font-weight:700;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.nstats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0}
.nstats div,.nmet{background:var(--bg);border-radius:14px;padding:10px 12px}
.nstats span,.nmet span{display:block;font-size:12px;color:var(--fg2)}
.nstats b,.nmet b{font-size:15px;font-variant-numeric:tabular-nums}
.nmets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.nbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:16px;padding:12px 18px;font-weight:700;font-size:15px;min-height:50px}
.nbtn .ico{width:20px;height:20px}
.nbtn.primary{background:var(--red);color:#000}
.nbtn.tonal{background:#EEF0F3;color:var(--fg)}
.nbtn.outline{background:#fff;border:1.5px solid #D5D9DF;color:var(--fg)}
.nbtn.full{width:100%}
.nbtn.sm{min-height:36px;padding:7px 12px;font-size:13px;border-radius:12px}
.nbtn.sm .ico{width:16px;height:16px}
.nbtn:active,.nchipbtn:active,.nadd:active{transform:scale(.97)}
.nname{font-size:18px;display:block}
.nmeta{font-size:13px;color:var(--fg2);display:flex;align-items:center;gap:4px;margin-top:4px}
.nmeta .ico,.nsub .ico,.nflag .ico{width:15px;height:15px;flex:none}
.nflags{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.nflag{display:inline-flex;align-items:center;gap:6px;background:#FFF4D6;color:#8A5A00;border-radius:10px;padding:6px 10px;font-size:13px;font-weight:600}
.nflag.full{display:flex;margin-top:6px}
.navatar{width:42px;height:42px;border-radius:50%;background:#EEF0F3;color:var(--fg2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.navatar .ico{width:20px;height:20px}

/* ======================= SPEECH ======================= */
function speak(text, onend){
  try{ if(!('speechSynthesis' in window)){ toast('Bu tarayıcıda ses desteği yok'); onend&&onend(); return; }
    speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text); u.lang='tr-TR'; u.rate=1;
    const v=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.startsWith('tr')); if(v) u.voice=v;
    u.onend=()=>onend&&onend(); speechSynthesis.speak(u);
  }catch(e){ onend&&onend(); }
}
function listenOnce(cb){
  const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ cb(null); return; }
  try{ const r=new SR(); r.lang='tr-TR'; r.interimResults=false; r.maxAlternatives=3;
    let done=false; r.onresult=e=>{done=true; cb(e.results[0][0].transcript.toLowerCase());};
    r.onerror=()=>{ if(!done){done=true;cb(null);} }; r.onend=()=>{ if(!done){done=true;cb(null);} }; r.start();
  }catch(e){ cb(null); }
}

function custSentences(c){ // "Bugün için" — XField cümleleri
  const out=[];
  if(c.overdue>0) out.push(`Vadesi geçen ${c.overdue.toLocaleString('tr-TR')} ₺ var`);
  const used = c.balance<0? -c.balance:0, left=c.limit-used;
  if(left < c.limit*0.10) out.push('Kredi limitinin %10\'unun altında');
  const last = c.hist.length? c.hist.reduce((a,b)=>a.date>b.date?a:b).date : null;
  const days = last? Math.round((TODAY-new Date(last))/86400000) : 99;
  if(days>=30) out.push(`${days} gündür satış yok`);
  if(c.lastNoSell) out.push(`Son ziyaret satışsız bitti: ${c.lastNoSell}`);
  if(c.promise && new Date(c.promise.date)<TODAY) out.push(`Geciken söz: ${c.promise.text}`);
  return out;
}
function suggestions(c){ // Sipariş asistanı: alım periyodu + son alım
  const res=[];
  const byP={};
  c.hist.forEach(h=>Object.entries(h.items).forEach(([pid,q])=>{ (byP[pid]=byP[pid]||[]).push({d:new Date(h.date),q}); }));
  Object.entries(byP).forEach(([pid,arr])=>{
    arr.sort((a,b)=>a.d-b.d); const last=arr[arr.length-1];
    const period = arr.length>1? Math.round((last.d-arr[0].d)/86400000/(arr.length-1)) : 14;
    const since = Math.round((TODAY-last.d)/86400000);
    const avg = Math.round(arr.reduce((s,x)=>s+x.q,0)/arr.length);
    if(since >= period*0.8) res.push({pid, qty:Math.max(1,avg), reason:`Alım periyodu ${period} gün, son alım ${last.d.toISOString().slice(0,10)}`, kind:'repeat'});
  });
  (c.must||[]).forEach(pid=>{ if(!byP[pid]) res.push({pid,qty:2,reason:'Must SKU: son faturalarda hiç yok',kind:'must'}); });
  return res.slice(0,5);
}
function invTotals(){
  const items=Object.entries(U.cart).filter(([,q])=>q.qty>0);
  let gross=0, disc=0, cost=0, ep=0, gifts=0;
  items.forEach(([pid,q])=>{ const p=P(pid); const price=q.price??p.price; const line=price*q.qty; gross+=line; cost+=p.cost*q.qty; ep+=p.ep*q.qty;
    let d=(q.disc||0)/100*line; disc+=d; if(p.gift && q.qty>=5) gifts+=Math.floor(q.qty/5); });
  const ruleDisc = gross>10000? (gross-disc)*0.03 : 0; // örnek: 10.000 TL üzeri %3 sepet iskontosu
  const sub=gross-disc-ruleDisc; const vat=sub*0.20;
  return {items, gross, disc, ruleDisc, sub, vat, total:sub+vat, cost, ep, gifts, lines:items.length};
}

  return `<div class="drawer"><div class="l">${t.map(m=>`<button class="${m.k===cat.k?'act':''}" data-a="dcat" data-k="${m.k}">${ic(m.i)}${m.n}</button>`).join('')}<button class="close" data-a="logout">${ic('quit')}Kapat</button></div>
  <div class="r"><div style="display:flex;align-items:center;padding:8px 6px 0"><div class="grp" style="flex:1">${cat.n.toLocaleUpperCase('tr')}</div><button data-a="drawer" style="width:auto;border:0;padding:8px">${ic('x')}</button></div>
  ${(cat.sub||[{n:cat.n,i:cat.i,s:cat.s,a:cat.a}]).map(it=> it.g? `<div class="grp">${it.g}</div>` : `<button data-a="menu" data-s="${it.s||''}" data-act="${it.a||''}" data-t="${esc(it.t||'')}" data-o="${it.o||''}" data-c="${it.c||''}">${ic(it.i)}<span>${it.n}</span></button>`).join('')}
  </div></div>`;
}

/* ======================= OVERLAYS ======================= */
function overlay(){
  const o=U.overlay, c=selC();
  const W = (inner, cls='')=>`<div class="ov ${cls}" data-a="ovbg">${inner}</div>`;
  switch(o.name){
  case 'news': {
    const items=[
      {t:'Günün özeti',d:'Sabah ilk açılışta bugünkü planın tek kartta; "Dinle" ile sesli.',ok:true},
      {t:'Bugün İçin',d:'Ziyaret kartında vadesi geçen borç, azalan kredi, düşen satış.',ok:S.pre.xfield},
      {t:'Dinle ve ekle',d:'Önerileri sesle oku; "ekle" ya da "geç" de.',ok:S.pre.android12},
      {t:'Son faturalar matrisi',d:'Son faturalarda hangi ürün ne kadar: Son ziyaretler › Matris.',ok:true},
      {t:'Must SKU',d:'Olmazsa olmaz ürünler ★ ile, eksikler altta.',ok:true},
      {t:'Ziyaret sonu notu',d:'Sonraki adımı not et; bir sonraki ziyarette brifingin en üstünde.',ok:S.pre.noteAuth}
    ].filter(x=>x.ok);
    return W(`<div class="dlg" data-stop><div class="bang blue">!</div><h2>Yenilikler</h2><div class="st">Sürüm ${VERSION}</div><hr>
      ${items.map((x,i)=>`<div style="padding:10px 0;${i<items.length-1?'border-bottom:1px solid var(--line)':''}"><div class="h3" style="font-size:17px">${x.t}</div><div class="muted" style="margin-top:3px">${x.d}</div></div>`).join('')}
      <div style="text-align:center;margin-top:16px"><button class="btn red" style="width:62%" data-a="newsOk">Tamam</button></div></div>`);
  }
  case 'day': {
    const planned=S.customers.filter(x=>x.days.includes('Cu')).length;
    const tasks=S.tasks.filter(t=>t.status==='Açık').length;
    const pct=Math.round(S.monthActual/S.monthTarget*100);
    const lines=[`${planned} nokta bugün planlı`, tasks?`${tasks} bekleyen görevin var`:null, S.pre.singleTarget?`Ay hedefinin %${pct}'indesin; kalan ${Math.round((S.monthTarget-S.monthActual)/1000)} bin TL`:null].filter(Boolean);
    U._dayText=`Merhaba ${S.user}. ${lines.join('. ')}.`;
    return W(`<div class="dlg" data-stop><div class="bang">!</div><h2>Merhaba, ${esc(S.user)}</h2><div class="st">Cuma, 20 Kasım</div><hr>
      ${lines.map(l=>`<div style="font-size:18px;padding:6px 0">${l}</div>`).join('')}
      <div class="grid2" style="margin-top:16px"><button class="btn gray" data-a="speak" data-k="day">▶ Dinle</button><button class="btn red" data-a="closeOv">Başla</button></div></div>`);
  }
  case 'brief': {
    const s=S.pre.xfield? custSentences(c):[];
    const txt=[`${c.name}.`, (S.pre.noteAuth&&c.lastNote)?`Geçen ziyaret notun: ${c.lastNote.step}. ${c.lastNote.text||''}.`:'', ...s.map(x=>x+'.'), `Bakiye ${fmt(c.balance)} lira.`].join(' ');
    U._briefText=txt;
    return W(`<div class="dlg" data-stop><button class="x" data-a="closeOv">${ic('x')}</button><div class="bang">!</div><h2>${esc(c.name)}</h2><div class="st">Ziyaret Özeti • ${new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</div>
      <div style="text-align:center;margin-top:10px"><button class="btn gray" data-a="speak" data-k="brief">▶ Dinle</button></div><hr>
      ${S.pre.noteAuth&&c.lastNote?`<div class="sec">GEÇEN ZİYARET NOTUN <span class="new">YENİ</span></div><div class="row" style="margin:4px 0 10px"><span class="sp" style="font-size:16px">${esc(c.lastNote.step)}${c.lastNote.text?'. '+esc(c.lastNote.text):''}</span><b>${dshort(new Date(c.lastNote.date))}</b></div><hr style="margin:6px 0">`:''}
      ${s.length?`<div class="sec">BUGÜN İÇİN <span class="new">YENİ</span></div>${s.map(x=>`<div style="padding:4px 0;font-size:15px">• ${esc(x)}</div>`).join('')}<hr style="margin:8px 0">`:''}
      <div class="sec">HESAP</div><div class="row" style="margin:4px 0 10px"><span class="sp" style="font-size:16px">Bakiye</span><b style="font-size:16px">${tl(c.balance)}</b></div>
      ${c.lastNoSell?`<hr style="margin:6px 0"><div class="sec">BU TELEFONDA</div><div class="row" style="margin:4px 0"><span class="sp" style="font-size:16px">Satışsızlık Nedeni</span><b style="font-size:16px">${esc(c.lastNoSell)}</b></div>`:''}
      <div style="text-align:center;margin-top:16px"><button class="btn red" style="width:60%" data-a="closeOv">Tamam</button></div></div>`);
  }
  case 'visitnote': {
    const steps=['Tekrar uğra','Tahsilat bekleniyor','Karar verici yoktu','Fiyat teklifi'];
    return W(`<div class="dlg" data-stop><div class="bang">!</div><h2>Ziyareti özetle</h2><div class="st">${esc(c.name)} • Sonraki ziyaret brifinginde görünür</div>
      <div class="sec" style="margin-top:16px">SONRAKİ ADIM</div>
      <div class="chips">${steps.map(s=>`<button class="${U.chips===s?'act':''}" data-a="chip" data-k="${s}">${s}</button>`).join('')}</div>
      <div class="field"><label style="font-size:16px;color:var(--fg)">Not</label><textarea id="vnText" rows="4" placeholder="İsteğe bağlı">${esc(U._vnText||'')}</textarea></div>
      <div class="row" style="justify-content:center;gap:12px;margin-top:8px"><button class="btn gray" data-a="vnSkip">Atla</button><button class="btn red" style="width:50%" data-a="vnSave">Kaydet</button></div></div>`);
  }
  case 'nosellAsk': return W(`<div class="dlg" data-stop><h2 style="font-size:18px">Satış yapılmadı</h2><div class="st">Ziyareti bitirmeden önce satmama nedenini seçin</div><hr>
      ${['Stoğu Yeterli','Yetkili Yok','Dükkan Kapalı','Fiyat Yüksek','Ödeme Sorunu','Rakip Ürün'].map(r=>`<label class="row" style="padding:9px 0;font-size:16px"><input type="radio" name="ns" value="${r}" style="width:20px;height:20px;accent-color:var(--acc)"> ${r}</label>`).join('')}
      <div class="grid2" style="margin-top:12px"><button class="btn gray" data-a="closeOv">Vazgeç</button><button class="btn red" data-a="nsEnd">Ziyareti Bitir</button></div></div>`);
  case 'summary': {
    const done=S.customers.filter(x=>x.status==='visited_sale').length, nos=S.customers.filter(x=>x.status==='visited_nosale').length;
    const sales=S.slips.filter(x=>x.type!=='İade').reduce((s,x)=>s+x.total,0)+28640, pays=S.payments.reduce((s,x)=>s+x.amount,0)+9200;
    const plan=S.customers.filter(x=>x.days.includes('Cu')).length, sr=Math.round(done/Math.max(1,done+nos)*100), left=Math.max(0,plan-done-nos);
    const lira=n=>Math.round(n).toLocaleString('tr-TR')+' lira';
    U._sumText=`Gün özeti. Bugün ${plan} ziyaret planlı. ${done+nos} ziyaret tamamlandı: ${done} satışlı, ${nos} satışsız. `+
      (left?`${left} nokta kaldı. `:'Planlı tüm noktalar ziyaret edildi. ')+
      `Toplam satış, KDV dahil ${lira(sales)}. Tahsilat ${lira(pays)}. Satışa dönüşme oranı yüzde ${sr}.`+
      (sr<60&&done+nos>0?' Satışa dönüşme oranı düşük; kalan ziyaretlerde sipariş asistanını kullan.':'');
    return W(`<div class="dlg" data-stop><button class="x" data-a="closeOv">${ic('x')}</button><h2 style="text-align:left">Gün Özeti</h2>
      <div style="margin-top:10px"><button class="btn gray" data-a="speak" data-k="sum">▶ Dinle</button> <span class="new">YENİ</span></div><hr>
      ${[['Planlanan ziyaret',plan],['Satışlı ziyaret',done],['Satışsız ziyaret',nos],['Kalan nokta',left],['Satış (KDV dahil)',tl(sales)],['Tahsilat',tl(pays)],['Strike rate','%'+sr]].map(([k,v])=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><span class="sp">${k}</span><b>${v}</b></div>`).join('')}</div>`);
  }
  case 'newslip': return W(`<div class="dlg" data-stop><h2 style="font-size:18px">Fiş tipi seçin</h2><hr>
      ${[['Sipariş','Order'],['Satış Faturası','Invoice'],['İade','Return'],['Hasarlı Ürün','Damaged']].map(([n,k])=>`<button class="btn out" style="width:100%;margin:5px 0;text-align:left" data-a="startSlip" data-k="${n}">${n}</button>`).join('')}
      <button class="btn gray" style="width:100%;margin-top:8px" data-a="closeOv">Vazgeç</button></div>`);
  case 'qty': {
    const p=P(o.pid), q=U.cart[o.pid]||{qty:0}; const hist=(c?c.hist:[]).filter(h=>h.items[o.pid]).slice(0,4);
    return W(`<div class="dlg" data-stop><button class="x" data-a="closeOv">${ic('x')}</button><div class="row"><div class="prod" style="padding:0;border:0"><div class="img">${ic('img')}</div></div><div><div class="muted small">${p.code}</div><div class="h3">${esc(p.name)}</div><div class="small muted">Stok: ${p.stock} · KDV %20 · ${p.grp}</div></div></div><hr>
      <div class="row" style="justify-content:center;gap:16px"><button class="btn gray" data-a="qstep" data-k="-1">${ic('minus')}</button><input id="qQty" type="number" min="0" value="${q.qty||o.def||1}" style="width:90px;text-align:center;font-size:24px;font-weight:700;border:1px solid #CDD2D8;border-radius:8px;padding:6px"><button class="btn gray" data-a="qstep" data-k="1">${ic('plus')}</button></div>
      <div class="grid2"><div class="field"><label>Birim</label><select id="qUnit"><option>Koli</option><option>Adet</option></select></div><div class="field"><label>Birim fiyat</label><input id="qPrice" type="number" step="0.01" value="${(q.price??p.price).toFixed(2)}"></div>
      <div class="field"><label>Ürün iskontosu %</label><input id="qDisc" type="number" value="${q.disc||0}"></div><div class="field"><label>Müşteri stok sayımı</label><input id="qCnt" type="number" value="${q.cnt||''}" placeholder="adet"></div></div>
      ${p.gift?`<div class="badge g">${ic('gift')} Her 5 koliye 1 koli bedelsiz</div>`:''}
      ${hist.length?`<div class="sec">ÜRÜN GEÇMİŞİ</div><table class="t" style="margin-top:6px"><tr><th>Tarih</th><th>Adet</th><th>Birim fiyat</th></tr>${hist.map(h=>`<tr><td>${dstr(new Date(h.date))}</td><td>${h.items[o.pid]}</td><td>${fmt(p.price)}</td></tr>`).join('')}</table>`:''}
      <div class="grid2" style="margin-top:14px"><button class="btn gray" data-a="qDel">Sil</button><button class="btn red" data-a="qSave">Kaydet</button></div></div>`);
  }
  case 'cart': { const T=invTotals(); return W(`<div class="sheetbox" data-stop><div class="grab"></div><div class="row"><div class="h3 sp" style="font-size:18px">Sepet · ${T.lines} kalem</div><button data-a="closeOv">${ic('x')}</button></div>
      ${T.items.length? T.items.map(([pid,q])=>{const p=P(pid);return `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)"><div class="sp"><div style="font-weight:600">${esc(p.name)}</div><div class="small muted">${q.qty} koli × ${fmt(q.price??p.price)}${q.disc?` · %${q.disc} isk.`:''}${q.ai?' · <span class="badge b">AI</span>':''}</div></div><b>${fmt((q.price??p.price)*q.qty)}</b><button data-a="openQty" data-k="${pid}" style="margin-left:6px">${ic('dots')}</button></div>`}).join('') : '<div class="empty">Sepet boş</div>'}
      <div class="row" style="padding-top:10px"><span class="sp">Genel toplam</span><b style="font-size:18px">${tl(T.total)}</b></div></div>`,'sheet'); }
  case 'assist': return W(assistSheet(),'sheet');
  case 'why': return W(`<div class="dlg" data-stop><h2 style="font-size:18px">Neden önerildi?</h2><hr><p style="font-size:15px;line-height:1.5">${esc(o.text)}</p><p class="small muted" style="margin-top:10px">Öneri, müşterinin son faturalarındaki alım periyodundan ve Required işaretli tercihli ürün kuralından hesaplanır.</p><button class="btn red" style="width:100%;margin-top:14px" data-a="backToAssist">Tamam</button></div>`);
  case 'profit': { const T=invTotals(); return W(`<div class="dlg" data-stop><button class="x" data-a="closeOv">${ic('x')}</button><h2 style="font-size:18px">Kâr Analizi</h2><hr>
      <table class="t"><tr><th>Ürün</th><th>Ks</th><th>Fiyat</th><th>Kâr</th></tr>${T.items.map(([pid,q])=>{const p=P(pid);const pr=(q.price??p.price);return `<tr><td>${esc(p.name)}</td><td>${q.qty}</td><td class="n">${fmt(pr*q.qty)}</td><td class="n">${fmt((pr-p.cost)*q.qty)}</td></tr>`}).join('')}</table>
      <div class="kv" style="margin-top:14px"><div><span class="chip">Toplam maliyet</span><div class="v">${tl(T.cost)}</div></div><div><span class="chip">Toplam fiyat</span><div class="v">${tl(T.sub)}</div></div><div><span class="chip">Toplam kâr</span><div class="v">${tl(T.sub-T.cost)}</div></div><div><span class="chip">Kâr %</span><div class="v">%${T.sub?Math.round((T.sub-T.cost)/T.sub*100):0}</div></div></div></div>`); }
  case 'barcode': return W(`<div class="dlg" data-stop><h2 style="font-size:18px">Barkod Okutma</h2><div class="st">Kamera simülasyonu: barkodu yazın veya örnekten seçin</div><hr>
      <div class="field"><input id="bcIn" placeholder="Barkod" value=""></div>
      <div class="small muted">Örnek: ${PRODUCTS.slice(0,4).map(p=>`<a href="#" data-a="bcFill" data-k="${p.bc}">${p.bc}</a>`).join(' · ')}</div>
      <div class="grid2" style="margin-top:14px"><button class="btn gray" data-a="closeOv">Vazgeç</button><button class="btn red" data-a="bcOk" data-k="${o.mode||'prod'}">Tamam</button></div></div>`);
  case 'password': return W(`<div class="dlg" data-stop><h2 style="font-size:18px">Şifre Değiştir</h2><hr><div class="field"><label>Eski şifre</label><input type="password"></div><div class="field"><label>Yeni şifre</label><input type="password"></div><div class="field"><label>Yeni şifre tekrar</label><input type="password"></div><button class="btn red" style="width:100%" data-a="okToast" data-t="Şifre değiştirildi">Kaydet</button></div>`);
  case 'crash': return W(`<div class="dlg" data-stop><h2 style="font-size:18px">Hata Raporu</h2><hr><div class="field"><label>Açıklama</label><textarea rows="4"></textarea></div><label class="row small"><input type="checkbox" checked> Kullanıcı bilgilerimi gönder</label><div class="photo" style="height:110px;aspect-ratio:auto;margin-top:10px">Ekran görüntüsü eklendi</div><button class="btn red" style="width:100%;margin-top:12px" data-a="okToast" data-t="Hata raporu gönderildi">Gönder</button></div>`);
  case 'sync': return W(`<div class="dlg" data-stop><h2 style="font-size:18px">Veriler güncelleniyor</h2><hr><div class="prog"><i style="width:${o.p||0}%"></i></div><div class="st" style="margin-top:8px">%${o.p||0} · ${o.step||''}</div></div>`);
  case 'payform': return W(payForm(),'');
  }
  return '';
}

/* ======================= ASSISTANT SHEET (YENİ) ======================= */
function assistSheet(){
  const c=selC(), A=U.assist;
  const open=A.items.filter(x=>x.state==='open'), ign=A.items.filter(x=>x.state==='ign');
  const acc=A.items.filter(x=>x.state==='acc');
  const extra=acc.reduce((s,x)=>s+P(x.pid).price*x.qty,0);
  const list = A.tab==='ign'? ign : open;
  const smart = open.filter(x=>x.kind!=='smart');
  const smartTotal = smart.reduce((s,x)=>s+P(x.pid).price*x.qty,0);
  return `<div class="sheetbox" data-stop><div class="grab"></div>
   <div class="row"><div class="spark" style="width:44px;height:44px;border-radius:12px;background:#FCEFD6;color:var(--teal)">${ic('spark')}</div><div class="sp"><div class="h3" style="font-size:20px">Sipariş Asistanı <span class="new">YENİ</span></div><div class="muted">${esc(c.name)}</div></div><button class="x" style="position:static" data-a="closeOv">${ic('x')}</button></div>
   <div class="stat3"><div><small>AÇIK</small><b>${open.length}</b></div><div><small>KABUL EDİLEN</small><b>${acc.length}</b></div><div><small>EK SATIŞ</small><b>${fmt(extra)} TL</b></div></div>
   <div class="seg"><button class="${A.tab!=='ign'?'act':''}" data-a="aTab" data-k="open">Öneriler · ${open.length}</button><button class="${A.tab==='ign'?'act':''}" data-a="aTab" data-k="ign">Yoksayılan · ${ign.length}</button></div>
   ${A.tab!=='ign' && S.pre.android12 && open.length? `<div style="margin:12px 0"><button class="mic ${U.listening?'listening':''}" data-a="listenAdd">${ic('mic')} ${U.listening? (U.listenMsg||'Dinliyorum… "ekle" ya da "geç"') : 'Dinle ve ekle'}</button>${U.listening?`<span style="margin-left:8px"><button class="btn blue" style="padding:8px 12px" data-a="voiceCmd" data-k="ekle">ekle</button> <button class="btn gray" style="padding:8px 12px" data-a="voiceCmd" data-k="geç">geç</button></span>`:''}</div>`:''}
   ${A.tab!=='ign' && smart.length>1? `<div class="sug"><div class="hd"><div class="spark">${ic('spark')}</div><div><div class="h3" style="font-size:17px">Akıllı sepet hazır: ${smart.length} ürün · ${fmt(smartTotal)} TL</div><div class="muted" style="margin-top:4px">Bu müşteri için önerilen tüm ürünler tek dokunuşla eklenir. Sonra sepeti düzenleyebilirsin.</div></div></div><div class="acts2"><button class="a" data-a="aAll">Sepete uygula</button><button data-a="aWhyAll">Neden?</button><button data-a="aIgnAll">Yoksay</button></div></div>`:''}
   ${list.map(x=>{const p=P(x.pid); const hl=U.listening&&A.cursor===x.pid; return `<div class="sug" style="${hl?'outline:2px solid var(--blue)':''}"><div class="hd"><div class="spark">${ic('spark')}</div><div><div class="h3" style="font-size:17px">${x.kind==='must'?'★ ':''}${esc(p.name)} · ${x.qty} Ad önerildi</div><div class="muted" style="margin-top:4px">${esc(x.reason)}</div></div></div>
     <div class="acts2">${x.state==='ign'?`<button class="a" data-a="aRestore" data-k="${x.pid}">Geri al</button>`:`<button class="a" data-a="aAdd" data-k="${x.pid}">Ekle +${x.qty}</button><button data-a="aWhy" data-k="${x.pid}">Neden?</button><button data-a="aIgn" data-k="${x.pid}">Yoksay</button>`}</div></div>`}).join('') || `<div class="empty">${A.tab==='ign'?'Yoksayılan öneri yok':'Tüm öneriler işlendi'}</div>`}
   ${!S.pre.android12?'<p class="small muted" style="margin-top:8px">"Dinle ve ekle" Android 12+ ve çevrimdışı Türkçe ses paketi gerektirir; bu cihazda gizli.</p>':''}
  </div>`;
}

SCREENS.custlist = st => {

function matrix(c){ // YENİ: Son faturalar matrisi + Must SKU
  if(!S.online) return `<div class="empty">${ic('wifi')}<br><br>Çevrimiçi olmanız gerekiyor.<br><span class="small">Matris son faturalardan sunucuda kurulur.</span></div>`;
  const last=c.hist.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,6);
  const pids=[...new Set(last.flatMap(h=>Object.keys(h.items)))];
  const must=c.must||[]; pids.sort((a,b)=>(must.includes(b)-must.includes(a)));
  const missing=must.filter(m=>!pids.includes(m));
  return `<div style="padding:0 12px 6px" class="small muted">Son ${last.length} fatura · ürün × tarih, adetle <span class="new">YENİ</span></div>
  <div style="overflow-x:auto"><table class="t matrix"><tr><th>Ürün</th>${last.map(h=>`<th style="text-align:right">${dshort(new Date(h.date))}</th>`).join('')}</tr>
  ${pids.map(pid=>`<tr><td>${must.includes(pid)?'<span style="color:#D08A00">★</span> ':''}${esc(P(pid).name)}</td>${last.map(h=>`<td class="n">${h.items[pid]||'–'}</td>`).join('')}</tr>`).join('')}</table></div>
  <div class="card"><div class="h3">Bu faturalarda olmayan Must SKU: ${missing.length}</div>${missing.map(m=>`<div class="row" style="padding:8px 0;border-bottom:1px solid var(--line)"><span style="color:#D08A00">★</span><span class="sp">${esc(P(m).name)}</span><button class="btn blue" style="padding:6px 10px;font-size:13px" data-a="mustToCart" data-k="${m}">Siparişe ekle</button></div>`).join('')||'<div class="muted small" style="margin-top:4px">Tüm Must SKU\'lar son faturalarda var.</div>'}<div class="tiny muted" style="margin-top:8px">★ = Must SKU · "Required" tercihli ürün kuralı</div></div>`;
}

SCREENS.onlinerep = () => {
  if(!S.online) return {title:'Çevrimiçi Rapor', body:'<div class="empty">Çevrimiçi olmanız gerekiyor</div>', bottom:`<button data-a="back">Geri</button>`};
  const c=selC(); const R=[['Eylül',84210,4],['Ekim',91880,5],['Kasım',63400,3]];

  U._repText=`${c?c.name+' için m':'M'}üşteri performans raporu. Eylülde ${lira(R[0][1])} ciro, ${R[0][2]} ziyaret. Ekimde ${lira(R[1][1])} ciro, ${R[1][2]} ziyaret; Eylüle göre yüzde ${Math.round((R[1][1]-R[0][1])/R[0][1]*100)} artış. `+

   <div class="small muted" style="margin-top:10px">Kasım ay sonu tahmini: <b>${proj.toLocaleString('tr-TR')} TL</b> (${diff>=0?'+':''}%${diff} Ekim'e göre) <span class="new">YENİ</span></div></div>`, bottom:`<button data-a="back">Geri</button>`};
};

SCREENS.map = () => { const L=S.customers; const med=a=>{const t=[...a].sort((x,y)=>x-y);return t[t.length>>1];}; const mla=med(L.map(c=>c.lat)), mlo=med(L.map(c=>c.lon)), k=Math.cos(mla*Math.PI/180);
  const dx=c=>(c.lon-mlo)*k*111, dy=c=>(c.lat-mla)*111; const core=L.filter(c=>Math.hypot(dx(c),dy(c))<1.6); const R=Math.max(...core.map(c=>Math.max(Math.abs(dx(c))/0.44,Math.abs(dy(c))/0.40)));
  const X=c=>Math.max(3,Math.min(97,50+dx(c)/R*100)), Y=c=>Math.max(3,Math.min(95,50-dy(c)/R*100)); const tod=L.filter(c=>c.days.includes('Cu')).sort((p,q)=>p.order-q.order);
  return {title:'Harita · Çağlayan', body:`<div class="map" style="background:#EEF1EA"><svg width="100%" height="100%" style="position:absolute;inset:0" viewBox="0 0 100 100" preserveAspectRatio="none"><polyline points="${tod.map(c=>X(c)+','+Y(c)).join(' ')}" fill="none" stroke="#9A2C1F" stroke-width=".6" stroke-dasharray="1.5 1"/></svg>
  ${L.filter(c=>!c.days.includes('Cu')).map(c=>`<div title="${esc(c.name)}" style="position:absolute;left:${X(c)}%;top:${Y(c)}%;width:9px;height:9px;margin:-4px;border-radius:50%;background:#8A929C;opacity:.7"></div>`).join('')}
  ${tod.map(c=>`<div class="pin" style="left:${X(c)}%;top:${Y(c)}%;background:${c.status==='visited_sale'?'var(--ok)':c.status==='visited_nosale'?'#E2A400':'var(--acc)'}" data-a="selCust" data-k="${c.id}">${c.order}. ${esc(c.name)}</div>`).join('')}
  <div style="position:absolute;left:10px;bottom:10px;background:#fff;border-radius:10px;padding:6px 10px;font-size:12px;box-shadow:0 1px 4px rgba(0,0,0,.15)">● Bugünkü rota (${tod.length}) · <span style="color:#8A929C">● Diğer günler (${L.length-tod.length})</span></div></div>`, bottom:`<button data-a="back">Geri</button>`}; };
