const XI_SVG=(sz,mood='')=>`<img class="xisvg cinimg ${mood}" src="${CIN_IMG}" width="${sz}" height="${sz}" alt="Eti Cin">`;
if(!U.xiMsgs) U.xiMsgs=[]; U.xiVoice=true; U.xiSeen=U.xiSeen||{};
function xiCtxChips(){ const st=cur().s, c=selC();
  if(st==='invedit') return ['Bu müşteride ne satayım?','Kampanyalar neler?','Bu sepet kaç prim?'];
  if(st==='visit') return ['Bu müşteride ne satayım?','Ziyaret süresi','Limit durumu','Vadesi geçen borçlar'];
  if(st==='incentive') return ['Primimi nasıl artırırım?','Hedefe ne kadar kaldı?'];
  return ['Sıradaki müşteri?','Primim ne kadar?','Hedefe ne kadar kaldı?','Vadesi geçen borçlar']; }
function xiAnswer(q0){ const q=q0.toLocaleLowerCase('tr'); const c=selC(); const I2=incSum(); const has=(...w)=>w.some(x=>q.includes(x));
  if(has('merhaba','selam','günaydın')) return {t:`Merhaba ${S.user}! Ben Eti Cin. Rota, prim, kampanya, tahsilat ya da uygulamanın nasıl kullanıldığı hakkında sorabilirsin.`};
  if(has('teşekkür','sağol','sağ ol')) return {t:'Rica ederim. Bir şey olursa buradayım.'};
  if(has('sıradaki','kime','rota','nereye')){ const n=planned().find(x=>x.status==='planned'); if(!n) return {t:'Bugünkü planlı tüm noktaları ziyaret ettin. Günü kapatabilirsin.',a:[['Günü kapat',()=>go('dayend')]]};
    const f=custSentences(n); return {t:`Sıradaki müşteri ${n.name}, ${km(n.id)} km uzakta. ${f.length?'Dikkat: '+f.slice(0,2).join(', ')+'.':'Dikkat edilecek bir konu yok.'} Hedef ziyaret süresi ${targetMin(n)} dakika.`,a:[['Ziyareti aç',()=>{S.sel=n.id;save();U.stack=[{s:'home'},{s:'visit'}];render();}]]}; }
  if(has('prim','incentive','kazanc','kazanç','artır')){ const ws=whiteSpace()[0];
    return {t:`Bu ay ${fmt0(I2.total)} ₺ prim kazandın, bugün +${fmt0(I2.today)} ₺. ${I2.next?`%${I2.next.p} ciro kademesine ${fmt0(I2.toNext)} ₺ kaldı.`:''} ${ws?`En hızlı fırsat: ${ws.c.name}'da hiç satılmayan ${ws.ws.length} ürün, yaklaşık +${ws.amt} ₺.`:''} Kampanyalı Tutku ve Popkek'te koli başına ${RATE.camp} ₺ ek prim var.`,a:[['Primimi aç',()=>go('incentive')]]}; }
  if(has('sepet')&&c&&U.inv){ const e=primFor(c,cartItems()); return {t:`Bu sepet şu an +${fmt0(e.total)} ₺ prim kazandırır: dağılım ${fmt0(e.dist)} ₺, kampanya ${fmt0(e.camp)} ₺${e.must?`, Must SKU ${e.must} ₺`:''}.`}; }
  if(has('ne sat','öner','fırsat','bu müşteri')){ if(!c) return {t:'Önce bir müşteri seç; o noktaya özel öneri vereyim.',a:[['Müşteriler',()=>{U.stack=[{s:'custlist'}];render();}]]};
    const sold=new Set(c.hist.flatMap(h=>Object.keys(h.items))); const ws=PRODUCTS.filter(p=>!sold.has(p.id)).slice(0,3); const sg=suggestions(c).slice(0,2);
    return {t:`${c.name} için: ${sg.length?'tekrar sipariş zamanı gelenler '+sg.map(s=>P(s.pid).name.split(' X ')[0]+' ('+s.qty+')').join(', ')+'. ':''}${ws.length?'Bu noktada hiç satılmayan '+ws.map(p=>p.name.split(' X ')[0]).join(', ')+'; her biri ilk satışta +'+RATE.dist+' ₺ prim. ':''}Tutku ve Popkek 5+1 kampanyası 30 Kasım'a kadar sürüyor.`,a:[['Siparişe başla',()=>A.nOrder()]]}; }
  if(has('kampanya','promosyon','iskonto')) return {t:`Aktif kampanyalar: Eti Tutku ve Popkek 5+1 (her 5 koliye 1 koli bedelsiz, 30 Kasım'a kadar, koli başına +${RATE.camp} ₺ prim), 10.000 ₺ üzeri siparişte %3 sepet iskontosu ve Popkek kasa önü standı.`};
  if(has('borç','vade','tahsilat')){ const l=S.customers.filter(x=>x.overdue>0).sort((a,b)=>b.overdue-a.overdue); return {t:l.length?`Vadesi geçen toplam ${fmt0(l.reduce((s,x)=>s+x.overdue,0))} ₺: ${l.slice(0,3).map(x=>x.name+' '+fmt0(x.overdue)+' ₺').join(', ')}. Vadesi geçen tahsilatın %1'i prim olarak yansır.`:'Vadesi geçen borç yok.'}; }
  if(has('limit')){ if(!c) return {t:'Önce bir müşteri seç.'}; return {t:`${c.name}: kredi limiti ${fmt0(c.limit)} ₺, açık bakiye ${fmt0(Math.max(0,-c.balance))} ₺, kalan limit ${fmt0(availLimit(c))} ₺.${c.overdue?' Vadesi geçen '+fmt0(c.overdue)+' ₺ var; önce tahsilat limiti açar.':''}`}; }
  if(has('hedef','kalan','kademe')) return {t:`Ay hedefin ${fmt0(S.monthTarget)} ₺, gerçekleşen ${fmt0(S.monthActual)} ₺ (%${Math.round(I2.pct)}). ${I2.next?`%${I2.next.p} kademesi için ${fmt0(I2.toNext)} ₺ kaldı; kalan 7 iş gününde günde ortalama ${fmt0(I2.toNext/7)} ₺ satış gerekir.`:''}`};
  if(has('süre','zaman','sayaç','dakika')){ if(S.visit){ const r=visitRemain(), cc=C(S.visit.cust); return {t:`${cc.name} için hedef süre ${targetMin(cc)} dakika. ${r>=0?'Kalan süre '+fmtMS(r)+'.':'Hedef '+fmtMS(r).slice(1)+' aşıldı.'} Hedef sürede biten ve en az 3 adımı tamamlanan ziyaret "mükemmel ziyaret" sayılır, +${RATE.perfect} ₺.`}; }
    return {t:`Her noktanın kanalına göre hedef ziyaret süresi var: otel 15, kafe/restoran 12, market 10, tekel/premium 8, kurum/ofis 7 dakika. ${U.xiLast||''}`}; }
  if(has('boş kasa','kasa')) return {t:'Ziyaret adımlarından "Boş kasa"yı aç; tür bazında sağlam, kırık ve başka marka adedini gir. Sağlam boşların depozitosu müşteri bakiyesinden düşer, makbuz yazdırılır.',a:[['Boş kasa',()=>A.vtask({s:'emptycrate',k:'EmptyCrate'})]]};
  if(has('günü kapat','gün sonu','check-out')) return {t:'Bugün ekranının altındaki "Günü kapat" ile ziyaret edilmeyen noktaların nedenini, kasa ve boş kasa mutabakatını girip check-out yaparsın.',a:[['Günü kapat',()=>go('dayend')]]};
  return {t:'Bunu henüz bilmiyorum; bu demoda rota, prim, kampanya, tahsilat, limit, ziyaret süresi ve temel kullanım sorularını yanıtlayabiliyorum.'}; }
function xiPush(from,text,acts){ U.xiActs=U.xiActs||[]; const ids=(acts||[]).map(a=>{ U.xiActs.push(a[1]); return [a[0],U.xiActs.length-1]; }); U.xiMsgs.push({from,text,acts:ids}); }
function xiTipFor(){ const st=cur().s, c=selC();
  if(st==='home'){ const n=planned().find(x=>x.status==='planned'); if(n){ const f=custSentences(n); return [`Sıradaki: ${n.name}. ${f[0]?f[0]+'.':''}`,'home'+n.id]; } }
  if(st==='visit'&&c&&S.visit&&S.visit.cust===c.id){ const sold=new Set(c.hist.flatMap(h=>Object.keys(h.items))); const n=PRODUCTS.filter(p=>!sold.has(p.id)).length; return [`Hedef süre ${targetMin(c)} dk. ${c.overdue?'Önce vadesi geçen '+fmt0(c.overdue)+' ₺ tahsilatı al. ':''}Bu noktada hiç satılmayan ${n} ürün var: ilk satış başına +${RATE.dist} ₺.`,'visit'+c.id]; }
  if(st==='invedit'&&c){ const T=invTotals(); if(T.lines&&T.gross<10000) return [`%3 sepet iskontosuna ${fmt0(10000-T.gross)} ₺ kaldı.`,'inv'+c.id+Math.floor(T.gross/2000)]; const sold=new Set(c.hist.flatMap(h=>Object.keys(h.items))); const ws=PRODUCTS.find(p=>!sold.has(p.id)); if(ws) return [`${ws.name.split(' X ')[0]} bu noktada hiç satılmadı: eklersen +${RATE.dist} ₺ prim.`,'invws'+c.id]; }
  return null; }
function xiTipShow(text,key){ if(U.xiSeen[key]) return; U.xiSeen[key]=1; U.xiTip=text; clearTimeout(U.xiTipTimer); U.xiTipTimer=setTimeout(()=>{ U.xiTip=null; U.xiTipTimer=null; const b=document.querySelector('.xitip'); if(b) b.remove(); },7000); }
OV.xi=o=>{ const chips=xiCtxChips();
  return `<div class="ov sheet" data-a="ovbg"><div class="sheetbox xisheet" data-stop>
   <div class="grab"></div>
   <div class="row" style="gap:12px">${XI_SVG(56,U.xiThinking?'think':'')}<div class="sp"><div class="h3" style="font-size:20px">Eti Cin <span class="new">AI</span></div><div class="muted small">XMobile yapay zekâ asistanın</div></div>
    <button class="nib" data-a="xiVoice" aria-label="Sesli yanıt">${U.xiVoice?'🔊':'🔇'}</button><button class="nib" data-a="closeOv" aria-label="Kapat">${ic('x')}</button></div>
   <div class="xilog" id="xilog">${U.xiMsgs.length?'':`<div class="ximsg xi">Merhaba ${esc(S.user)}! Ne yapmak istersin? Aşağıdan seçebilir, yazabilir ya da 🎙 ile söyleyebilirsin.</div>`}
    ${U.xiMsgs.map(m=>`<div class="ximsg ${m.from}">${esc(m.text)}${m.acts&&m.acts.length?`<div class="xiacts">${m.acts.map(([l,i])=>`<button data-a="xiAct" data-k="${i}">${esc(l)} ›</button>`).join('')}</div>`:''}</div>`).join('')}
    ${U.xiThinking?'<div class="ximsg xi"><span class="dots"><i></i><i></i><i></i></span></div>':''}</div>
   <div class="xichips">${chips.map(c=>`<button data-a="xiAsk" data-k="${esc(c)}">${esc(c)}</button>`).join('')}</div>
   <div class="xiin"><button class="nib ${U.listening?'listening':''}" data-a="xiMic" aria-label="Sesle sor">${ic('mic')}</button><input id="xiIn" placeholder="Eti Cin'e sor…" autocomplete="off"><button class="nbtn primary sm" data-a="xiSend">Gönder</button></div>
   <div class="tiny muted" style="margin-top:6px;text-align:center">Demo: yanıtlar kural tabanlı, veriler örnek.</div></div></div>`; };
function xiScroll(){ const l=document.getElementById('xilog'); if(l) l.scrollTop=l.scrollHeight; }
function xiAskText(t){ if(!t||!t.trim()) return; xiPush('me',t.trim()); U.xiThinking=true; U.overlay={name:'xi'}; render(); xiScroll();
  setTimeout(()=>{ const a=xiAnswer(t); U.xiThinking=false; xiPush('xi',a.t,a.a); render(); xiScroll(); if(U.xiVoice) speak(a.t); },650); }
Object.assign(A,{
  xiOpen:()=>{ U.xiTip=null; ov('xi'); setTimeout(xiScroll,30); },
