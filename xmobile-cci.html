/* ======================= ACTIONS ======================= */
function requireCust(fn){ if(!S.sel){ toast('Önce müşteri seçin'); go('custlist'); return; } fn(); }
function requireVisit(fn){ requireCust(()=>{ if(!S.visit||S.visit.cust!==S.sel){ startVisit(); } fn(); }); }
function startVisit(){
  const c=selC(); S.visit={cust:c.id,start:new Date(),hadSale:false}; save();
  ov('brief'); // Ziyaret özeti brifingi
}
function endVisit(){
  const c=selC(); const hadSale=S.slips.some(s=>s.cust===c.id && new Date(s.date)>=new Date(S.visit.start));
  if(!hadSale && c.status!=='visited_sale' && !U._nsChosen){ ov('nosellAsk'); return; }
  const dur=Math.max(1,Math.round((Date.now()-new Date(S.visit.start))/60000));
  c.visitTime=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); c.dur=dur+' dk';
  if(hadSale){ c.status='visited_sale'; c.lastNoSell=null; } else if(c.status!=='visited_sale') c.status='visited_nosale';
  S.visit=null; U._nsChosen=false; save();
  if(S.pre.noteAuth){ U.chips=null; U._vnText=''; ov('visitnote'); } else { toast('Ziyaret bitti'); render(); }
}

const A = {
  back, drawer:()=>{U.drawer=!U.drawer; render();}, dcat:d=>{ const m=menuTree().find(x=>x.k===d.k); if(!m.sub){ U.drawer=false; if(m.a==='home') return A.home(); if(m.a==='refresh') return A.refresh(); go(m.s); return;} U.drawerCat=d.k; render(); },
  menu:d=>{ U.drawer=false; if(d.act){ if(d.act==='resetDemo') return A.resetDemo(); if(d.act==='setUI') return A.setUI({k:S.ui==='new'?'old':'new'}); if(d.act==='ov') return ov(d.o); if(d.act==='toast') return toast(d.t); if(d.act==='visitToggle') return A.visitToggle(); if(d.act==='qr') return requireCust(()=>toast('QR: '+selC().code)); return; } if(d.c==='1') return requireCust(()=> d.s==='sliplist'||d.s==='paylist'? requireVisit(()=>go(d.s)) : go(d.s)); go(d.s,{t:d.t}); },
  home:()=>{ U.stack=[{s:'home'}]; U.drawer=false; render(); },
  go:d=>{ if(d.s==='custdetail'&&!S.sel) return toast('Önce müşteri seçin'); go(d.s,{k:d.k}); },
  ov:d=>ov(d.o,{mode:d.m}), closeOv:()=>{ U.overlay=null; try{speechSynthesis.cancel();}catch(e){} render(); },
  ovbg:(d,e)=>{ if(e.target.classList.contains('ov')) A.closeOv(); },
  toast:d=>toast(d.t), okToast:d=>{U.overlay=null; toast(d.t);},
  tab:d=>{ U.tab[d.g]=d.k; render(); },
  toggleOnline:()=>{ S.online=!S.online; save(); toast(S.online?'Çevrimiçi':'Çevrimdışı moda geçildi'); },
  login:()=>{ S.user=document.getElementById('lUser').value||'serpil'; S.online=!document.getElementById('lOff').checked; save();
    let p=0; const steps=['Müşteriler','Ürünler','Fiyat listeleri','Promosyonlar','Rut','Hedefler','Görevler']; let log='';
    U.stack=[{s:'load',p:0,step:'Başlıyor'}]; render();
    const t=setInterval(()=>{ p+=10; const step=steps[Math.min(steps.length-1,Math.floor(p/15))]; log+=`[${new Date().toLocaleTimeString('tr-TR')}] ${step} yüklendi\n`; U.stack=[{s:'load',p:Math.min(p,100),step,log}]; render();
      if(p>=100){ clearInterval(t); U.stack=[{s:'home'}]; render(); afterLogin(); } },140);
  },
  logout:()=>{ U.drawer=false; U.stack=[{s:'login'}]; render(); },
  newsOk:()=>{ S.seenVersion=VERSION; save(); U.overlay=null; render(); setTimeout(maybeDay,250); },
  speak:d=>{ speak(d.k==='day'?U._dayText:d.k==='sum'?U._sumText:d.k==='rep'?U._repText:U._briefText); },
  refresh:()=>{ U.drawer=false; let p=0; const st=['Gönderiliyor','Fiyatlar','Stoklar','Tamamlandı']; const t=setInterval(()=>{p+=20; U.overlay={name:'sync',p,step:st[Math.min(3,Math.floor(p/30))]}; render(); if(p>=100){clearInterval(t); setTimeout(()=>{U.overlay=null; toast('Veriler güncellendi');},300);} },180); },
  selCust:d=>{ S.sel=d.k; save(); go('visit'); },
  fToggle:()=>{U.fOpen=!U.fOpen; render();}, fEquip:()=>{U.fEquip=!U.fEquip; render();},
  visitToggle:()=>requireCust(()=>{ if(S.visit && S.visit.cust===S.sel) endVisit(); else { if(S.visit){ toast('Önce aktif ziyareti bitirin: '+C(S.visit.cust).name); return; } startVisit(); } }),
  vtask:d=>{ if(['sliplist','paylist','survey','equip','avail','emptycrate'].includes(d.s)) requireVisit(()=>go(d.s)); else go(d.s); },
  lastVisit:()=>{ U.tab.cd='Son Ziyaretler'; U.tab.lv='Fatura'; go('custdetail'); },
  nsSave:()=>{ const v=document.querySelector('input[name=ns2]:checked'); if(!v) return toast('Bir neden seçin'); selC().lastNoSell=v.value; save(); toast('Satmama nedeni kaydedildi'); back(); },
  nsEnd:()=>{ const v=document.querySelector('input[name=ns]:checked'); if(!v) return toast('Bir neden seçin'); selC().lastNoSell=v.value; U._nsChosen=true; U.overlay=null; endVisit(); },
  chip:d=>{ U._vnText=document.getElementById('vnText').value; U.chips=U.chips===d.k?null:d.k; render(); },
  vnSkip:()=>{ U.overlay=null; toast('Ziyaret bitti'); },
  vnSave:()=>{ const t=document.getElementById('vnText').value.trim(); if(!U.chips && !t) return toast('Bir adım seçin ya da not yazın'); selC().lastNote={step:U.chips||'Not',text:t,date:new Date()}; save(); U.overlay=null; toast('Not kaydedildi · sonraki ziyarette brifingde'); },
  newSlip:()=>requireVisit(()=>ov('newslip')),
  startSlip:d=>{ U.inv={type:d.k,no:slipNo(),note:''}; U.cart={}; U.tab.ie='Kalemler'; U.overlay=null; go('invedit'); },
  openQty:d=>ov('qty',{pid:d.k}),
  qstep:d=>{ const el=document.getElementById('qQty'); el.value=Math.max(0,(+el.value||0)+(+d.k)); },
  qSave:()=>{ const pid=U.overlay.pid; const qty=+document.getElementById('qQty').value||0; const price=+document.getElementById('qPrice').value; const disc=+document.getElementById('qDisc').value||0; const cnt=document.getElementById('qCnt').value;
    if(qty>P(pid).stock) toast('Uyarı: stok '+P(pid).stock+' koli');
    U.cart[pid]={...(U.cart[pid]||{}),qty,price:price!==P(pid).price?price:undefined,disc,cnt}; U.overlay=null; render(); },
  qDel:()=>{ delete U.cart[U.overlay.pid]; U.overlay=null; render(); },
  cancelSlip:()=>{ U.cart={}; back(); },
  saveSlip:()=>{ const T=invTotals(); if(!T.lines) return toast('Sepet boş'); const c=selC();
    const items={}; T.items.forEach(([pid,q])=>items[pid]=q.qty);
    const s={cust:c.id,type:U.inv.type,no:U.inv.no,date:new Date(),time:new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}),sub:T.sub,disc:T.disc+T.ruleDisc,total:T.total,printed:false,promo:T.gifts>0,ai:T.items.some(([,q])=>q.ai),items};
    S.slips.unshift(s);
    if(U.inv.type==='İade'){ c.balance+=T.total; } else { c.balance-=T.total; c.hist.push({date:new Date(),items}); S.monthActual+=T.sub; }
    (S.visitsDone[c.id]=S.visitsDone[c.id]||{}).Slip=true; c.status='visited_sale'; save(); U.cart={}; U.stack.pop(); toast(`${s.type} kaydedildi · ${tl(s.total)}`); },
  bcFill:(d,e)=>{ e.preventDefault(); document.getElementById('bcIn').value=d.k; },
  bcOk:d=>{ const v=document.getElementById('bcIn').value.trim();
    if(d.k==='equip'){ U.overlay=null; return A.eqVerify(null,v); }
    const p=PRODUCTS.find(x=>x.bc===v||x.code===v); if(!p) return toast('Ürün bulunamadı'); U.overlay={name:'qty',pid:p.id}; render(); },
  printAll:()=>{ S.slips.forEach(s=>s.printed=true); save(); toast('Tüm fişler yazdırıldı'); },
  /* assistant */
  openAssist:()=>{ const c=selC(); if(!U.assist||U.assist.cust!==c.id){ U.assist={cust:c.id,tab:'open',items:suggestions(c).map(s=>({...s,state:'open'}))}; } ov('assist'); },
  aTab:d=>{ U.assist.tab=d.k; render(); },
  aAdd:d=>{ const it=U.assist.items.find(x=>x.pid===d.k); it.state='acc'; U.cart[d.k]={...(U.cart[d.k]||{}),qty:(U.cart[d.k]?.qty||0)+it.qty,ai:true}; render(); },
  aIgn:d=>{ U.assist.items.find(x=>x.pid===d.k).state='ign'; render(); },
  aRestore:d=>{ U.assist.items.find(x=>x.pid===d.k).state='open'; render(); },
  aAll:()=>{ U.assist.items.filter(x=>x.state==='open').forEach(x=>A.aAdd({k:x.pid})); toast('Akıllı sepet uygulandı'); },
  aIgnAll:()=>{ U.assist.items.filter(x=>x.state==='open').forEach(x=>x.state='ign'); render(); },
  aWhy:d=>{ const it=U.assist.items.find(x=>x.pid===d.k); ov('why',{text:`${P(d.k).name}: ${it.reason}. Önerilen miktar son alımların ortalamasıdır (${it.qty} adet).`}); },
  aWhyAll:()=>ov('why',{text:'Akıllı sepet, açık önerilerin tamamıdır: alım periyodu dolmuş ürünler ve faturalarda olmayan Must SKU\'lar.'}),
  backToAssist:()=>ov('assist'),
  listenAdd:()=>{ if(U.listening){ U.listening=false; try{speechSynthesis.cancel();}catch(e){} render(); return; } U.listening=true; voiceLoop(); },
  voiceCmd:d=>voiceHandle(d.k),
  mustToCart:d=>{ toast(P(d.k).name+' siparişe eklenecek'); U._pendingMust=d.k; requireVisit(()=>{ U.inv={type:'Sipariş',no:slipNo(),note:''}; U.cart={[d.k]:{qty:2}}; U.tab.ie='Kalemler'; go('invedit'); }); },
  /* payment */
  paySave:()=>{ const amt=+document.getElementById('pAmt').value; if(!amt) return toast('Tutar zorunlu'); const c=selC();
    const p={cust:c.id,type:document.getElementById('pType').value,amount:amt,no:document.getElementById('pNo').value,doc:document.getElementById('pDoc').value,bank:document.getElementById('pBank').value,due:document.getElementById('pDue').value,date:new Date()};
    S.payments.unshift(p); c.balance+=amt; c.overdue=Math.max(0,c.overdue-amt); (S.visitsDone[c.id]=S.visitsDone[c.id]||{}).Payment=true; save(); U.overlay=null; U.tab.pl= p.type==='Çek'?'Çek':p.type==='Senet'?'Senet':'Tahsilat'; toast('Tahsilat eklendi · makbuz yazdırıldı'); },
  survPhoto:()=>{ const c=selC(); collectSurvey(); (S.surveyAns[c.id]=S.surveyAns[c.id]||{}).q5=new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'}); save(); render(); },
  survSave:()=>{ const c=selC(); collectSurvey(); const a=S.surveyAns[c.id]||{}; if(!a.q1||!a.q2) return toast('Zorunlu soruları cevaplayın'); (S.visitsDone[c.id]=S.visitsDone[c.id]||{}).Survey=true; save(); toast('Anket kaydedildi'); back(); },
  availSet:d=>{ const c=selC(); (S.avail[c.id]=S.avail[c.id]||{})[d.k]=d.v; render(); },
  availSave:()=>{ (S.visitsDone[S.sel]=S.visitsDone[S.sel]||{}).Availability=true; save(); toast('Penetrasyon kaydedildi'); back(); },
  eqVerify:(d,val)=>{ const v=(typeof val==='string'?val:document.getElementById('eqBc').value).trim(); const c=selC(); const ids=['1','2','3'].slice(0,c.equip).map(n=>'E'+c.id+n); const bcs=['789779797979798','789779797979812','789779797979830'];
    const i=bcs.indexOf(v); if(i<0||i>=ids.length) return toast('Bu barkod bu müşteride kayıtlı değil'); S.equipVerified[ids[i]]=true; (S.visitsDone[c.id]=S.visitsDone[c.id]||{}).Equipment=true; save(); toast('Ekipman doğrulandı'); },
  taskDone:d=>{ S.tasks.find(t=>t.id===d.k).status='Tamamlandı'; if(S.sel)(S.visitsDone[S.sel]=S.visitsDone[S.sel]||{}).Task=true; save(); render(); },
  taskSave:()=>{ const t=document.getElementById('tTitle').value.trim(); if(!t) return toast('Açıklama girin'); S.tasks.unshift({id:'T'+Date.now(),cust:S.sel,title:t,due:document.getElementById('tDue').value.split('-').reverse().join('.'),status:'Açık',group:document.getElementById('tGrp').value,type:document.getElementById('tType').value}); save(); toast('Görev kaydedildi'); back(); },
  noteSave:()=>{ S.notes[S.sel]=document.getElementById('mNote').value; save(); toast('Not kaydedildi'); back(); },
  ncSave:()=>{ toast('Yeni müşteri iş akışı onaya gönderildi'); back(); },
  dayoffSave:()=>{ const f=x=>document.getElementById(x).value; S.dayoffs.unshift({start:f('doS').split('-').reverse().join('.'),end:f('doE').split('-').reverse().join('.'),type:f('doT'),exp:f('doX')||'-',status:'Onay bekliyor'}); save(); toast('İzin talebi gönderildi'); back(); },
  /* panel */
  tour:d=>tour(d.k), reset:()=>{ try{localStorage.removeItem('xm_demo_cola');}catch(e){} S=seedState(); U={stack:[{s:'login'}],overlay:null,drawer:false,drawerCat:'out',toast:null,tab:{},cart:{},inv:null,assist:null,listening:false}; render(); },
  pre:d=>{ S.pre[d.k]=!S.pre[d.k]; save(); render(); }
};
function collectSurvey(){ const c=selC(); const a=(S.surveyAns[c.id]=S.surveyAns[c.id]||{}); const r=document.querySelector('input[name=q1]:checked'); if(r) a.q1=r.value; document.querySelectorAll('.sv').forEach(el=>a[el.dataset.q]=el.value); }

function voiceLoop(){
  const A2=U.assist; const next=A2.items.find(x=>x.state==='open'); if(!next||!U.listening){ U.listening=false; render(); if(!next) speak('Tüm öneriler işlendi.'); return; }
  A2.cursor=next.pid; U.listenMsg='Okunuyor…'; render();
  speak(`${P(next.pid).name}. ${next.qty} adet öneriliyor. Ekle ya da geç.`, ()=>{
    if(!U.listening) return; U.listenMsg='Dinliyorum… "ekle" ya da "geç"'; render();
    listenOnce(t=>{ if(!U.listening) return; if(t==null){ U.listenMsg='Mikrofon yok: ekle / geç düğmesini kullanın'; render(); return; } voiceHandle(t); });
  });
}
function voiceHandle(t){
  const it=U.assist.items.find(x=>x.pid===U.assist.cursor && x.state==='open') || U.assist.items.find(x=>x.state==='open'); if(!it) return;
  if(/ekle|evet|tamam/.test(t)){ A.aAdd({k:it.pid}); speak('Eklendi.'); }
  else if(/geç|hayır|atla|gec/.test(t)){ it.state='ign'; speak('Geçildi.'); }
  else { speak('Anlayamadım.'); }
  setTimeout(voiceLoop, 900);
}

function afterLogin(){ if(S.seenVersion!==VERSION) ov('news'); else maybeDay(); }
function maybeDay(){ if(!S.daySummaryShown){ S.daySummaryShown=true; save(); ov('day'); } }

function tour(k){
  U.drawer=false; U.overlay=null;
  if(U.stack[0].s==='login'||U.stack[0].s==='load'){ U.stack=[{s:'home'}]; }
  if(k==='news'){ U.stack=[{s:'home'}]; render(); ov('news'); }
  if(k==='day'){ U.stack=[{s:'home'}]; render(); ov('day'); }
  if(k==='today'){ S.pre.xfield=true; S.sel='C2'; U.stack=[{s:'home'},{s:'custlist'},{s:'visit'}]; render(); }
  if(k==='assist'){ S.pre.android12=true; S.sel='C2'; if(!S.visit) S.visit={cust:'C2',start:new Date()}; U.inv={type:'Sipariş',no:slipNo(),note:''}; U.cart={}; U.tab.ie='Kalemler'; U.assist=null; U.stack=[{s:'home'},{s:'custlist'},{s:'visit'},{s:'sliplist'},{s:'invedit'}]; render(); A.openAssist(); }
  if(k==='matrix'){ S.online=true; S.sel='C1'; U.tab.cd='Son Ziyaretler'; U.tab.lv='Matris'; U.stack=[{s:'home'},{s:'custlist'},{s:'visit'},{s:'custdetail'}]; render(); }
  if(k==='note'){ S.pre.noteAuth=true; S.sel='C2'; S.visit={cust:'C2',start:new Date(Date.now()-6*60000)}; U.stack=[{s:'home'},{s:'custlist'},{s:'visit'}]; render(); U._nsChosen=true; C('C2').lastNoSell=C('C2').lastNoSell||'Stoğu Yeterli'; endVisit(); }
  save();
}

function renderPre(){
  const el=document.getElementById('prePanel'); if(!el) return;
  const L=[['xfield','XField adresi tanımlı (Bugün için)'],['noteAuth','Not yetkisi + not grubu (Ziyaret sonu notu)'],['android12','Android 12+ ve Türkçe ses (Dinle ve ekle)'],['singleTarget','Tek hedef türü (Günün özeti · ay hedefi)']];
  el.innerHTML=L.map(([k,n])=>`<label><input type="checkbox" data-a="pre" data-k="${k}" ${S.pre[k]?'checked':''}> ${n}</label>`).join('')+`<label><input type="checkbox" data-a="toggleOnline" ${S.online?'checked':''}> Çevrimiçi (Matris)</label>`;
}

/* ======================= EVENTS ======================= */
document.addEventListener('click', e=>{
  const el=e.target.closest('[data-a]'); if(!el) return;
  if(el.dataset.a==='ovbg' && e.target!==el) return;
  if(el.tagName==='A') e.preventDefault();
  const f=A[el.dataset.a]; if(f) f(el.dataset, e);
});
document.addEventListener('input', e=>{
  const k=e.target.dataset.in; if(!k) return;
  if(k==='cq') U.q=e.target.value; if(k==='pq') U.pq=e.target.value; if(k==='mq') U.mq=e.target.value;
  const pos=e.target.selectionStart; render(); const n=document.querySelector(`[data-in="${k}"]`); if(n){ n.focus(); try{n.setSelectionRange(pos,pos);}catch(_){} }
});
setInterval(()=>{ const st=cur(); if(st.s==='visit' && S.visit && !U.overlay && !U.drawer && document.activeElement.tagName!=='INPUT'){ const b=document.querySelector('.visithead'); if(b){ const sec=Math.floor((Date.now()-new Date(S.visit.start))/1000); const hh=n=>String(n).padStart(2,'0'); b.innerHTML=`Ziyaret Başlangıcı: ${dstr(new Date(S.visit.start))} ${new Date(S.visit.start).toLocaleTimeString('tr-TR')}<br>Geçen Süre: ${hh(Math.floor(sec/3600))}:${hh(Math.floor(sec/60)%60)}:${hh(sec%60)}`; } } },1000);
try{ speechSynthesis && speechSynthesis.getVoices(); }catch(e){}
if(matchMedia('(pointer:coarse)').matches||innerWidth<=640) document.documentElement.classList.add('mob');
render();
</script>

<script>
/* ================= YENİ TASARIM ================= */
if(location.hash==='#yeni') S.ui='new'; else if(location.hash==='#eski') S.ui='old';
if(!S.ui) S.ui=window.XMNative?'new':'old';
I.alert='<path d="M12 4l9 16H3z"/><path d="M12 10v4M12 17v.5"/>';
const isNew=()=>S.ui==='new';
const icF=(n,act)=>`<svg class="ico" viewBox="0 0 24 24" style="stroke-width:${act?2.2:1.8}${act?';fill:currentColor;fill-opacity:.16':''}">${I[n]||''}</svg>`;
const KM={C1:0.8,C2:1.2,C3:2.4,C4:0.3,C5:1.6,C6:3.1,C7:0.9};
const GC={'Gazlı içecek':'#FFE8E8','Su':'#E0F3F1','Soğuk çay':'#FFF4D6','Meyve suyu':'#E3F4EA','Mikser':'#E8F0FE','Enerji / spor':'#F1F2F4'};
const initials=s=>s.split(/\s+/).slice(0,2).map(w=>w[0]).join('');
const km=id=>String(KM[id]||1).replace('.',',');
const planned=()=>S.customers.filter(c=>c.days.includes('Cu')).sort((a,b)=>a.order-b.order);
const visitedN=()=>S.customers.filter(c=>c.status==='visited_sale'||c.status==='visited_nosale').length;
const salesToday=()=>S.slips.filter(x=>x.type!=='İade').reduce((s,x)=>s+x.total,0)+28640;
const paysToday=()=>S.payments.reduce((s,x)=>s+x.amount,0)+9200;
const pendingN=()=>S.slips.filter(x=>x.pending).length+S.payments.filter(x=>x.pending).length;
const lira=n=>Math.round(n).toLocaleString('tr-TR')+' lira';
function elapsed(){ if(!S.visit) return ''; const sec=Math.floor((Date.now()-new Date(S.visit.start))/1000); const h=n=>String(n).padStart(2,'0'); return `${h(Math.floor(sec/3600))}:${h(Math.floor(sec/60)%60)}:${h(sec%60)}`; }
setInterval(()=>document.querySelectorAll('.nv-timer').forEach(e=>e.textContent=elapsed()),1000);
const ring=(pct,label,size=56)=>`<svg width="${size}" height="${size}" viewBox="0 0 36 36" style="flex:none"><circle cx="18" cy="18" r="15.9" fill="none" stroke="#EEF0F3" stroke-width="3.4"/>${pct>0?`<circle cx="18" cy="18" r="15.9" fill="none" stroke="#F40000" stroke-width="3.4" stroke-linecap="round" stroke-dasharray="${pct} ${100-pct}" transform="rotate(-90 18 18)"/>`:''}<text x="18" y="21.2" text-anchor="middle" font-size="8.5" font-weight="700" fill="#000000">${label}</text></svg>`;

function dayText(){ const p=planned(), v=visitedN(), next=p.find(c=>c.status==='planned'), pct=Math.round(S.monthActual/S.monthTarget*100); const ns=next?custSentences(next).slice(0,2):[];
  return `Merhaba ${S.user}. Bugün ${p.length} nokta planlı; ${v} tanesi tamamlandı, ${p.length-v} nokta kaldı. `+(next?`Sıradaki müşteri ${next.name}, ${km(next.id)} kilometre uzakta. ${ns.map(x=>x+'.').join(' ')} `:'')+`Bugünkü satış ${lira(salesToday())}, tahsilat ${lira(paysToday())}. Ay hedefinin yüzde ${pct}'indesin.`; }
function briefText(c){ const s=custSentences(c); return [`${c.name}.`, c.lastNote?`Geçen ziyaret notun: ${c.lastNote.step}. ${c.lastNote.text||''}.`:'', ...s.map(x=>x+'.'), `Bakiye ${lira(c.balance)}.`].join(' '); }
function sumText(){ const p=planned().length, done=S.customers.filter(x=>x.status==='visited_sale').length, nos=S.customers.filter(x=>x.status==='visited_nosale').length, sr=Math.round(done/Math.max(1,done+nos)*100);
  return `Gün özeti. Bugün ${p} ziyaret planlı. ${done+nos} ziyaret tamamlandı: ${done} satışlı, ${nos} satışsız. ${Math.max(0,p-done-nos)} nokta kaldı. Toplam satış, KDV dahil ${lira(salesToday())}. Tahsilat ${lira(paysToday())}. Satışa dönüşme oranı yüzde ${sr}.`; }
function uiSeg(){ return `<div class="useg"><button class="${S.ui!=='new'?'act':''}" data-a="setUI" data-k="old">Eski tasarım</button><button class="${S.ui==='new'?'act':''}" data-a="setUI" data-k="new">Yeni tasarım</button></div>`; }
function ensureAssist(c){ if(!U.assist||U.assist.cust!==c.id) U.assist={cust:c.id,tab:'open',items:suggestions(c).map(s=>({...s,state:'open'}))}; }

/* ---------- shell ---------- */
const TITLES={home:'Bugün',custlist:'Müşteriler',orders:'Siparişler',reports:'Raporlar',more:'Daha fazla',custdetail:'Müşteri bilgisi',sliplist:'Fişler',paylist:'Tahsilatlar',newcust:'Yeni müşteri'};
function nTop(r){ const st=cur(), c=selC(); const title=r.ntitle||r.title||TITLES[st.s]||(c?c.name:'');
  return `<div class="ntop">${U.stack.length>1?`<button class="nib" data-a="back" aria-label="Geri">${ic('back')}</button>`:''}<div class="sp" style="min-width:0"><div class="ntitle">${esc(title)}</div>${r.nsub?`<div class="nsub">${r.nsub}</div>`:''}</div><button class="nib" style="position:relative" data-a="go" data-s="notifs" aria-label="Bildirimler">${ic('bell')}${unread()?`<span class="nbadge">${unread()}</span>`:''}</button><button class="npill ${S.online?'ok':'off'}" data-a="toggleOnline"><i></i>${S.online?'Çevrimiçi':'Çevrimdışı'}</button></div>`; }
function nNav(){ const root=U.stack[0].s, t=['home','custlist','orders','reports','more'].includes(root)?root:'home';
  return `<nav class="nnav">${[['home','Bugün','home'],['custlist','Müşteriler','users'],['orders','Siparişler','cart'],['reports','Raporlar','chart'],['more','Daha fazla','dots']].map(([s,n,i])=>`<button class="${t===s?'act':''}" data-a="nav" data-k="${s}"><span class="nic">${icF(i,t===s)}</span>${n}</button>`).join('')}</nav>`; }
function syncToggle(){ const e=document.getElementById('dtog'); if(e) e.innerHTML=uiSeg(); }

const NS={};
const renderOld=render;
render=function(){
  const root=document.getElementById('scr');
  if(!isNew()){ root.classList.remove('nu'); renderOld(); syncToggle(); return; }
  root.classList.add('nu');
  const st=cur();
  if(st.s==='login'||st.s==='load'){ renderOld(); syncToggle(); return; }
  const r=(NS[st.s]||SCREENS[st.s]||SCREENS.notfound)(st);
  const keep=document.querySelector('.body')?.scrollTop||0;
  const actions=(r.bottom||'').replace(/<button data-a="back">Geri<\/button>/g,'').trim();
  const cta=r.cta||actions;
  const pend=pendingN();
  root.innerHTML = statusBar() + nTop(r)
    + (!S.online?`<div class="nband">${ic('wifi')} Çevrimdışı · ${pend?pend+' belge gönderilmeyi bekliyor':'belgeler cihazda saklanır'}</div>`:'')
    + (r.head||'') + `<div class="body">${r.body}</div>` + (cta?`<div class="ncta">${cta}</div>`:'')
    + (r.noNav?'':nNav()) + (U.overlay?overlay():'') + (U.toast?`<div class="toast">${esc(U.toast)}</div>`:'');
  const b=document.querySelector('.body'); if(b && r.keep) b.scrollTop=keep;
  syncToggle();
};

/* ---------- overrides ---------- */
const custHeadOld=custHead;
custHead=function(){ if(!isNew()) return custHeadOld(); const c=selC(); if(!c) return '';
  return `<div class="nch"><div class="navatar">${initials(c.name)}</div><div class="sp" style="min-width:0"><b class="ell">${esc(c.name)}</b><div class="nsub ell">${c.code} · ${esc(c.addr)}</div></div><div class="nbal ${c.balance<0?'':'pos'}">${tl(c.balance)}</div></div>`; };
const startVisitOld=startVisit;
startVisit=function(){ if(!isNew()) return startVisitOld(); S.visit={cust:S.sel,start:new Date(),hadSale:false}; U.briefOpen=true; save(); U.toast='Ziyaret başladı'; clearTimeout(toast._t); toast._t=setTimeout(()=>{U.toast=null;render();},1800); render(); };
const afterLoginOld=afterLogin; afterLogin=function(){ if(!isNew()) return afterLoginOld(); };
const maybeDayOld=maybeDay; maybeDay=function(){ if(!isNew()) return maybeDayOld(); };
const saveSlipOld=A.saveSlip; A.saveSlip=function(){ const n=S.slips.length; saveSlipOld(); if(S.slips.length>n && !S.online){ S.slips[0].pending=true; save(); render(); } };
const paySaveOld=A.paySave; A.paySave=function(){ const n=S.payments.length; paySaveOld(); if(S.payments.length>n && !S.online){ S.payments[0].pending=true; save(); render(); } };
A.toggleOnline=function(){ S.online=!S.online; let n=0; if(S.online) S.slips.concat(S.payments).forEach(x=>{ if(x.pending){x.pending=false;n++;} }); save();
  toast(S.online? (n?`Çevrimiçi · ${n} belge gönderildi`:'Çevrimiçi') : 'Çevrimdışı · belgeler cihazda saklanır'); };

/* ---------- rows ---------- */
function nCustRow(c){ const st=c.status==='visited_sale'?['ok','Satış']:c.status==='visited_nosale'?['warn','Satışsız']:null; const f=custSentences(c);
  return `<div class="nrow" data-a="nOpenCust" data-k="${c.id}"><div class="navatar ${st?st[0]:''}">${st?ic('check'):initials(c.name)}</div><div class="sp" style="min-width:0"><div class="row" style="gap:6px"><b class="ell">${esc(c.name)}</b>${st?`<span class="nchip ${st[0]}">${st[1]}</span>`:''}</div><div class="nsub ell">${c.code} · ${esc(c.addr)}</div>${f.length&&!st?`<div class="nsub ell" style="color:#8A5A00">${ic('alert')} ${esc(f[0])}${f.length>1?` · +${f.length-1}`:''}</div>`:''}</div><div class="nbal ${c.balance<0?'':'pos'}">${tl(c.balance)}</div></div>`; }

/* ---------- Bugün ---------- */
NS.home=()=>{ const p=planned(), v=visitedN(), pct=Math.round(v/Math.max(1,p.length)*100), act=S.visit?C(S.visit.cust):null, next=act||p.find(c=>c.status==='planned'), mp=Math.round(S.monthActual/S.monthTarget*100);
  const h=new Date().getHours(), greet=h<12?'Günaydın':h<18?'İyi günler':'İyi akşamlar', sn=next?custSentences(next):[];
  return {ntitle:`${greet}, ${S.user}`, nsub:'Cuma, 20 Kasım · Rut R-12', body:`
  ${S.seenVersion!==VERSION?`<div class="ncard ninfo"><div class="row"><span class="nspark" style="background:#fff">${ic('spark')}</span><div class="sp"><b>Bu sürümde 6 yenilik</b><div class="nsub">Sürüm ${VERSION}</div></div><button class="nbtn tonal sm" style="background:#fff" data-a="ov" data-o="news">Gör</button><button class="nib" data-a="nNewsX" aria-label="Kapat">${ic('x')}</button></div></div>`:''}
  <div class="ncard"><div class="row"><div class="sp"><div class="nlabel">Bugünkü ilerleme</div><div class="nbig">${v} / ${p.length} ziyaret</div></div>${ring(pct,'%'+pct)}</div>
   <div class="nstats"><div><span>Satış</span><b>${Math.round(salesToday()).toLocaleString('tr-TR')} ₺</b></div><div><span>Tahsilat</span><b>${Math.round(paysToday()).toLocaleString('tr-TR')} ₺</b></div><div><span>Ay hedefi</span><b>%${mp}</b></div></div>
   <button class="nbtn tonal full" data-a="nSpeak" data-k="day">${ic('play')} Günü dinle</button></div>
  ${next?`<div class="nsec">${act?'Devam eden ziyaret':'Sıradaki'}</div>
  <div class="ncard nnext"><div class="row" style="align-items:flex-start"><div class="navatar lg">${initials(next.name)}</div><div class="sp" style="min-width:0"><b class="nname">${esc(next.name)}</b><div class="nsub">${esc(next.addr)}</div><div class="nmeta">${ic('pin')} ${km(next.id)} km · ${next.order}. sıra · ${esc(next.channel)}</div></div></div>
   ${sn.length?`<div class="nflags">${sn.slice(0,3).map(s=>`<span class="nflag">${ic('alert')} ${esc(s)}</span>`).join('')}</div>`:''}
   <div class="row" style="gap:8px;margin-top:14px"><button class="nbtn outline" data-a="toast" data-t="Yol tarifi haritada açıldı">${ic('map')} Yol tarifi</button><button class="nbtn primary sp" data-a="nStartCust" data-k="${next.id}">${act?'Ziyarete dön':'Ziyarete başla'}</button></div></div>`:''}
  <div class="nsec">Kalan rota</div><div class="ncard np0">${p.map(nCustRow).join('')}</div><div style="padding:4px 12px 14px"><button class="nbtn outline full" data-a="nDayEnd">${ic('check')} Günü kapat</button></div>`}; };

/* ---------- Müşteriler ---------- */
NS.custlist=()=>{ const tab=U.tab.ncl||'today', q=(U.q||'').toLocaleLowerCase('tr'); let l=S.customers.slice().sort((a,b)=>a.order-b.order);
  if(tab==='today') l=l.filter(c=>c.days.includes('Cu')); if(tab==='tom') l=l.filter(c=>c.days.includes('Cmt')); if(tab==='near') l=l.sort((a,b)=>KM[a.id]-KM[b.id]).slice(0,4);
  if(q) l=l.filter(c=>(c.name+c.code).toLocaleLowerCase('tr').includes(q));
  const chip=(k,n,cnt)=>`<button class="nchipbtn ${tab===k?'act':''}" data-a="tab" data-g="ncl" data-k="${k}">${n}${cnt!=null?` <span>${cnt}</span>`:''}</button>`;
  return {keep:true, head:`<div class="nsearch"><div class="nbox">${ic('search')}<input placeholder="Müşteri adı veya kodu" value="${esc(U.q||'')}" data-in="cq"></div><button class="nib out" data-a="go" data-s="map" aria-label="Harita">${ic('map')}</button></div><div class="nchips">${chip('today','Bugün',planned().length)}${chip('tom','Yarın',S.customers.filter(c=>c.days.includes('Cmt')).length)}${chip('near','Yakınımda')}${chip('all','Tümü',S.customers.length)}</div>`,
   body:`<div class="ncard np0" style="margin-top:4px">${l.map(nCustRow).join('')||'<div class="empty">Sonuç yok. Aramayı değiştirin.</div>'}</div><div style="height:8px"></div>`}; };

/* ---------- Ziyaret ---------- */
NS.visit=()=>{ const c=selC(); if(!c) return SCREENS.needcust(); const v=S.visit&&S.visit.cust===c.id, done=S.visitsDone[c.id]||{};
  const defs=[['Slip','Fiş / sipariş','cart','sliplist',1],['Survey','Anket','survey','survey',1],['Payment','Tahsilat','coin','paylist'],['EmptyCrate','Boş kasa','box','emptycrate'],['Equipment','Ekipman doğrulama','barcode','equip'],['Availability','Penetrasyon','avail','avail'],['Task','Atanan görevler','task','tasks'],['VisitPicture','Ziyaret fotoğrafları','photo','gallery'],['Promo Implementation','Promosyon uygulama','promo','promoimp'],['Tasting Promo','Tadım promosyonu','gift','tasting'],['WorkFlow','İş akışı','flow','workflow']];
  const req=defs.filter(d=>d[4]), reqDone=req.filter(d=>done[d[0]]).length, open=defs.filter(d=>!done[d[0]]), fin=defs.filter(d=>done[d[0]]);
  const item=d=>`<div class="ncheck ${done[d[0]]?'done':''}" data-a="vtask" data-s="${d[3]}" data-k="${d[0]}"><span class="nci">${ic(done[d[0]]?'check':d[2])}</span><div class="sp"><b>${d[1]}</b>${d[4]&&!done[d[0]]?'<div class="nreq">Zorunlu</div>':''}</div>${ic('chev')}</div>`;
  const s=custSentences(c), bo=U.briefOpen!==false;
  return {ntitle:c.name, nsub:`${c.code} · ${esc(c.channel)}`, body:`
  <div class="ncard"><div class="row" style="align-items:flex-start"><div class="sp"><div class="nlabel">Bakiye</div><div class="nbig">${tl(c.balance)}</div><div class="nsub">Limit ${tl(c.limit)}</div><div class="nsub" style="margin-top:2px;color:${gpsDist(c.id)>RADIUS?'#8A5A00':'#17703F'}">${ic('pin')} Müşteriye ${gpsDist(c.id)} m${gpsDist(c.id)>RADIUS?' · izin verilen '+RADIUS+' m dışında':''}</div></div><span class="nstatus ${v?'live':''}">${v?`<i></i><span class="nv-timer">${elapsed()}</span>`:'Ziyaret başlamadı'}</span></div>
   <div class="nquick">${[['lastVisit','Son ziyaret','clock'],['nMatrix','Matris','stock'],['nInfo','Bilgi','user'],['nNosell','Satmama','noSell'],['nFiles','Dosyalar','folder']].map(([a,n,i])=>`<button data-a="${a}">${ic(i)}<span>${n}</span></button>`).join('')}</div></div>
  <div class="ncard"><div class="row nbriefh" data-a="nBrief"><span class="nspark">${ic('spark')}</span><b class="sp">Ziyaret özeti</b><button class="nbtn tonal sm" data-a="nSpeak" data-k="brief">${ic('play')} Dinle</button>${ic(bo?'minus':'plus')}</div>
   ${bo?`${c.lastNote?`<div class="nbi"><div class="nlabel">Geçen ziyaret notun · ${dshort(new Date(c.lastNote.date))}</div>${esc(c.lastNote.step)}${c.lastNote.text?'. '+esc(c.lastNote.text):''}</div>`:''}
    ${s.length?`<div class="nbi"><div class="nlabel">Bugün için</div>${s.map(x=>`<div class="nflag full">${ic('alert')} ${esc(x)}</div>`).join('')}</div>`:''}
    ${!c.lastNote&&!s.length?'<div class="nbi nsub">Bu müşteride dikkat edilecek bir konu yok.</div>':''}`:''}</div>
  <div class="ncard"><div class="row" style="margin-bottom:6px"><div class="sp"><b style="font-size:16px">Ziyaret adımları</b><div class="nsub">${reqDone}/${req.length} zorunlu adım tamam</div></div>${ring(Math.round(fin.length/defs.length*100),fin.length+'/'+defs.length,48)}</div>
   ${open.map(item).join('')}${fin.length?`<div class="nlabel" style="margin-top:14px">Tamamlananlar</div>${fin.map(item).join('')}`:''}</div><div style="height:6px"></div>`,
  cta: v?`<button class="nbtn outline" data-a="visitToggle">Ziyareti bitir</button><button class="nbtn primary" style="flex:1.4" data-a="nOrder">${ic('cart')} Sipariş al</button>`:`<button class="nbtn primary full" data-a="visitToggle">${ic('play')} Ziyarete başla</button>`}; };

/* ---------- Sipariş ---------- */
NS.invedit=()=>{ const c=selC(), tab=U.tab.ie||'Kalemler', T=invTotals(); ensureAssist(c);
  const head=`<div class="nchips">${[['Kalemler','Ürünler'],['Başlık','Başlık'],['İskonto','İskonto'],['Özet','Özet']].map(([k,n])=>`<button class="nchipbtn ${tab===k?'act':''}" data-a="tab" data-g="ie" data-k="${k}">${n}</button>`).join('')}</div>`;
  let body;
  if(tab!=='Kalemler') body=SCREENS.invedit().body;
  else { const q=(U.pq||'').toLocaleLowerCase('tr'), prods=PRODUCTS.filter(p=>!q||(p.name+p.code).toLocaleLowerCase('tr').includes(q)), open=U.assist.items.filter(x=>x.state==='open');
   body=`<div class="nsearch"><div class="nbox">${ic('search')}<input placeholder="Ürün adı veya kodu" value="${esc(U.pq||'')}" data-in="pq"></div><button class="nib out" data-a="ov" data-o="barcode" aria-label="Barkod okut">${ic('barcode')}</button></div>
   ${promoBar()}${open.length?`<div class="nsugh"><span class="nspark">${ic('spark')}</span><b class="sp">Asistan önerileri · ${open.length}</b><button class="nbtn tonal sm" data-a="nListen">${ic('mic')} Dinle ve ekle</button><button class="nlink" data-a="openAssist">Tümü</button></div>
   <div class="nsugs">${open.map(x=>{const p=P(x.pid);return `<div class="nsug"><div class="nsub" style="color:#000000;font-weight:600">${x.kind==='must'?'★ Must SKU':'Tekrar sipariş'}</div><b class="ell">${esc(p.name)}</b><div class="nsub ell">${esc(x.reason)}</div><div class="row" style="gap:6px;margin-top:10px"><button class="nbtn primary sm sp" data-a="aAdd" data-k="${x.pid}">+${x.qty} ekle</button><button class="nbtn tonal sm" data-a="aWhy" data-k="${x.pid}">Neden?</button><button class="nib" data-a="aIgn" data-k="${x.pid}" aria-label="Yoksay">${ic('x')}</button></div></div>`}).join('')}</div>`:''}
   <div class="ncard np0">${prods.map(p=>{const q2=U.cart[p.id]?.qty||0, must=(c.must||[]).includes(p.id);
    return `<div class="nprod"><div class="nimg" style="background:${GC[p.grp]||'#EEF0F3'}">${esc(p.grp.slice(0,2))}</div><div class="sp" style="min-width:0" data-a="openQty" data-k="${p.id}"><b class="ell2">${esc(p.name)}</b><div class="row" style="gap:6px;margin-top:4px;flex-wrap:wrap"><span class="nprice">${tl(p.price)}</span><span class="nchip ${p.stock<10?'warn':''}">Stok ${p.stock}</span>${must?'<span class="nchip must">★ Must</span>':''}${p.gift?'<span class="nchip info">5+1</span>':''}</div></div>
     ${q2?`<div class="nstep"><button data-a="nStep" data-k="${p.id}" data-v="-1" aria-label="Azalt">${ic('minus')}</button><b>${q2}</b><button data-a="nStep" data-k="${p.id}" data-v="1" aria-label="Artır">${ic('plus')}</button></div>`:`<button class="nadd" data-a="nStep" data-k="${p.id}" data-v="1" aria-label="Ekle">${ic('plus')}</button>`}</div>`}).join('')}</div><div style="height:8px"></div>`; }
  return {ntitle:`${U.inv.type} · ${c.name}`, nsub:U.inv.no, keep:tab==='Kalemler', noNav:true, head, body,
   cta:`<button class="ncart" data-a="ov" data-o="cart"><span class="ncartn">${T.lines}</span><span class="sp" style="text-align:left"><b>${tl(T.total)}</b>${U.inv.type!=='İade'&&T.total>availLimit(c)?`<span class="nsub" style="color:#B42318;font-weight:700">Limit aşımı · kalan ${tl(availLimit(c))}</span>`:`<span class="nsub">${T.lines} kalem · KDV dahil</span>`}</span></button><button class="nbtn primary" data-a="saveSlip">Kaydet</button>`}; };

/* ---------- Siparişler ---------- */
NS.orders=()=>{ const draft=U.inv&&U.inv.cust&&Object.keys(U.cart).length, T=draft?invTotals():null;
  return {body:`${draft?`<div class="nsec">Devam eden</div><div class="ncard" data-a="nResume"><div class="row"><span class="nspark">${ic('cart')}</span><div class="sp"><b>${esc(C(U.inv.cust).name)}</b><div class="nsub">${U.inv.type} · ${T.lines} kalem · ${tl(T.total)}</div></div>${ic('chev')}</div></div>`:''}
  <div class="nsec">Bugün oluşturulanlar</div>
  <div class="ncard np0">${S.slips.map(s=>`<div class="nrow"><div class="navatar ${s.type==='İade'?'warn':'ok'}">${ic(s.type==='İade'?'refresh':'note')}</div><div class="sp" style="min-width:0"><b class="ell">${esc(C(s.cust).name)}</b><div class="nsub">${s.type} · ${s.no} · ${s.time}</div></div><div style="text-align:right"><div class="nbal">${tl(s.total)}</div>${s.approval?`<span class="nchip ${s.approval==='Onaylandı'?'ok':'warn'}">${s.approval}</span>`:(s.pending?'<span class="nchip warn">Gönderilmedi</span>':'<span class="nchip ok">Gönderildi</span>')}</div></div>`).join('')||'<div class="empty">Bugün henüz sipariş yok.<br>Bir ziyarette "Sipariş al" ile başlayın.</div>'}</div>`,
  cta:`<button class="nbtn primary full" data-a="nNewOrder">${ic('plus')} Yeni sipariş</button>`}; };

/* ---------- Raporlar ---------- */
NS.reports=()=>{ const p=planned().length, done=S.customers.filter(x=>x.status==='visited_sale').length, nos=S.customers.filter(x=>x.status==='visited_nosale').length, sr=Math.round(done/Math.max(1,done+nos)*100), mp=Math.round(S.monthActual/S.monthTarget*100);
  const m=(n,v)=>`<div class="nmet"><span>${n}</span><b>${v}</b></div>`;
  return {body:`<div class="ncard"><div class="row"><b class="sp" style="font-size:16px">Gün özeti</b><button class="nbtn tonal sm" data-a="nSpeak" data-k="sum">${ic('play')} Dinle</button></div><div class="nmets">${m('Planlanan',p)}${m('Kalan',Math.max(0,p-done-nos))}${m('Satışlı',done)}${m('Satışsız',nos)}${m('Satış (KDV dahil)',tl(salesToday()))}${m('Tahsilat',tl(paysToday()))}</div><div class="nsub" style="margin-top:10px">Satışa dönüşme oranı %${sr}</div></div>
  <div class="ncard"><b style="font-size:16px">Ay hedefi</b>${[['Ciro',mp],['Koli',58],['Must SKU dağılımı',71],['Yeni müşteri',60]].map(([n,v])=>`<div class="nhb"><div class="row"><span class="sp">${n}</span><b>%${v}</b></div><div class="nbar"><i style="width:${v}%"></i></div></div>`).join('')}<div class="nsub" style="margin-top:10px">${tl(S.monthActual)} / ${tl(S.monthTarget)}</div></div>
  <div class="ncard np0">${[['nDayEnd','Günü kapat','Ziyaret edilmeyenler, kasa ve boş kasa mutabakatı','check'],['nRep','Müşteri performans raporu','Seçili müşteri · çevrimiçi','report'],['nOffRep','Çevrimdışı raporlar','Bugünkü satış ve tahsilat','report'],['nTarget','Hedef detayı','Ciro, koli, dağılım','target']].map(([a,n,s,i])=>`<div class="nrow" data-a="${a}"><div class="navatar">${ic(i)}</div><div class="sp"><b>${n}</b><div class="nsub">${s}</div></div>${ic('chev')}</div>`).join('')}</div>`}; };

/* ---------- Daha fazla ---------- */
NS.more=()=>{ const q=(U.mq||'').toLocaleLowerCase('tr'), items=[];
  menuTree().forEach(m=>{ (m.sub||[]).forEach(it=>{ if(!it.g && it.a!=='setUI') items.push({...it,grp:m.n}); }); if(!m.sub && ['map','brief','learn'].includes(m.k)) items.push({n:m.n,i:m.i,s:m.s,grp:'Diğer'}); });
  items.push({n:'Mesajlar',i:'msg',s:'messages',grp:'Diğer'});
  const f=items.filter(it=>!q||(it.n+' '+it.grp).toLocaleLowerCase('tr').includes(q)), groups=[...new Set(f.map(x=>x.grp))], pn=pendingN();
  return {keep:true, body:`<div class="ncard"><b style="font-size:16px">Tasarım</b><div class="nsub">Aynı veri, iki arayüz</div>${uiSeg()}</div>
  <div class="ncard"><div class="row"><span class="navatar ${pn?'warn':'ok'}">${ic(pn?'refresh':'check')}</span><div class="sp"><b>${pn?pn+' belge gönderilmeyi bekliyor':'Tüm veriler gönderildi'}</b><div class="nsub">Son senkron ${new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</div></div><button class="nbtn tonal sm" data-a="refresh">Senkronla</button></div></div>
  <div class="nsearch"><div class="nbox">${ic('search')}<input placeholder="Menüde ara" value="${esc(U.mq||'')}" data-in="mq"></div></div>
  ${groups.map(g=>`<div class="nsec">${esc(g)}</div><div class="ncard np0">${f.filter(x=>x.grp===g).map(it=>`<div class="nrow" data-a="menu" data-s="${it.s||''}" data-act="${it.a||''}" data-t="${esc(it.t||'')}" data-o="${it.o||''}" data-c="${it.c||''}"><div class="navatar">${ic(it.i)}</div><b class="sp">${it.n}</b>${ic('chev')}</div>`).join('')}</div>`).join('')}
  <div class="ncard np0" style="margin-top:14px"><div class="nrow" data-a="logout"><div class="navatar">${ic('quit')}</div><b class="sp" style="color:#B42318">Çıkış yap</b></div></div><div style="height:8px"></div>`}; };

/* ---------- actions ---------- */
Object.assign(A,{
  setUI:d=>{ S.ui=d.k; save(); U.overlay=null; U.drawer=false;
    if(d.k==='old' && U.stack.some(x=>['orders','reports','more'].includes(x.s))) U.stack=[{s:'home'}];
    if(d.k==='new' && U.stack.length && !['login','load'].includes(U.stack[0].s) && !['home','custlist','orders','reports','more'].includes(U.stack[0].s)) U.stack.unshift({s:'home'});
    toast(d.k==='new'?'Yeni tasarım':'Eski tasarım'); },
  nav:d=>{ U.stack=[{s:d.k}]; U.overlay=null; render(); scrollTop(); },
  nNewsX:()=>{ S.seenVersion=VERSION; save(); render(); },
  nSpeak:d=>speak(d.k==='day'?dayText():d.k==='sum'?sumText():briefText(selC())),
  nOpenCust:d=>{ S.sel=d.k; save(); go('visit'); },
  nStartCust:d=>{ S.sel=d.k; save(); U.stack.push({s:'visit'});
    if(S.visit && S.visit.cust!==d.k){ render(); return toast('Önce aktif ziyareti bitirin: '+C(S.visit.cust).name); }
    if(!S.visit) startVisit(); else render(); scrollTop(); },
  nBrief:()=>{ U.briefOpen=!(U.briefOpen!==false); render(); },
  nOrder:()=>requireVisit(()=>{ if(!(U.inv&&U.inv.cust===S.sel&&Object.keys(U.cart).length)){ U.inv={type:'Sipariş',no:slipNo(),note:'',cust:S.sel}; U.cart={}; } U.tab.ie='Kalemler'; go('invedit'); }),
  nStep:d=>{ const q=(U.cart[d.k]?.qty||0)+(+d.v); if(q<=0) delete U.cart[d.k]; else U.cart[d.k]={...(U.cart[d.k]||{}),qty:q}; if(q>P(d.k).stock) toast('Uyarı: stok '+P(d.k).stock); else render(); },
  nListen:()=>{ A.openAssist(); A.listenAdd(); },
  nMatrix:()=>{ U.tab.cd='Son Ziyaretler'; U.tab.lv='Matris'; go('custdetail'); },
  nInfo:()=>{ U.tab.cd='Tanım'; go('custdetail'); },
  nNosell:()=>go('nosell'), nFiles:()=>go('briefcase'),
  nResume:()=>{ S.sel=U.inv.cust; go('invedit'); },
  nNewOrder:()=>{ if(S.sel){ U.stack=[{s:'custlist'},{s:'visit'}]; A.nOrder(); } else { U.stack=[{s:'custlist'}]; render(); toast('Önce müşteri seçin'); } },
  nRep:()=>requireCust(()=>go('onlinerep')), nOffRep:()=>go('offlinerep'), nTarget:()=>go('target')
});
render();
</script>

<script>
/* ================= SUNUM ÖNCESİ EKLEMELER ================= */
I.bell='<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/>';
const now=()=>new Date().toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'});
const RADIUS=150;
const GPSD={C1:35,C2:60,C3:110,C4:20,C5:420,C6:85,C7:40};
const gpsDist=id=>GPSD[id]??50;
const DEPO_UNIT={k:120,s:5,f:1500}, DEPO_N={k:"Kasa (24'lü)",s:'Cam şişe 1L',f:'Fıçı 20L'};
if(!S.depo) S.depo={};
if(!S.crates) S.crates=[];
if(!S.notifs) S.notifs=[
 {id:1,t:'Görev',title:'Yeni görev: Fanta 1 L raf bulunurluğunu kontrol et (PACHA KAFE)',time:'08:12',read:false,link:'tasks'},
 {id:2,t:'Soğutucu',title:'ASLANTUG MARKET: 2 kapılı soğutucu 2 gündür 9 °C üstünde',time:'08:40',read:false,link:null},
 {id:3,t:'Teslimat',title:'MARNI OTEL dünkü siparişi teslim edildi',time:'10:05',read:false,link:null},
 {id:4,t:'Onay',title:'LARA BÜFE yeni müşteri talebi onaylandı',time:'11:30',read:true,link:'workflow'},
 {id:5,t:'Promosyon',title:"Coca-Cola 1 L ve Fanta 1 L 5+1 kampanyası 30 Kasım'a kadar uzatıldı",time:'13:15',read:true,link:null},
 {id:6,t:'Şikayet',title:'SHİNE TABACCO şikayeti: 48 saatlik sürenin 31 saati kaldı',time:'14:02',read:false,link:null}];
function addNotif(t,title,link){ S.notifs.unshift({id:Date.now(),t,title,time:now(),read:false,link}); save(); }
const unread=()=>S.notifs.filter(n=>!n.read).length;
const NIC={Görev:'task',Soğutucu:'eq',Teslimat:'truck',Onay:'check',Promosyon:'promo',Şikayet:'alert'};
const availLimit=c=>c.limit-Math.max(0,-c.balance);

/* ---------- ek pencereler ---------- */
const OV={};
const overlayPrev=overlay;
overlay=function(){ const o=U.overlay; return OV[o.name]? OV[o.name](o) : overlayPrev(); };

/* ---------- 1) GPS mesafe kontrolü ---------- */
OV.gpsfar=o=>`<div class="ov" data-a="ovbg"><div class="dlg" data-stop><div class="bang">!</div><h2 style="font-size:19px">Müşteriye ${o.d} m uzaktasın</h2><div class="st">İzin verilen mesafe ${RADIUS} m · ${esc(selC().name)}</div><hr>
 <div class="small muted">Sahte konum kontrolü: temiz · GPS doğruluğu 8 m</div>
 <div class="field" style="margin-top:12px"><label>Mesafe dışı ziyaret nedeni *</label><select id="gpsR"><option value="">Seçin</option><option>Müşteri adresi değişmiş</option><option>GPS sinyali zayıf</option><option>Müşteri başka şubede</option><option>Yönetici onaylı</option></select></div>
 <div class="grid2" style="margin-top:8px"><button class="btn gray" data-a="gpsRefresh">Konumu yenile</button><button class="btn red" data-a="gpsGo">Yine de başlat</button></div>
 <button class="btn out" style="width:100%;margin-top:8px" data-a="closeOv">Vazgeç</button></div></div>`;
const startVisitBase=startVisit;
function beginVisit(after){ const d=gpsDist(S.sel); if(d>RADIUS && U._gpsOk!==S.sel){ ov('gpsfar',{d,after}); return; } startVisitBase(); after&&after(); }
startVisit=function(){ beginVisit(null); };
requireVisit=function(fn){ requireCust(()=>{ if(S.visit&&S.visit.cust===S.sel) return fn(); if(S.visit) return toast('Önce aktif ziyareti bitirin: '+C(S.visit.cust).name); beginVisit(fn); }); };
A.gpsGo=()=>{ const r=document.getElementById('gpsR').value; if(!r) return toast('Mesafe dışı nedenini seçin'); const after=U.overlay.after; U._gpsOk=S.sel; (S.gpsLog=S.gpsLog||{})[S.sel]={d:U.overlay.d,reason:r,time:now()}; U.overlay=null; startVisitBase(); after&&after(); };
A.gpsRefresh=()=>{ const after=U.overlay.after; GPSD[S.sel]=38; U.overlay=null; toast('Konum yenilendi: müşteriye 38 m'); setTimeout(()=>{ startVisitBase(); after&&after(); },500); };

/* ---------- 2) Boş kasa alımı ---------- */
function depoOf(c){ if(!S.depo[c.id]){ const bar=c.channel==='Kafe / Restoran'; S.depo[c.id]={k:{full:6,empty:4},s:{full:72,empty:40},f:{full:bar?2:0,empty:bar?1:0}}; } return S.depo[c.id]; }
function depoTable(c){ const d=depoOf(c); let tot=0;
  const rows=Object.keys(DEPO_N).map(k=>{ const dep=(d[k].full+d[k].empty)*DEPO_UNIT[k]; tot+=dep; return `<tr><td>${DEPO_N[k]}</td><td class="n">${d[k].full}</td><td class="n">${d[k].empty}</td><td class="n">${fmt(dep)}</td></tr>`; }).join('');
  const log=S.crates.filter(x=>x.cust===c.id);
  return `<table class="t"><tr><th>Ambalaj</th><th>Dolu</th><th>Boş</th><th>Depozito</th></tr>${rows}<tr><td><b>Toplam</b></td><td></td><td></td><td class="n"><b>${fmt(tot)}</b></td></tr></table>
  ${log.length?`<div class="card"><div class="h3">Bugün alınan boşlar</div>${log.map(x=>`<div class="small muted" style="margin-top:6px">${x.time} · ${esc(x.text)} · depozito iadesi ${tl(x.credit)}</div>`).join('')}</div>`:''}
  <div style="padding:10px 12px"><button class="btn red" style="width:100%" data-a="vtask" data-s="emptycrate" data-k="EmptyCrate">Boş kasa al</button></div>`; }
function crateCredit(v){ v=v||U.crate||{}; return Object.keys(DEPO_UNIT).reduce((s,k)=>s+((v[k]&&v[k].ok)||0)*DEPO_UNIT[k],0); }
function readCrate(){ const v={}; document.querySelectorAll('.crIn').forEach(e=>{ (v[e.dataset.k]=v[e.dataset.k]||{})[e.dataset.f]=Math.max(0,+e.value||0); }); return v; }
SCREENS.emptycrate=()=>{ const c=selC(); if(!c) return SCREENS.needcust(); const d=depoOf(c), v=U.crate||(U.crate={});
  return {title:'Boş kasa alımı', head:custHead(), body:`<div class="card small" style="line-height:1.7"><b>Müşteride bekleyen boş</b><br>${Object.keys(DEPO_N).map(k=>`${DEPO_N[k]}: <b>${d[k].empty}</b>`).join(' · ')}</div>
  ${Object.keys(DEPO_N).map(k=>`<div class="card"><div class="row"><div class="h3 sp">${DEPO_N[k]}</div><span class="small muted">Birim depozito ${tl(DEPO_UNIT[k])}</span></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">${[['ok','Sağlam'],['br','Kırık / eksik'],['ot','Başka marka']].map(([f,n])=>`<div class="field"><label>${n}</label><input type="number" min="0" inputmode="numeric" class="crIn" data-k="${k}" data-f="${f}" value="${(v[k]&&v[k][f])||''}" placeholder="0"></div>`).join('')}</div></div>`).join('')}
  <div class="card"><div class="row"><span class="sp">Depozito iadesi (sağlam boşlar)</span><b id="crTotal">${tl(crateCredit())}</b></div><div class="small muted" style="margin-top:6px">Kırık ve başka marka ambalajın depozitosu iade edilmez; ayrı satırda kayda geçer.</div></div>`,
  bottom:`<button data-a="back">Geri</button><button class="primary" data-a="crSave">Kaydet ve makbuz yazdır</button>`}; };
A.crSave=()=>{ const c=selC(), v=readCrate(), d=depoOf(c); let n=0; const over=[];
  Object.keys(DEPO_N).forEach(k=>{ const x=v[k]||{}; if((x.ok||0)+(x.br||0)>d[k].empty) over.push(DEPO_N[k]); n+=(x.ok||0)+(x.br||0)+(x.ot||0); });
  if(!n) return toast('En az bir ambalaj adedi girin');
  if(over.length) return toast('Müşteride bu kadar boş görünmüyor: '+over.join(', '));
  const credit=crateCredit(v), parts=[];
  Object.keys(DEPO_N).forEach(k=>{ const x=v[k]||{}; d[k].empty-=(x.ok||0)+(x.br||0); if(x.ok) parts.push(`${x.ok} ${DEPO_N[k]}`); if(x.br) parts.push(`${x.br} kırık ${DEPO_N[k]}`); if(x.ot) parts.push(`${x.ot} başka marka`); });
  c.balance+=credit; S.crates.unshift({cust:c.id,time:now(),text:parts.join(', '),credit,v}); (S.visitsDone[c.id]=S.visitsDone[c.id]||{}).EmptyCrate=true; U.crate={}; save(); back(); toast(`Boş kasa alındı · ${tl(credit)} depozito iadesi`); };

/* ---------- 3) Promosyon çubuğu ---------- */
function promoBar(){ const T=invTotals(), TH=10000, L=[];
  if(T.gross>=TH) L.push({ok:1,t:`%3 sepet iskontosu kazanıldı · −${tl(T.ruleDisc)}`,p:100});
  else L.push({ok:0,t:`%3 sepet iskontosu için ${tl(TH-T.gross)} kaldı`,p:Math.round(T.gross/TH*100)});
  PRODUCTS.filter(p=>p.gift).forEach(p=>{ const q=U.cart[p.id]?.qty||0; if(q>0&&q%5) L.push({ok:0,t:`${p.name}: ${5-q%5} koli daha ekle, 1 koli bedelsiz`,p:Math.round(q%5/5*100)}); else if(q>=5) L.push({ok:1,t:`${p.name}: ${Math.floor(q/5)} koli bedelsiz kazanıldı`,p:100}); });
  return `<div class="promobar">${L.slice(0,2).map(l=>`<div class="pb ${l.ok?'ok':''}"><div class="row" style="gap:8px">${ic(l.ok?'check':'tag')}<span class="sp">${l.t}</span></div><div class="nbar"><i style="width:${l.p}%"></i></div></div>`).join('')}</div>`; }
const invPrev=SCREENS.invedit;
SCREENS.invedit=st=>{ const r=invPrev(st); if(!isNew() && (U.tab.ie||'Kalemler')==='Kalemler') r.body=promoBar()+r.body; return r; };

/* ---------- 4) Kredi limiti kontrolü ---------- */
OV.limit=o=>{ const c=selC(); return `<div class="ov" data-a="ovbg"><div class="dlg" data-stop><div class="bang">!</div><h2 style="font-size:19px">Kredi limiti aşılıyor</h2><div class="st">${esc(c.name)}</div><hr>
  ${[['Kredi limiti',tl(c.limit)],['Açık bakiye',tl(Math.max(0,-c.balance))],['Kalan limit',tl(o.a)],['Bu sipariş (KDV dahil)',tl(o.t)],['Aşım',tl(o.t-o.a)]].map(([k,v],i)=>`<div class="row" style="padding:7px 0;${i===4?'color:#B42318;font-weight:700':''}"><span class="sp">${k}</span><b>${v}</b></div>`).join('')}
  ${c.overdue?`<div class="small" style="background:#FFF4D6;color:#8A5A00;border-radius:10px;padding:8px 10px;margin-top:8px">Ayrıca vadesi geçen ${tl(c.overdue)} borç var.</div>`:''}
  <button class="btn red" style="width:100%;margin-top:14px" data-a="limApprove">Onaya gönder ve kaydet</button>
  <div class="grid2" style="margin-top:8px"><button class="btn gray" data-a="limPay">Önce tahsilat al</button><button class="btn gray" data-a="closeOv">Sepeti düzenle</button></div></div></div>`; };
const saveSlipPrev=A.saveSlip;
A.saveSlip=function(){ const c=selC(), T=invTotals(); if(!T.lines) return toast('Sepet boş');
  if(U.inv.type!=='İade' && !U._limitOk && T.total>availLimit(c)) return ov('limit',{t:T.total,a:availLimit(c)});

    setTimeout(()=>{ s.approval='Onaylandı'; addNotif('Onay',`Kredi onayı verildi: ${c.name} · Bölge müdürü`,null); save(); render(); toast('Bildirim: kredi onayı verildi'); },8000); } };

A.limPay=()=>{ U.overlay=null; go('paylist'); setTimeout(()=>ov('payform'),60); };

/* ---------- 5) Bildirimler ---------- */
SCREENS.notifs=()=>{ const tab=U.tab.nt||'Tümü', l=S.notifs.filter(n=>tab==='Tümü'||!n.read);
  return {title:'Bildirimler', head:`<div class="tabs">${['Tümü','Okunmamış'].map(t=>`<button class="${t===tab?'act':''}" data-a="tab" data-g="nt" data-k="${t}">${t}${t==='Okunmamış'&&unread()?' · '+unread():''}</button>`).join('')}</div>`,
  body:`<div class="list">${l.map(n=>`<div class="it" data-a="notifOpen" data-k="${n.id}" style="${n.read?'':'background:#F3F7FF'}"><span style="color:${n.t==='Şikayet'||n.t==='Soğutucu'?'#8A5A00':'var(--fg2)'}">${ic(NIC[n.t]||'msg')}</span><div class="sp"><div class="small muted">${n.t} · ${n.time}</div><div style="${n.read?'':'font-weight:700'}">${esc(n.title)}</div></div>${n.read?'':'<span style="width:9px;height:9px;border-radius:50%;background:#F40000;flex:none"></span>'}</div>`).join('')||'<div class="empty">Okunmamış bildirim yok</div>'}</div>`,
  bottom:`<button data-a="back">Geri</button><button data-a="go" data-s="messages">Mesajlar</button><button class="primary" data-a="notifAll">Tümünü okundu yap</button>`}; };
A.notifOpen=d=>{ const n=S.notifs.find(x=>String(x.id)===d.k); n.read=true; save(); if(n.link) go(n.link); else render(); };

/* ---------- 6) Gün sonu ---------- */
SCREENS.dayend=()=>{ const un=planned().filter(c=>c.status==='planned'), de=U.de||(U.de={});
  const pays={Nakit:6200,'Çek':3000}; S.payments.forEach(x=>pays[x.type]=(pays[x.type]||0)+x.amount); U.deExp=pays.Nakit;
  const unprinted=S.slips.filter(s=>!s.printed).length, cr={k:0,s:0,f:0};
  S.crates.forEach(x=>Object.keys(cr).forEach(k=>{ const v=x.v[k]||{}; cr[k]+=(v.ok||0)+(v.br||0)+(v.ot||0); }));
  if(S.dayClosed) return {title:'Günü kapat', body:`<div class="empty">${ic('check')}<br><br><b>Gün kapatıldı · ${S.dayClosed}</b><br>Check-out yapıldı, veriler gönderildi.</div>`, bottom:`<button data-a="back">Geri</button><button data-a="deReopen">Günü yeniden aç (demo)</button>`};
  const diffBad=de.cash!=null&&de.cash!==''&&Math.abs(+de.cash-pays.Nakit)>0.009;
  return {title:'Günü kapat', body:`
  <div class="card"><div class="h3">Ziyaret edilmeyenler · ${un.length}</div>${un.length?un.map(c=>`<div style="padding-top:10px;border-top:1px solid var(--line);margin-top:10px"><div class="row"><b class="sp">${esc(c.name)}</b><span class="small muted">${c.order}. sıra</span></div><select class="deR" data-k="${c.id}" style="width:100%;margin-top:6px;border:1px solid #CDD2D8;border-radius:10px;padding:9px;background:#fff"><option value="">Neden seçin *</option>${['Dükkan kapalıydı','Zaman yetmedi','Yarına ertelendi','Yetkili yoktu','Müşteri istemedi'].map(o=>`<option ${de[c.id]===o?'selected':''}>${o}</option>`).join('')}</select></div>`).join(''):'<div class="small muted" style="margin-top:6px">Tüm planlı noktalar ziyaret edildi.</div>'}</div>
  <div class="card"><div class="h3">Kasa mutabakatı</div>${Object.entries(pays).filter(([,v])=>v).map(([k,v])=>`<div class="row" style="padding:6px 0"><span class="sp">${k}</span><b>${tl(v)}</b></div>`).join('')}
   <div class="field"><label>Teslim edilen nakit *</label><input id="deCash" type="number" inputmode="decimal" step="0.01" value="${de.cash??''}" placeholder="${fmt(pays.Nakit)}"></div>
   <div id="deDiff" class="small" style="font-weight:600">${diffTxt(pays.Nakit,de.cash)}</div>
   <div class="field" id="deWhyBox" style="${diffBad?'':'display:none'}"><label>Fark nedeni *</label><select id="deWhy"><option value="">Seçin</option>${['Bozuk para / yuvarlama','Müşteri sonra ödeyecek','Masraf ödendi','Diğer'].map(o=>`<option ${de.why===o?'selected':''}>${o}</option>`).join('')}</select></div></div>
  <div class="card"><div class="h3">Boş kasa mutabakatı</div>${Object.keys(DEPO_N).map(k=>`<div class="row" style="padding:6px 0"><span class="sp">${DEPO_N[k]}</span><span class="small muted" style="margin-right:10px">alınan</span><b>${cr[k]}</b></div>`).join('')}<div class="small muted">Araca yüklenen boşlar depoda sayılıp bu rakamlarla karşılaştırılır.</div></div>
  <div class="card"><div class="row"><div class="sp"><div class="h3">Yazdırılmamış fiş</div><div class="small muted">${unprinted?unprinted+' fiş yazdırılmadı':'Tüm fişler yazdırıldı'}</div></div>${unprinted?'<button class="btn gray" style="padding:8px 12px" data-a="printAll">Tümünü yazdır</button>':'<span class="badge g">Tamam</span>'}</div></div>
  <div class="card"><div class="h3">Ay sonu tahmini</div><div class="small muted" style="margin-top:4px">Gerçekleşen ${tl(S.monthActual)} · bu hızla ay sonu ${tl(Math.round(S.monthActual/20*30))} · hedef ${tl(S.monthTarget)}</div></div>`,
  bottom:`<button data-a="back">Geri</button><button class="primary" data-a="deClose">Günü kapat ve check-out yap</button>`}; };
function diffTxt(exp,v){ if(v==null||v==='') return `<span class="muted">Beklenen nakit ${tl(exp)}</span>`; const d=(+v)-exp; return Math.abs(d)<0.01?'<span style="color:#17703F">✓ Fark yok</span>':`<span style="color:#B42318">Fark: ${tl(d)}</span>`; }
document.addEventListener('input',e=>{
  if(e.target.classList.contains('crIn')){ U.crate=readCrate(); const t=document.getElementById('crTotal'); if(t) t.textContent=tl(crateCredit()); }
  if(e.target.id==='deCash'){ U.de.cash=e.target.value; document.getElementById('deDiff').innerHTML=diffTxt(U.deExp,U.de.cash); const bad=U.de.cash!==''&&Math.abs(+U.de.cash-U.deExp)>0.009; document.getElementById('deWhyBox').style.display=bad?'':'none'; }
});
document.addEventListener('change',e=>{ if(e.target.classList.contains('deR')) U.de[e.target.dataset.k]=e.target.value; if(e.target.id==='deWhy') U.de.why=e.target.value; });
A.deClose=()=>{ const un=planned().filter(c=>c.status==='planned'), de=U.de||{};
  const miss=un.filter(c=>!de[c.id]); if(miss.length) return toast(`${miss.length} müşteri için ziyaret etmeme nedeni seçin`);
  if(de.cash==null||de.cash==='') return toast('Teslim edilen nakit tutarını girin');
  if(Math.abs(+de.cash-U.deExp)>0.009 && !de.why) return toast('Kasa farkının nedenini seçin');
  S.dayClosed=now(); S.slips.forEach(s=>s.pending=false); save(); render(); toast('Gün kapatıldı · check-out '+S.dayClosed); };
A.deReopen=()=>{ S.dayClosed=null; save(); render(); };
A.nDayEnd=()=>go('dayend');
render();
</script>

<script>
/* ===== Sesli okuma için metin düzeltme: büyük harfli adları harf harf okumasın ===== */
const SAY_KEEP=new Set(['KDV','SKU','GPS','RED','POSM','ERP','B2B','SMS','QR','AI','IR','CCİ']);
function sayable(t){ t=String(t||'');
  t=t.replace(/(\d+(?:[.,]\d+)?)\s*(ML|CL|LT|L)\b/gi,(m,n,u)=>n+' '+({ML:'mililitre',CL:'santilitre',LT:'litre',L:'litre'})[u.toUpperCase()]);
  t=t.replace(/\bX\s*(\d+)\b/g,(m,n)=>n+"'li");
  t=t.replace(/(\d)\s*°\s*C?/g,'$1 derece ').replace(/%\s*(\d+)/g,'yüzde $1');
  t=t.replace(/₺/g,' lira').replace(/\bTL\b/g,'lira');
  t=t.replace(/[A-ZÇĞİÖŞÜ]{2,}/g,w=> SAY_KEEP.has(w)||!/[AEIİOÖUÜ]/.test(w) ? w : w.charAt(0)+w.slice(1).toLocaleLowerCase('tr'));
  return t; }
const speakRawFn=speak;
speak=function(text,onend){ return speakRawFn(sayable(text),onend); };
</script>

<script>
/* ================= ZİYARET SAYACI · PRİM · XI MASKOTU ================= */
/* ---------- 1) Ziyaret hedef süresi ve geri sayım ---------- */
const TARGET_MIN={'Otel':15,'Kafe / Restoran':12,'Market':10,'Tekel / Premium':8,'Kurum / Ofis':7};
const targetMin=c=>TARGET_MIN[c.channel]||10;
function visitRemain(){ if(!S.visit) return null; const c=C(S.visit.cust); return targetMin(c)*60-(Date.now()-new Date(S.visit.start))/1000; }
function fmtMS(sec){ const neg=sec<0; sec=Math.abs(Math.round(sec)); const m=Math.floor(sec/60), s=sec%60; return (neg?'+':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0'); }
function cdState(rem,tot){ return rem<0?'over':rem<120?'warn':'ok'; }
function cdRing(size){ const r=visitRemain(); if(r==null) return ''; const tot=targetMin(C(S.visit.cust))*60, p=Math.max(0,Math.min(1,r/tot));
  return `<svg class="cdring" width="${size}" height="${size}" viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" fill="none" stroke="#E6E8EC" stroke-width="4"/><circle class="cdarc" cx="18" cy="18" r="15" fill="none" stroke-width="4" stroke-linecap="round" stroke-dasharray="${(p*94.2).toFixed(1)} 94.2" transform="rotate(-90 18 18)"/></svg>`; }
function cdHTML(c){ const v=S.visit&&S.visit.cust===c.id, tm=targetMin(c);
  if(!v) return `<span class="nstatus">⏱ Hedef süre ${tm} dk</span>`;
  const r=visitRemain(); return `<div class="cdbox ${cdState(r)}" data-a="xiAsk" data-k="süre">${cdRing(40)}<div><b class="nv-cd">${fmtMS(r)}</b><small>${r<0?'hedef aşıldı':'kalan'} · hedef ${tm} dk</small></div></div>`; }
setInterval(()=>{ const r=visitRemain(); if(r==null) return; const tot=targetMin(C(S.visit.cust))*60, p=Math.max(0,Math.min(1,r/tot)), st=cdState(r);
  document.querySelectorAll('.nv-cd').forEach(e=>e.textContent=fmtMS(r));
  document.querySelectorAll('.cdarc').forEach(e=>e.setAttribute('stroke-dasharray',(p*94.2).toFixed(1)+' 94.2'));
  document.querySelectorAll('.cdbox,.cdchip,.ocd').forEach(e=>{ e.classList.remove('ok','warn','over'); e.classList.add(st); });
  document.querySelectorAll('.cdbox small').forEach(e=>e.textContent=(r<0?'hedef aşıldı':'kalan')+' · hedef '+targetMin(C(S.visit.cust))+' dk');
  if(isNew() && r<120 && r>118 && !U.xiTipTimer){ xiTipShow('Ziyaret süresi dolmak üzere: 2 dakika kaldı.','cd'+S.visit.cust); }
},1000);
// eski tasarım: görev listesinin üstünde
const oldVisitPrev=SCREENS.visit;
SCREENS.visit=st=>{ const r=oldVisitPrev(st); const c=selC(); if(c){ const v=S.visit&&S.visit.cust===c.id; r.body=r.body.replace('<div class="visithead">',`<div class="ocd ${v?cdState(visitRemain()):'ok'}">⏱ Hedef süre ${targetMin(c)} dk${v?` · kalan <b class="nv-cd">${fmtMS(visitRemain())}</b>`:''}</div><div class="visithead">`); } return r; };
// yeni tasarım: ziyaret kartında halka sayaç
const nvPrev=NS.visit;
NS.visit=()=>{ const r=nvPrev(); const c=selC(); if(c) r.body=r.body.replace(/<span class="nstatus[^"]*">(?:<i><\/i><span class="nv-timer">[^<]*<\/span>|Ziyaret başlamadı)<\/span>/,cdHTML(c)); return r; };
// ziyaret bitince süreyi kaydet
const endVisitPrev=endVisit;
endVisit=function(){ const was=S.visit?{...S.visit}:null; const el=was?(Date.now()-new Date(was.start))/1000:0; endVisitPrev();
  if(was && !S.visit){ const c=C(was.cust), tm=targetMin(c); c.durSec=Math.round(el); c.dur=fmtMS(el).replace(':',' dk ')+' sn';
    const steps=Object.keys(S.visitsDone[c.id]||{}).length, ok=el<=tm*60;
    if(ok && steps>=3) incAdd(c.id,'perfect',1,`Mükemmel ziyaret: ${steps} adım, ${fmtMS(el)} (hedef ${tm} dk)`);
    U.xiLast=`${c.name} ziyareti ${fmtMS(el)} sürdü (hedef ${tm} dk${ok?'':', '+fmtMS(el-tm*60)+' aşım'}).`;
    save(); } };

/* ---------- 2) Prim (incentive) ---------- */
const RATE={dist:25,must:40,camp:3,coll:.01,perfect:15,newc:150};
const TIERS=[{p:80,amt:2000},{p:100,amt:4000},{p:110,amt:5500}];
if(!S.incBase) S.incBase={dist:34,must:6,camp:210,collOver:18400,perfect:41,newc:3,srSale:118,srVisit:174};
if(!S.incLog) S.incLog=[];
function incAdd(cust,kind,qty,text){ const amt=kind==='coll'?Math.round(qty*RATE.coll):qty*RATE[kind]*(gateOk()||!['dist','camp'].includes(kind)?1:.5);
  S.incLog.unshift({t:now(),cust,kind,qty,amt:Math.round(amt),text}); save(); return Math.round(amt); }
function srMonth(){ const sale=S.customers.filter(c=>c.status==='visited_sale').length, nos=S.customers.filter(c=>c.status==='visited_nosale').length;
  return Math.round((S.incBase.srSale+sale)/(S.incBase.srVisit+sale+nos)*100); }
const gateOk=()=>srMonth()>=60;
function incSum(){ const B=S.incBase, L=S.incLog, q=k=>L.filter(x=>x.kind===k).reduce((s,x)=>s+x.qty,0), a=k=>L.filter(x=>x.kind===k).reduce((s,x)=>s+x.amt,0);
  const pct=S.monthActual/S.monthTarget*100; const tier=[...TIERS].reverse().find(t=>pct>=t.p); const next=TIERS.find(t=>pct<t.p);
  const comp=[
   {k:'tier',n:'Ciro kademe primi',d:tier?`%${tier.p} kademesi`:`%80 kademesine ulaşınca başlar`,amt:tier?tier.amt:0},
   {k:'dist',n:'Dağılım: noktada ilk kez satılan ürün',d:`${B.dist+q('dist')} ürün × ${RATE.dist} ₺`,amt:B.dist*RATE.dist+a('dist')},
   {k:'camp',n:'Kampanya: 5+1 ve Fusetea 3+1',d:`${B.camp+q('camp')} koli × ${RATE.camp} ₺`,amt:B.camp*RATE.camp+a('camp')},
   {k:'must',n:'Must SKU tamamlama',d:`${B.must+q('must')} nokta × ${RATE.must} ₺`,amt:B.must*RATE.must+a('must')},
   {k:'coll',n:'Vadesi geçen tahsilat',d:`%1 · ${fmt0(B.collOver+q('coll'))} ₺ tahsil edildi`,amt:Math.round(B.collOver*RATE.coll)+a('coll')},
   {k:'perfect',n:'Mükemmel ziyaret',d:`${B.perfect+q('perfect')} ziyaret × ${RATE.perfect} ₺ (adımlar + hedef süre)`,amt:B.perfect*RATE.perfect+a('perfect')},
   {k:'newc',n:'Yeni müşteri açılışı',d:`${B.newc} açılış × ${RATE.newc} ₺`,amt:B.newc*RATE.newc}];
  const total=comp.reduce((s,x)=>s+x.amt,0), today=L.reduce((s,x)=>s+x.amt,0);
  return {comp,total,today,pct,tier,next,toNext:next?Math.max(0,S.monthTarget*next.p/100-S.monthActual):0}; }
const fmt0=n=>Math.round(n).toLocaleString('tr-TR');
function primFor(c,items){ const sold=new Set(c.hist.flatMap(h=>Object.keys(h.items))); let dist=0,camp=0,distN=0,campQ=0;
  Object.entries(items).forEach(([pid,q])=>{ if(q>0&&!sold.has(pid)){ distN++; } if(q>0&&P(pid).gift) campQ+=q; });
  const half=gateOk()?1:.5; dist=distN*RATE.dist*half; camp=campQ*RATE.camp*half;
  const must=(c.must||[]).length&&!(c.must||[]).every(m=>sold.has(m))&&(c.must||[]).every(m=>sold.has(m)||items[m]>0)?RATE.must:0;
  return {dist,camp,must,distN,campQ,total:Math.round(dist+camp+must)}; }
const cartItems=()=>Object.fromEntries(Object.entries(U.cart).map(([k,v])=>[k,v.qty||0]));
// siparişte prim kaydı
const saveSlipPrim=A.saveSlip;
A.saveSlip=function(){ const c=selC(); if(!c||!U.inv) return saveSlipPrim(); const items=cartItems(), type=U.inv.type, est=primFor(c,items), n=S.slips.length; saveSlipPrim();
  if(S.slips.length>n && type!=='İade'){ let tot=0;
    if(est.distN) tot+=incAdd(c.id,'dist',est.distN,`${c.name}: ${est.distN} ürün ilk kez satıldı`);
    if(est.campQ) tot+=incAdd(c.id,'camp',est.campQ,`${c.name}: ${est.campQ} koli kampanya ürünü`);
    if(est.must) tot+=incAdd(c.id,'must',1,`${c.name}: tüm Must SKU'lar tamamlandı`);
    if(tot){ U.toast=(U.toast||'Sipariş kaydedildi')+` · +${fmt0(tot)} ₺ prim`; render(); } } };
const paySavePrim=A.paySave;
A.paySave=function(){ const c=selC(), over=c?c.overdue:0, n=S.payments.length; paySavePrim();
  if(S.payments.length>n && over>0){ const paid=Math.min(over,S.payments[0].amount); const a=incAdd(c.id,'coll',paid,`${c.name}: vadesi geçen ${fmt0(paid)} ₺ tahsil edildi`); if(a){ U.toast=(U.toast||'')+` · +${a} ₺ prim`; render(); } } };
// ürün satırlarında prim rozetleri + sepet çubuğunda tahmini prim
const nieditPrev=NS.invedit;
NS.invedit=()=>{ const r=nieditPrev(); const c=selC(); if(!c) return r; const sold=new Set(c.hist.flatMap(h=>Object.keys(h.items)));
  PRODUCTS.forEach(p=>{ const badges=(!sold.has(p.id)?`<span class="nchip prim">+${RATE.dist} ₺ ilk satış</span>`:'')+(p.gift?`<span class="nchip prim">+${RATE.camp} ₺/koli</span>`:'');
    if(badges) r.body=r.body.replace(`data-k="${p.id}"><b class="ell2">${esc(p.name)}</b><div class="row" style="gap:6px;margin-top:4px;flex-wrap:wrap">`, m=>m+badges); });
  const est=primFor(c,cartItems());
  if(est.total>0 && r.cta) r.cta=r.cta.replace(/<span class="nsub">(\d+) kalem · KDV dahil<\/span>/,(m,n)=>`<span class="nsub">${n} kalem · <b style="color:#17703F">+${fmt0(est.total)} ₺ prim</b></span>`);
  return r; };
// prim kartı (Bugün ve Raporlar)
function primCard(){ const I2=incSum(); const nx=I2.next; const pr=nx?Math.min(100,I2.pct/nx.p*100):100;
  return `<div class="ncard primcard" data-a="go" data-s="incentive"><div class="row"><span class="nspark" style="background:#E3F4EA;color:#17703F">${ic('coin')}</span><div class="sp"><div class="nlabel">Kasım primin</div><div class="nbig">${fmt0(I2.total)} ₺</div></div>${I2.today?`<span class="nchip ok">Bugün +${fmt0(I2.today)} ₺</span>`:''}${ic('chev')}</div>
   ${nx?`<div class="nsub" style="margin-top:10px">%${nx.p} ciro kademesine <b>${fmt0(I2.toNext)} ₺</b> kaldı · ulaşırsan <b style="color:#17703F">+${fmt0(nx.amt-(I2.tier?I2.tier.amt:0))} ₺</b></div><div class="nbar" style="margin-top:6px"><i style="width:${pr}%;background:#17703F"></i></div>`:''}</div>`; }
const nhomePrev=NS.home;
NS.home=()=>{ const r=nhomePrev(); const i=r.body.indexOf('<div class="nsec">'); if(i>0) r.body=r.body.slice(0,i)+primCard()+r.body.slice(i); return r; };
const nrepPrev=NS.reports;
NS.reports=()=>{ const r=nrepPrev(); r.body=primCard()+r.body; return r; };
// prim ekranı
function whiteSpace(){ return S.customers.filter(c=>c.days.includes('Cu')&&c.status==='planned').map(c=>{ const sold=new Set(c.hist.flatMap(h=>Object.keys(h.items))); const miss=(c.must||[]).filter(m=>!sold.has(m)); const ws=PRODUCTS.filter(p=>!sold.has(p.id)).slice(0,3);
  return {c,miss,ws,amt:ws.length*RATE.dist+(miss.length?RATE.must:0)}; }).filter(x=>x.ws.length).sort((a,b)=>b.amt-a.amt).slice(0,4); }
function questProgress(){ const L=S.incLog, q=k=>L.filter(x=>x.kind===k).reduce((s,x)=>s+x.qty,0);
  const ontime=S.customers.filter(c=>c.durSec!=null), ok=ontime.filter(c=>c.durSec<=targetMin(c)*60).length;
  return [
   {n:'2 noktaya ilk kez ürün yerleştir',v:Math.min(2,q('dist')),of:2,amt:50},
   {n:'5+1 kampanyalı ürünlerden 20 koli sat',v:Math.min(20,q('camp')),of:20,amt:60},
   {n:'Tüm ziyaretleri hedef sürede bitir',v:ok,of:Math.max(ok,planned().length),amt:40},
   {n:'Vadesi geçen 1 tahsilat al',v:Math.min(1,L.filter(x=>x.kind==='coll').length),of:1,amt:20}]; }

   ${I2.next?`<div class="nsub" style="margin-top:8px">%${I2.next.p}'e ${fmt0(I2.toNext)} ₺ kaldı · günde ortalama ${fmt0(I2.toNext/7)} ₺ satış gerekir</div>`:'<div class="nsub" style="margin-top:8px">En üst kademedesin</div>'}</div>

  <div class="nsec">Prim fırsatları (bugünkü rota)</div><div class="ncard np0">${ws.map(x=>`<div class="nrow" data-a="nOpenCust" data-k="${x.c.id}"><div class="navatar">${initials(x.c.name)}</div><div class="sp" style="min-width:0"><b class="ell">${esc(x.c.name)}</b><div class="nsub ell">Bu noktada hiç satılmadı: ${x.ws.map(p=>esc(p.name.split(' X ')[0])).join(', ')}</div></div><span class="nchip ok">+${x.amt} ₺</span></div>`).join('')||'<div class="empty">Bugünkü rotada fırsat kalmadı</div>'}</div>

  bottom:`<button data-a="back">Geri</button>`}; };

function xiCtxChips(){ const st=cur().s, c=selC();
  if(st==='invedit') return ['Bu müşteride ne satayım?','Kampanyalar neler?','Bu sepet kaç prim?'];
  if(st==='visit') return ['Bu müşteride ne satayım?','Ziyaret süresi','Limit durumu','Vadesi geçen borçlar'];
  if(st==='incentive') return ['Primimi nasıl artırırım?','Hedefe ne kadar kaldı?'];
  return ['Sıradaki müşteri?','Primim ne kadar?','Hedefe ne kadar kaldı?','Vadesi geçen borçlar']; }
function xiAnswer(q0){ const q=q0.toLocaleLowerCase('tr'); const c=selC(); const I2=incSum(); const has=(...w)=>w.some(x=>q.includes(x));
  if(has('merhaba','selam','günaydın')) return {t:`Merhaba ${S.user}! Ben Polar Bear. Rota, prim, kampanya, tahsilat ya da uygulamanın nasıl kullanıldığı hakkında sorabilirsin.`};
  if(has('teşekkür','sağol','sağ ol')) return {t:'Rica ederim. Bir şey olursa buradayım.'};
  if(has('sıradaki','kime','rota','nereye')){ const n=planned().find(x=>x.status==='planned'); if(!n) return {t:'Bugünkü planlı tüm noktaları ziyaret ettin. Günü kapatabilirsin.',a:[['Günü kapat',()=>go('dayend')]]};
    const f=custSentences(n); return {t:`Sıradaki müşteri ${n.name}, ${km(n.id)} km uzakta. ${f.length?'Dikkat: '+f.slice(0,2).join(', ')+'.':'Dikkat edilecek bir konu yok.'} Hedef ziyaret süresi ${targetMin(n)} dakika.`,a:[['Ziyareti aç',()=>{S.sel=n.id;save();U.stack=[{s:'home'},{s:'visit'}];render();}]]}; }
  if(has('prim','incentive','kazanc','kazanç','artır')){ const ws=whiteSpace()[0];
    return {t:`Bu ay ${fmt0(I2.total)} ₺ prim kazandın, bugün +${fmt0(I2.today)} ₺. ${I2.next?`%${I2.next.p} ciro kademesine ${fmt0(I2.toNext)} ₺ kaldı.`:''} ${ws?`En hızlı fırsat: ${ws.c.name}'da hiç satılmayan ${ws.ws.length} ürün, yaklaşık +${ws.amt} ₺.`:''} Kampanyalı Coca-Cola 1 L, Fanta 1 L ve Fusetea'da koli başına ${RATE.camp} ₺ ek prim var; Fusetea'nın noktadaki ilk satışı ayrıca +${RATE.launch} ₺.`,a:[['Primimi aç',()=>go('incentive')]]}; }
  if(has('sepet')&&c&&U.inv){ const e=primFor(c,cartItems()); return {t:`Bu sepet şu an +${fmt0(e.total)} ₺ prim kazandırır: dağılım ${fmt0(e.dist)} ₺, kampanya ${fmt0(e.camp)} ₺${e.must?`, Must SKU ${e.must} ₺`:''}.`}; }
  if(has('ne sat','öner','fırsat','bu müşteri')){ if(!c) return {t:'Önce bir müşteri seç; o noktaya özel öneri vereyim.',a:[['Müşteriler',()=>{U.stack=[{s:'custlist'}];render();}]]};
    const sold=new Set(c.hist.flatMap(h=>Object.keys(h.items))); const ws=PRODUCTS.filter(p=>!sold.has(p.id)).slice(0,3); const sg=suggestions(c).slice(0,2);
    return {t:`${c.name} için: ${sg.length?'tekrar sipariş zamanı gelenler '+sg.map(s=>P(s.pid).name.split(' X ')[0]+' ('+s.qty+')').join(', ')+'. ':''}${ws.length?'Bu noktada hiç satılmayan '+ws.map(p=>p.name.split(' X ')[0]).join(', ')+'; her biri ilk satışta +'+RATE.dist+' ₺ prim. ':''}Coca-Cola 1 L ve Fanta 1 L 5+1 kampanyası 30 Kasım'a kadar sürüyor; Fusetea'da 3+1 lansman var.`,a:[['Siparişe başla',()=>A.nOrder()]]}; }
  if(has('kampanya','promosyon','iskonto')) return {t:`Aktif kampanyalar: Coca-Cola 1 L ve Fanta 1 L 5+1 (30 Kasım'a kadar, koli başına +${RATE.camp} ₺ prim); Fusetea Şeftali lansmanı 3+1; 10 koli ve üzeri karışık kutuda %5; 10.000 ₺ üzeri siparişte %3 sepet iskontosu; depozitolu cam alımında koli başına 10 ₺ indirim; Fanta 5+1 kasa önü standı ve Monster duvar ünitesi.`};
  if(has('borç','vade','tahsilat')){ const l=S.customers.filter(x=>x.overdue>0).sort((a,b)=>b.overdue-a.overdue); return {t:l.length?`Vadesi geçen toplam ${fmt0(l.reduce((s,x)=>s+x.overdue,0))} ₺: ${l.slice(0,3).map(x=>x.name+' '+fmt0(x.overdue)+' ₺').join(', ')}. Vadesi geçen tahsilatın %1'i prim olarak yansır.`:'Vadesi geçen borç yok.'}; }
  if(has('limit')){ if(!c) return {t:'Önce bir müşteri seç.'}; return {t:`${c.name}: kredi limiti ${fmt0(c.limit)} ₺, açık bakiye ${fmt0(Math.max(0,-c.balance))} ₺, kalan limit ${fmt0(availLimit(c))} ₺.${c.overdue?' Vadesi geçen '+fmt0(c.overdue)+' ₺ var; önce tahsilat limiti açar.':''}`}; }
  if(has('hedef','kalan','kademe')) return {t:`Ay hedefin ${fmt0(S.monthTarget)} ₺, gerçekleşen ${fmt0(S.monthActual)} ₺ (%${Math.round(I2.pct)}). ${I2.next?`%${I2.next.p} kademesi için ${fmt0(I2.toNext)} ₺ kaldı; kalan 7 iş gününde günde ortalama ${fmt0(I2.toNext/7)} ₺ satış gerekir.`:''}`};
  if(has('süre','zaman','sayaç','dakika')){ if(S.visit){ const r=visitRemain(), cc=C(S.visit.cust); return {t:`${cc.name} için hedef süre ${targetMin(cc)} dakika. ${r>=0?'Kalan süre '+fmtMS(r)+'.':'Hedef '+fmtMS(r).slice(1)+' aşıldı.'} Hedef sürede biten ve en az 3 adımı tamamlanan ziyaret "mükemmel ziyaret" sayılır, +${RATE.perfect} ₺.`}; }
    return {t:`Her noktanın kanalına göre hedef ziyaret süresi var: otel 15, kafe/restoran 12, market 10, tekel/premium 8, kurum/ofis 7 dakika. ${U.xiLast||''}`}; }
  if(has('boş kasa','kasa')) return {t:'Ziyaret adımlarından "Boş kasa"yı aç; tür bazında sağlam, kırık ve başka marka adedini gir. Sağlam boşların depozitosu müşteri bakiyesinden düşer, makbuz yazdırılır.',a:[['Boş kasa',()=>A.vtask({s:'emptycrate',k:'EmptyCrate'})]]};
  if(has('günü kapat','gün sonu','check-out')) return {t:'Bugün ekranının altındaki "Günü kapat" ile ziyaret edilmeyen noktaların nedenini, kasa ve boş kasa mutabakatını girip check-out yaparsın.',a:[['Günü kapat',()=>go('dayend')]]};
  return {t:'Bunu henüz bilmiyorum; bu demoda rota, prim, kampanya, tahsilat, limit, ziyaret süresi ve temel kullanım sorularını yanıtlayabiliyorum.'}; }
function xiPush(from,text,acts){ U.xiActs=U.xiActs||[]; const ids=(acts||[]).map(a=>{ U.xiActs.push(a[1]); return [a[0],U.xiActs.length-1]; }); U.xiMsgs.push({from,text,acts:ids}); }

OV.expform=()=>`<div class="ov" data-a="ovbg"><div class="dlg" data-stop><button class="x" data-a="closeOv">${ic('x')}</button><h2 style="font-size:18px;text-align:left">Yeni masraf</h2><hr>

function exKeep(){ const g=id=>(document.getElementById(id)||{}).value; U.exDraft={type:g('exType'),amt:g('exAmt'),desc:g('exDesc')}; }
function exShrink(src,cb){ const im=new Image(); im.onload=()=>{ const k=Math.min(1,420/Math.max(im.width,im.height)); const c=document.createElement('canvas'); c.width=Math.round(im.width*k); c.height=Math.round(im.height*k); c.getContext('2d').drawImage(im,0,0,c.width,c.height); cb(c.toDataURL('image/jpeg',.7)); }; im.src=src; }
function exSampleImg(type,amt){ const c=document.createElement('canvas'); c.width=300; c.height=420; const g=c.getContext('2d');
  g.fillStyle='#fff'; g.fillRect(0,0,300,420); g.fillStyle='#222'; g.textAlign='center'; g.font='bold 18px monospace'; g.fillText(type==='Yakıt'?'AKARYAKIT İSTASYONU':'İŞLETME ADI',150,40);
  g.font='13px monospace'; g.fillText('Çağlayan Mah. Antalya',150,62); g.fillText('VD: Muratpaşa  VKN: 0000000000',150,80); g.fillText('20.11.2026  12:42',150,104);
  g.textAlign='left'; g.fillText('------------------------------',20,128); g.fillText(type.toUpperCase(),20,152); g.textAlign='right'; g.fillText((+amt||0).toFixed(2).replace('.',','),280,152);
  g.textAlign='left'; g.fillText('KDV %20',20,176); g.textAlign='right'; g.fillText(((+amt||0)/6).toFixed(2).replace('.',','),280,176);
  g.textAlign='left'; g.fillText('------------------------------',20,200); g.font='bold 16px monospace'; g.fillText('TOPLAM',20,228); g.textAlign='right'; g.fillText((+amt||0).toFixed(2).replace('.',',')+' TL',280,228);
  g.textAlign='center'; g.font='12px monospace'; g.fillText('ÖRNEK FİŞ · DEMO',150,300); g.fillText('MALİ DEĞERİ YOKTUR',150,318); return c.toDataURL('image/jpeg',.7); }
Object.assign(A,{
  exNew:()=>{ U.exImg=null; U.exDraft=null; ov('expform'); },

});
