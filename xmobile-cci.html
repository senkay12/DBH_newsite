/* ---------- 3) MÜŞTERİ İMZASI (tahsilat) ---------- */
const payForm8=payForm;
payForm=function(){ const h=payForm8(); if(!isNew()) return h;
  const sig=`<div class="sigwrap"><label>${ic('sign')} Müşteri imzası</label><canvas id="sigPad" class="sigpad"></canvas><div class="sigrow"><span id="sigHint">Parmağınızla imzalatın</span><button class="nbtn tonal sm" data-a="sigClear">Temizle</button></div></div>`;
  return h.replace('<button class="btn red" style="width:100%;margin-top:14px" data-a="paySave">',sig+'<button class="btn red" style="width:100%;margin-top:14px" data-a="paySave">'); };
function bindSig(){ const cv=document.getElementById('sigPad'); if(!cv||cv.dataset.b) return; cv.dataset.b='1';
  const r=cv.getBoundingClientRect(), dpr=window.devicePixelRatio||1; cv.width=r.width*dpr; cv.height=r.height*dpr; const g=cv.getContext('2d'); g.scale(dpr,dpr); g.lineWidth=2.4; g.lineCap='round'; g.lineJoin='round'; g.strokeStyle='#15191E';
  if(U.sigData){ const im=new Image(); im.onload=()=>g.drawImage(im,0,0,r.width,r.height); im.src=U.sigData; const h=document.getElementById('sigHint'); if(h) h.textContent='İmza alındı ✓'; }
  let on=false; const P=e=>{ const b=cv.getBoundingClientRect(); return [e.clientX-b.left,e.clientY-b.top]; };
  cv.addEventListener('pointerdown',e=>{ on=true; cv.setPointerCapture(e.pointerId); const [x,y]=P(e); g.beginPath(); g.moveTo(x,y); e.preventDefault(); });
  cv.addEventListener('pointermove',e=>{ if(!on) return; const [x,y]=P(e); g.lineTo(x,y); g.stroke(); });
  const end=()=>{ if(!on) return; on=false; U.sigData=cv.toDataURL('image/png'); const h=document.getElementById('sigHint'); if(h) h.textContent='İmza alındı ✓'; };
  cv.addEventListener('pointerup',end); cv.addEventListener('pointercancel',end); }
A.sigClear=()=>{ U.sigData=null; const cv=document.getElementById('sigPad'); if(cv){ cv.dataset.b=''; cv.getContext('2d').clearRect(0,0,cv.width,cv.height); const h=document.getElementById('sigHint'); if(h) h.textContent='Parmağınızla imzalatın'; bindSig(); } };
const paySave8=A.paySave;
A.paySave=function(){ const sig=U.sigData||null; const n=S.payments.length; paySave8(); if(S.payments.length>n){ S.payments[0].sig=sig; save(); U.sigData=null; render(); } };

SCREENS.paylist=function(){ const r=paylist8(); if(!isNew()||!r||!r.body||!selC()) return r;
  const c=selC(), tab=U.tab.pl||'Tahsilat', map={Tahsilat:['Nakit','Kredi Kartı','Havale'],Çek:['Çek'],Senet:['Senet']};
  const list=S.payments.filter(p=>p.cust===c.id && map[tab].includes(p.type));
  if(list.length) r.body=`<div class="list">${list.map(p=>`<div class="it"><div class="sp"><div class="h3">${p.type} · ${tl(p.amount)}</div><div class="small muted">${dstr(new Date(p.date))} · Makbuz ${p.no}${p.bank?' · '+esc(p.bank):''}${p.due?' · Vade '+p.due:''}</div><div style="margin-top:6px;display:flex;align-items:center">${p.sig?`<span class="nchip ok">İmzalı ✓</span><img class="sigth" src="${p.sig}" alt="Müşteri imzası">`:'<span class="nchip">İmzasız</span>'}</div></div>${ic('print')}</div>`).join('')}</div>`;
  return r; };

/* render sonrası imza alanını bağla */
const render8=render;
render=function(){
  const keep={}; document.querySelectorAll('.ov input[id], .ov select[id], .ov textarea[id]').forEach(e=>{ if(e.type!=='file') keep[e.id]=e.value; });

  if(U.overlay&&U.overlay.name==='payform') bindSig(); };

<style>

<script>
/* ================= COCA-COLA: KAMPANYALAR VE PRİM KALEMLERİ (örnek plan) ================= */
Object.assign(RATE,{cooler:20,red:30,rgb:2,launch:35});
['cooler','red','rgb','launch'].forEach((k,i)=>{ if(S.incBase[k]==null) S.incBase[k]=[22,15,140,9][i]; });
const isCan=p=>/ KUTU /.test(p.name+' ');

/* sepet: 5+1 / 3+1 bedelsiz, karışık kutu %5, %3 sepet iskontosu */
invTotals=function(){
  const items=Object.entries(U.cart).filter(([,q])=>q.qty>0);
  let gross=0,disc=0,cost=0,ep=0,gifts=0,canQ=0,canLine=0,rgbQ=0;
  items.forEach(([pid,q])=>{ const p=P(pid), price=q.price??p.price, line=price*q.qty; gross+=line; cost+=p.cost*q.qty; ep+=p.ep*q.qty;
    const d=(q.disc||0)/100*line; disc+=d; const n=p.giftN||5; if(p.gift&&q.qty>=n) gifts+=Math.floor(q.qty/n);
    if(isCan(p)){ canQ+=q.qty; canLine+=line-d; } if(p.rgb) rgbQ+=q.qty; });
  const canDisc=canQ>=10?canLine*0.05:0, rgbDisc=rgbQ*10;
  const basketDisc=gross>10000?(gross-disc-canDisc-rgbDisc)*0.03:0;
  const ruleDisc=canDisc+rgbDisc+basketDisc, sub=gross-disc-ruleDisc, vat=sub*0.20;
  return {items,gross,disc,ruleDisc,canDisc,rgbDisc,basketDisc,canQ,rgbQ,sub,vat,total:sub+vat,cost,ep,gifts,lines:items.length}; };

promoBar=function(){ const T=invTotals(), TH=10000, L=[];
  if(T.gross>=TH) L.push({ok:1,t:`%3 sepet iskontosu kazanıldı · −${tl(T.basketDisc)}`,p:100});
  else L.push({ok:0,t:`%3 sepet iskontosu için ${tl(TH-T.gross)} kaldı`,p:Math.round(T.gross/TH*100)});
  PRODUCTS.filter(p=>p.gift).forEach(p=>{ const q=U.cart[p.id]?.qty||0, n=p.giftN||5, nm=p.name.split(' X ')[0];
    if(q>0&&q%n) L.push({ok:0,t:`${nm}: ${n-q%n} koli daha ekle, 1 koli bedelsiz (${n}+1)`,p:Math.round(q%n/n*100)});
    else if(q>=n) L.push({ok:1,t:`${nm}: ${Math.floor(q/n)} koli bedelsiz kazanıldı`,p:100}); });
  if(T.canQ>0) L.push(T.canQ>=10?{ok:1,t:`Karışık kutu %5 kazanıldı · −${tl(T.canDisc)}`,p:100}:{ok:0,t:`Karışık kutu %5 için ${10-T.canQ} koli daha`,p:T.canQ*10});
  if(T.rgbQ>0) L.push({ok:1,t:`Depozitolu cam: koli başına 10 ₺ · −${tl(T.rgbDisc)}`,p:100});
  return `<div class="promobar">${L.length<=3?`<div class="pbinfo" data-a="tab" data-g="ie" data-k="Kampanya" style="cursor:pointer;margin:0 0 6px"><u>Tüm kampanyalar (6)</u></div>`:''}${L.slice(0,3).map(l=>`<div class="pb ${l.ok?'ok':''}"><div class="row" style="gap:8px">${ic(l.ok?'check':'tag')}<span class="sp">${l.t}</span></div><div class="nbar"><i style="width:${l.p}%"></i></div></div>`).join('')}${L.length>3?`<div class="pbinfo" data-a="tab" data-g="ie" data-k="Kampanya" style="cursor:pointer">+${L.length-3} kampanya daha · <u>Kampanyaları gör</u></div>`:''}</div>`; };

/* prim: lansman ve cam şişe kalemleri */
const primFor9=primFor;
primFor=function(c,items){ const r=primFor9(c,items), sold=new Set(c.hist.flatMap(h=>Object.keys(h.items)));
  const lp=PRODUCTS.find(p=>p.launch), launchN=lp&&items[lp.id]>0&&!sold.has(lp.id)?1:0;
  const rgbQ=PRODUCTS.filter(p=>p.rgb).reduce((s,p)=>s+(items[p.id]||0),0);
  const launch=launchN*RATE.launch, rgb=rgbQ*RATE.rgb;
  return {...r,launchN,launch,rgbQ,rgb,total:Math.round(r.total+launch+rgb)}; };
const saveSlip9=A.saveSlip;
A.saveSlip=function(){ const c=selC(); if(!c||!U.inv) return saveSlip9(); const est=primFor(c,cartItems()), type=U.inv.type, n=S.slips.length; saveSlip9();

    if(est.launchN) t+=incAdd(c.id,'launch',1,`${c.name}: Fusetea ilk kez satıldı (lansman)`);
    if(est.rgbQ) t+=incAdd(c.id,'rgb',est.rgbQ,`${c.name}: ${est.rgbQ} koli depozitolu cam`);
    if(t){ save(); render(); } } };

/* prim özeti: yeni bileşenler */
const incSum9=incSum;
incSum=function(){ const r=incSum9(), B=S.incBase, L=S.incLog, q=k=>L.filter(x=>x.kind===k).reduce((s,x)=>s+x.qty,0), a=k=>L.filter(x=>x.kind===k).reduce((s,x)=>s+x.amt,0);
  const add=[
   {k:'cooler',n:'Soğutucu saflığı',d:`${B.cooler+q('cooler')} soğutucu × ${RATE.cooler} ₺ (yalnız Coca-Cola ürünleri, fotoğrafla)`,amt:(B.cooler+q('cooler'))*RATE.cooler},
   {k:'red',n:'RED skoru 85 ve üzeri',d:`${B.red+q('red')} nokta × ${RATE.red} ₺ (bulunurluk, soğutucu, fiyat, teşhir)`,amt:(B.red+q('red'))*RATE.red},
   {k:'launch',n:'Lansman: Fusetea ilk satış',d:`${B.launch+q('launch')} nokta × ${RATE.launch} ₺`,amt:B.launch*RATE.launch+a('launch')},
   {k:'rgb',n:'Depozitolu cam şişe',d:`${B.rgb+q('rgb')} koli × ${RATE.rgb} ₺`,amt:B.rgb*RATE.rgb+a('rgb')}];
  const comp=r.comp.slice(0,4).concat(add,r.comp.slice(4)); const total=comp.reduce((s,x)=>s+x.amt,0);

/* günlük görevler: Coca-Cola görevleri */

   {n:'3 soğutucuda saflık fotoğrafı çek',v:Math.min(3,S.coolerShots||0),of:3,amt:30}]); };

/* anket fotoğrafı = soğutucu saflık fotoğrafı */
const survPhoto9=A.survPhoto; A.survPhoto=function(){ S.coolerShots=(S.coolerShots||0)+1; save(); return survPhoto9(); };
/* asistan: soğutucu, RED, cam, lansman soruları */
const xiAnswer9=xiAnswer;
xiAnswer=function(q0){ const q=q0.toLocaleLowerCase('tr'), has=(...w)=>w.some(x=>q.includes(x));
  if(has('soğutucu','saflık')) return {t:`Soğutucu saflığı: dolapta yalnız Coca-Cola ürünleri varsa ve fotoğrafla doğrulanırsa soğutucu başına +${RATE.cooler} ₺. Bu ay ${S.incBase.cooler+(S.coolerShots||0)} soğutucu saf. 9 °C üstündeki soğutucuyu arıza olarak bildir.`};
  if(has('red','skor')) return {t:`RED skoru bulunurluk, soğutucu, fiyat etiketi ve teşhirden oluşur. 85 ve üzeri her nokta +${RATE.red} ₺ prim getirir.`};

const xiCtx9=xiCtxChips;
xiCtxChips=function(){ const st=cur().s; if(st==='incentive') return ['Primimi nasıl artırırım?','Soğutucu saflığı nedir?','RED skoru nedir?','Lansman primi']; if(st==='invedit') return ['Hangi kampanyalar var?','Bu sepet kaç prim?','Depozitolu cam']; return xiCtx9(); };

/* ===== sipariş: Kampanyalar sekmesi ===== */
function campList(){ const T=invTotals(), qy=id=>U.cart[id]?.qty||0, bar=(p,ok)=>`<div class="nbar"><i style="width:${Math.min(100,p)}%"></i></div>`;

   {t:'Fanta Portakal 1 L · 5+1',d:"5 koliye 1 koli bedelsiz · 30 Kasım'a kadar · koli başına +"+RATE.camp+' ₺ prim',pid:'P2',n:5},
   {t:'Fusetea Şeftali lansmanı · 3+1',d:'3 koliye 1 koli bedelsiz · noktadaki ilk satışta +'+RATE.launch+' ₺ lansman primi',pid:'P8',n:3},
   {t:'Karışık kutu · %5',d:'Kutu ürünlerden toplam 10 koli ve üzeri (Coca-Cola, Zero, Fusetea, Schweppes, Monster)',mix:1},

    if(c.pid&&!c.rgb){ const q=qy(c.pid); ok=q>=c.n; p=ok?100:q/c.n*100; st=q===0?'Sepette yok':ok?`${Math.floor(q/c.n)} koli bedelsiz kazanıldı`+(q%c.n?` · ${c.n-q%c.n} koli daha ekle, bir tane daha`:''):`${c.n-q%c.n} koli daha ekle`; btn=`<button class="nbtn primary sm" data-a="nStep" data-k="${c.pid}" data-v="1">+1 koli</button>`; }

  return `<div style="padding:4px 16px 16px">${tot}${rows}<button class="nbtn tonal" style="width:100%" data-a="tab" data-g="ie" data-k="Kalemler">Ürünlere dön</button></div>`; }
const nsInv9=NS.invedit;
NS.invedit=function(){ const camp=U.tab.ie==='Kampanya'; if(camp) U.tab.ie='Kalemler'; const r=nsInv9(); if(camp) U.tab.ie='Kampanya';
  const chip=`<button class="nchipbtn ${camp?'act':''}" data-a="tab" data-g="ie" data-k="Kampanya">Kampanyalar</button>`;
  if(r.head){ if(camp) r.head=r.head.replace('nchipbtn act','nchipbtn '); r.head=r.head.replace(/(data-k="Kalemler">Ürünler<\/button>)/,'$1'+chip); }
  if(camp) r.body=campList(); return r; };

<script>
/* ================= YÖNLENDİRİLMİŞ GÖREVLER =================
   Faz 1 (kural tabanlı) Next Best Action: aday görevler -> skor = olasılık × etki × ağırlık -> grup başına en iyisi, en fazla 3.
   Kanıt: sipariş satırı / ödeme otomatik, fotoğraf ve teyit satıcıdan. Ret sebebi zorunlu. Sonuçlar yönetici paneline akar. */
S.missions=S.missions||{}; S.incBase.missionN=S.incBase.missionN??26; S.incBase.missionAmt=S.incBase.missionAmt??310;
RATE.mission=5;
const MG={s:'Satış',u:'Uygulama',i:'İletişim'};
const hsh=id=>[...id].reduce((a,ch)=>a*31+ch.charCodeAt(0),7)%997;
const pshort=id=>P(id).name.split(' X ')[0].replace(/\s+/g,' ').toLocaleLowerCase('tr').replace(/(^|[\s-])\S/g,x=>x.toLocaleUpperCase('tr'));
function digi(c){ // CCINEXT (B2B müşteri uygulaması) örnek verisi
  const h=hsh(c.id), cart=c.id==='C2'?{P4:3,P8:2}:(h%4===0?{P5:2,P9:1}:null);
  return {last:c.id==='C2'?3:2+h%9, cart, pts:c.id==='C2'?1240:400+h%900, tier:1500, cartAt:'dün 21:40'}; }
const cartVal=cart=>cart?Object.entries(cart).reduce((s,[k,q])=>s+P(k).price*q,0):0;
function soldSet(c){ return new Set(c.hist.flatMap(h=>Object.keys(h.items))); }
function lastDays(c){ if(!c.hist.length) return 99; const d=c.hist.reduce((a,b)=>new Date(a.date)>new Date(b.date)?a:b).date; return Math.max(0,Math.round((TODAY-new Date(d))/864e5)); }
function avgGap(c){ const ds=c.hist.map(h=>+new Date(h.date)).sort((a,b)=>a-b); if(ds.length<2) return 14; return Math.max(5,Math.round((ds[ds.length-1]-ds[0])/(ds.length-1)/864e5)); }
function mCandidates(c){
  const D=digi(c), sold=soldSet(c), out=[], same=S.customers.filter(x=>x.channel===c.channel&&x.id!==c.id);
  if(D.cart){ const v=cartVal(D.cart), n=Object.keys(D.cart).length;
    out.push({k:'cart',g:'s',t:'CCINEXT\'te yarım kalan sepeti tamamlat',why:`Müşteri ${D.cartAt} uygulamada ${n} kalem (${Object.entries(D.cart).map(([k,q])=>q+' koli '+pshort(k)).join(', ')}) sepete ekledi, siparişi tamamlamadı. Toplam ${tl(v)}.`,ev:{type:'order',items:D.cart},p:.72,imp:v,w:1.2,prim:15,
      pitch:`Dün akşam uygulamada ${Object.entries(D.cart).map(([k,q])=>q+' koli '+pshort(k)).join(' ve ')} seçmişsiniz ama sipariş tamamlanmamış. İsterseniz şimdi siparişe ekleyeyim; yarın sabah araçla gelir. Kampanya şartları da aynen geçerli.`}); }
  const cand=PRODUCTS.filter(p=>!sold.has(p.id)).map(p=>({p,share:same.length?same.filter(x=>soldSet(x).has(p.id)).length/same.length:0})).sort((a,b)=>(b.share+(b.p.launch?.3:0))-(a.share+(a.p.launch?.3:0)))[0];
  if(cand&&cand.share>=.25){ const pr=cand.p, pct=Math.round(cand.share*100);
    out.push({k:'dist',g:'s',t:`${pshort(pr.id)} öner: noktada hiç satılmadı`,why:`Aynı kanaldaki ${same.length} noktanın %${pct}'i bu ürünü alıyor${pr.launch?'; lansman ürünü':''}. İlk satışta +${RATE.dist} ₺ dağılım${pr.launch?' ve +'+RATE.launch+' ₺ lansman':''} primi.`,ev:{type:'order',items:{[pr.id]:1}},p:Math.min(.8,.25+cand.share*.6),imp:pr.price*2,w:pr.launch?1.35:1,prim:10,
      pitch:`Çevrenizdeki ${c.channel==='Market'?'marketlerin':'işletmelerin'} çoğu ${pshort(pr.id)} satıyor ve hızlı dönüyor. Bir koliyle deneyelim; satmazsa bir sonraki ziyarette birlikte bakarız.${pr.giftN?' Şu an '+pr.giftN+'+1 kampanyası da var.':''}`}); }
  const g1=PRODUCTS.find(p=>p.id==='P1'), last1=c.hist.length?(c.hist.reduce((a,b)=>new Date(a.date)>new Date(b.date)?a:b).items.P1||0):0;
  if(last1%5>=3) out.push({k:'tier',g:'s',t:`Coca-Cola 1 L'yi 5+1'e tamamla`,why:`Son siparişte ${last1} koli aldı; ${5-last1%5} koli daha alırsa 1 koli bedelsiz kazanır.`,ev:{type:'order',items:{P1:last1+(5-last1%5)}},p:.6,imp:g1.price*(5-last1%5),w:1.1,prim:8,pitch:`Geçen sefer ${last1} koli Coca-Cola 1 L almıştınız. ${5-last1%5} koli daha eklersek bir koli bedava geliyor; birim maliyetiniz düşüyor.`});
  else if(!sold.has('P1')||last1===0) out.push({k:'tier',g:'s',t:`Coca-Cola 1 L 5+1 kampanyasını öner`,why:`Bu noktada son siparişte Coca-Cola 1 L yok. 30 Kasım'a kadar 5 koliye 1 koli bedelsiz.`,ev:{type:'order',items:{P1:5}},p:.45,imp:g1.price*5,w:1.1,prim:8,pitch:`Bu ay Coca-Cola 1 L'de 5 koliye 1 koli bedava. Yılbaşı öncesi en çok dönen ürün; stok yapmak için iyi zaman.`});
  const ld=lastDays(c), gap=avgGap(c);
  if(ld>gap*1.4) out.push({k:'churn',g:'s',t:'Sipariş döngüsü aşıldı: kaybetme riski',why:`Normalde ${gap} günde bir sipariş veriyor; son sipariş ${ld} gün önce. Rakibe kayıyor olabilir.`,ev:{type:'order',items:{}},p:.55,imp:3000,w:1.25,prim:10,pitch:`Bir süredir sipariş vermediniz, her şey yolunda mı? Rafta eksik bir şey varsa hemen tamamlayalım.`});
  if(c.equip>0||['Market','Tekel / Premium'].includes(c.channel)) out.push({k:'cooler',g:'u',t:'Soğutucu saflığını fotoğrafla',why:`Bu ay bu noktada saflık fotoğrafı yok. Dolapta yalnız Coca-Cola ürünleri varsa doğrulanınca +${RATE.cooler} ₺.`,ev:{type:'photo'},p:.85,imp:450,w:1,prim:RATE.cooler,pitch:`Dolabı kampanya ürünleriyle düzenleyelim; soğuk ürün daha hızlı satar. Rakip ürünleri arka rafa alabilir miyiz?`});
  const miss=(c.must||[]).filter(k=>!sold.has(k)||!(c.hist.length&&c.hist[c.hist.length-1].items[k]));
  if(miss.length) out.push({k:'must',g:'u',t:`Rafta eksik Must SKU: ${pshort(miss[0])}`,why:`Must listesindeki ${miss.length} ürün son siparişte yok. Tamamlanırsa +${RATE.must} ₺ Must SKU primi.`,ev:{type:'order',items:{[miss[0]]:1}},p:.62,imp:P(miss[0]).price,w:1.05,prim:10,pitch:`${pshort(miss[0])} bu bölgede her noktada olması gereken ürünlerden. Rafta bir yüz açalım, müşteriniz aradığını bulsun.`});
  out.push({k:'pop',g:'u',t:'Kasım fiyat etiketlerini güncelle',why:'Yeni fiyat listesi 18 Kasım\'da başladı; raftaki etiketler eski olabilir.',ev:{type:'photo'},p:.9,imp:150,w:.8,prim:5,pitch:'Yeni fiyat etiketlerini taktım; müşteri fiyatı görünce daha rahat alır.'});
  const need=Math.max(0,D.tier-D.pts);
  if(need>0&&need<600) out.push({k:'loyal',g:'i',t:`Premia: üst seviyeye ${need} puan kaldı`,why:`Müşteri ${D.pts} puanda; ${Math.ceil(need/65)} koli daha alırsa Gümüş seviyeye geçer ve ek indirim kazanır.`,ev:{type:'confirm',label:'Müşteriye anlatıldı'},p:.5,imp:Math.ceil(need/65)*456,w:1,prim:5,pitch:`Premia'da ${D.pts} puandasınız; ${Math.ceil(need/65)} koli daha alırsanız Gümüş seviyeye geçiyorsunuz, bir sonraki siparişlerde ek indirim alırsınız.`});
  out.push({k:'launch',g:'i',t:'Fusetea lansmanını ve yılbaşı paketini anlat',why:'Bölgede Fusetea lansmanı sürüyor; broşür Evrak çantasında.',ev:{type:'confirm',label:'Anlatıldı'},p:.7,imp:320,w:.9,prim:5,pitch:'Fusetea Şeftali yeni geldi; 3 koliye 1 koli bedava. Yılbaşı paketinde Coca-Cola ve Schweppes birlikte, kasa önünde iyi satıyor.'});
  if(c.overdue>0) out.push({k:'coll',g:'i',t:`Vadesi geçen ${tl(c.overdue)}'yi konuş`,why:`Bakiye vadesini geçti; tahsilat olmadan limit siparişe yetmeyebilir.`,ev:{type:'payment'},p:.6,imp:c.overdue*.3,w:1.2,prim:10,pitch:`Vadesi geçen ${tl(c.overdue)} bakiyeniz görünüyor. Bugün bir kısmını alırsak siparişinizi limit sorunu olmadan geçebilirim.`});
  return out.map(m=>({...m,score:Math.round(m.p*m.imp*m.w)}));
}
function missionsFor(c){
  if(!S.missions[c.id]){ const all=mCandidates(c).sort((a,b)=>b.score-a.score); const pick=[];
    ['s','u','i'].forEach(g=>{ const b=all.find(m=>m.g===g); if(b) pick.push(b); });
    pick.sort((a,b)=>b.score-a.score);
    S.missions[c.id]={list:pick.slice(0,3).map((m,i)=>({...m,id:c.id+'-'+i,st:'open'})),skipped:all.length-Math.min(3,pick.length),at:new Date()}; save(); }
  return S.missions[c.id]; }
function evOk(m,c){ const e=m.ev;
  if(e.type==='order'){ const want=Object.entries(e.items); const today=c.hist.filter(h=>new Date(h.date).toDateString()===new Date().toDateString());
    const inSlip=today.length&&(want.length?want.every(([k,q])=>today.some(h=>(h.items[k]||0)>=q)):true);
    const inCart=U.inv&&U.inv.cust===c.id&&(want.length?want.every(([k,q])=>(U.cart[k]?.qty||0)>=q):Object.keys(U.cart).length>0);
    return inSlip?'slip':inCart?'cart':false; }
  if(e.type==='payment') return S.payments.some(p=>p.cust===c.id&&new Date(p.date).toDateString()===new Date().toDateString())?'slip':false;
  return m.ev.done?'slip':false; }
function mFinish(m,c,how){ if(m.st!=='open') return; m.st='done'; m.res=how; m.at=new Date(); S.incBase.missionN++; incAdd(c.id,'mission',Math.round(m.prim/RATE.mission),`${c.name}: görev · ${m.t}`); save(); }
function mAuto(c,silent){ const M=S.missions[c.id]; if(!M) return; let ch=false; M.list.forEach(m=>{ if(m.st==='open'&&evOk(m,c)==='slip'){ mFinish(m,c,'Kanıt: '+(m.ev.type==='payment'?'tahsilat kaydı':m.ev.type==='order'?'sipariş satırı':'kayıt')); ch=true; } }); if(ch&&!silent) toast('Görev otomatik tamamlandı · kanıt eşleşti'); }
const evText=(m,c)=>{ const o=evOk(m,c); const e=m.ev;
  if(e.type==='order') return Object.keys(e.items).length?`Kanıt: siparişte ${Object.entries(e.items).map(([k,q])=>q+' koli '+pshort(k)).join(' + ')}`+(o==='cart'?' <span class="okk">· sepette ✓ kaydedince tamamlanır</span>':''):'Kanıt: bugün herhangi bir sipariş';
  if(e.type==='photo') return 'Kanıt: fotoğraf'; if(e.type==='payment') return 'Kanıt: tahsilat kaydı'; return 'Kanıt: satıcı teyidi'; };
function missionCard(c){
  const M=missionsFor(c), D=digi(c), live=S.visit&&S.visit.cust===c.id, open=M.list.filter(m=>m.st==='open').length;
  const btns=m=>{ if(m.st!=='open') return `<div class="mres ${m.st==='done'?'ok':m.st==='rej'?'no':'pp'}">${m.st==='done'?'✓ Tamamlandı · '+esc(m.res||'')+' · +'+m.prim+' ₺':m.st==='rej'?'✕ Reddedildi · '+esc(m.why):'↷ Ertelendi · '+esc(m.why)}</div>`;
    const e=m.ev.type, main=e==='order'?(m.k==='cart'?`<button class="nbtn primary sm" data-a="mCart" data-k="${m.id}">${ic('cart')} Sepeti siparişe aktar</button>`:`<button class="nbtn primary sm" data-a="mOrder" data-k="${m.id}">${ic('cart')} Siparişe ekle</button>`)
      :e==='photo'?`<button class="nbtn primary sm" data-a="mPhoto" data-k="${m.id}">${ic('photo')} Fotoğraf çek</button>`:e==='payment'?`<button class="nbtn primary sm" data-a="mPay" data-k="${m.id}">${ic('coin')} Tahsilat al</button>`:`<button class="nbtn primary sm" data-a="mConf" data-k="${m.id}">${ic('check')} ${esc(m.ev.label)}</button>`;
    return `<div class="macts">${live?main:''}<button class="nbtn tonal sm" data-a="mPitch" data-k="${m.id}">${ic('spark')} Ne diyeyim?</button><button class="nbtn tonal sm" data-a="mWhy" data-k="${m.id}">Neden?</button>${live?`<button class="nbtn tonal sm" data-a="mRej" data-k="${m.id}">Reddetti</button><button class="nbtn tonal sm" data-a="mPost" data-k="${m.id}">Ertele</button>`:''}</div>`; };
  return `<div class="ncard"><div class="row"><span class="nspark">${ic('spark')}</span><div class="sp"><b style="font-size:16px">Bu ziyaretin görevleri</b><div class="nsub">${open} açık · en yüksek etkiye göre seçildi${M.skipped>0?' · '+M.skipped+' öneri bekletiliyor':''}</div></div></div>
   <div class="m360"><span>CCINEXT son dijital sipariş <b>${D.last} gün önce</b></span>${D.cart?`<span>Yarım sepet <b>${tl(cartVal(D.cart))}</b></span>`:''}<span>Premia <b>${D.pts} puan</b></span><span>Son sipariş <b>${lastDays(c)?lastDays(c)+' gün önce':'bugün'}</b></span></div>
   ${M.list.map(m=>`<div class="mitem ${m.st}"><div class="mhead"><span class="mg ${m.g}">${MG[m.g]}</span><div class="sp"><div class="mt">${esc(m.t)}</div></div><span class="mprim">+${m.prim} ₺</span></div>
     <div class="mwhy">${esc(m.why)}</div><div class="mev">${evText(m,c)}</div>${btns(m)}</div>`).join('')}
   ${live?'':`<div class="nsub" style="margin-top:6px">Görevleri tamamlamak için ziyareti başlat.</div>`}</div>`; }
const findM=id=>{ const cid=id.split('-')[0]; return [S.missions[cid].list.find(m=>m.id===id),C(cid)]; };
Object.assign(A,{
  mOrder:d=>{ const [m,c]=findM(d.k); requireVisit(()=>{ if(!(U.inv&&U.inv.cust===c.id)){ U.inv={type:'Sipariş',no:slipNo(),note:'',cust:c.id}; U.cart={}; } Object.entries(m.ev.items).forEach(([k,q])=>{ U.cart[k]={...(U.cart[k]||{}),qty:Math.max(U.cart[k]?.qty||0,q)}; }); U.tab.ie='Kalemler'; go('invedit'); toast('Görev ürünleri sepete eklendi · kaydedince görev tamamlanır'); }); },
  mCart:d=>{ A.mOrder(d); },
  mPhoto:d=>{ const [m,c]=findM(d.k); m.ev.done=true; if(m.k==='cooler') S.coolerShots=(S.coolerShots||0)+1; mFinish(m,c,'Kanıt: fotoğraf 14:0'+(new Date().getMinutes()%10)); toast('Fotoğraf eklendi · görev tamamlandı · +'+m.prim+' ₺'); render(); },
  mConf:d=>{ const [m,c]=findM(d.k); m.ev.done=true; mFinish(m,c,'Kanıt: satıcı teyidi'); toast('Görev tamamlandı · +'+m.prim+' ₺'); render(); },
  mPay:d=>{ requireVisit(()=>{ U.stack.push({s:'paylist'}); ov('payform'); }); },
  mWhy:d=>{ const [m]=findM(d.k); ov('mwhy',{k:d.k}); },
  mPitch:d=>ov('mpitch',{k:d.k}),
  mPitchSpeak:d=>{ const [m]=findM(d.k); speak(m.pitch); },
  mRej:d=>ov('mrej',{k:d.k,r:null}),
  mRejPick:d=>{ U.overlay.r=d.r; render(); },
  mRejSave:()=>{ const o=U.overlay; if(!o.r) return toast('Ret sebebi seçin'); const [m]=findM(o.k); m.st='rej'; m.why=o.r; m.at=new Date(); save(); U.overlay=null; toast('Kaydedildi · ret sebebi önerileri iyileştirmek için kullanılır'); render(); },
  mPost:d=>{ const [m]=findM(d.k); m.st='post'; m.why='Sonraki ziyarete'; save(); toast('Görev sonraki ziyarete ertelendi'); render(); },
  mEndBack:()=>{ U.overlay=null; render(); },
  mEndGo:()=>{ const c=selC(); (S.missions[c.id]?.list||[]).forEach(m=>{ if(m.st==='open'){ m.st='post'; m.why='Süre yetmedi'; } }); save(); U.overlay=null; U._mEndOk=true; A.visitToggle(); U._mEndOk=false; }
});
OV.mwhy=o=>{ const [m,c]=findM(o.k); return `<div class="ov" data-a="ovbg"><div class="dlg" data-stop><button class="x" data-a="closeOv">${ic('x')}</button><h2 style="font-size:18px;text-align:left">Neden bu görev?</h2><div class="st" style="text-align:left">${esc(m.t)}</div><hr>
  <div style="font-size:14px;line-height:1.45;margin-bottom:10px">${esc(m.why)}</div>
  <table class="mscore" style="width:100%;border-collapse:collapse"><tr><td>Kabul olasılığı</td><td>%${Math.round(m.p*100)}</td></tr><tr><td>Beklenen etki</td><td>${tl(m.imp)}</td></tr><tr><td>Stratejik ağırlık</td><td>× ${m.w.toFixed(2).replace('.',',')}</td></tr><tr><td>Görev skoru</td><td>${m.score.toLocaleString('tr-TR')}</td></tr></table>
  <div class="small" style="margin-top:10px;color:#6B7280">Skor = olasılık × etki × ağırlık. Her gruptan (satış, uygulama, iletişim) en yüksek skorlu görev seçilir, ziyaret başına en fazla 3 görev gösterilir. Faz 1: kural tabanlı; ret ve satış sonuçları biriktikçe olasılıklar modelle hesaplanır.</div>
  <button class="btn red" style="width:100%;margin-top:14px" data-a="closeOv">Tamam</button></div></div>`; };
OV.mpitch=o=>{ const [m]=findM(o.k); return `<div class="ov" data-a="ovbg"><div class="dlg" data-stop><button class="x" data-a="closeOv">${ic('x')}</button><div class="row" style="gap:10px;align-items:center">${XI_SVG(48)}<div><h2 style="font-size:18px;text-align:left;margin:0">Ne diyeyim?</h2><div class="st" style="text-align:left">Polar Bear · ${esc(m.t)}</div></div></div><hr>
  <div style="font-size:15px;line-height:1.5;background:#F7F7F8;border-radius:12px;padding:12px">“${esc(m.pitch)}”</div>
  <div class="small" style="margin-top:8px;color:#6B7280">Üründe bu metin müşteri verisinden üretken yapay zekâ ile yazılır; demoda şablondur.</div>
  <div class="row" style="gap:8px;margin-top:12px"><button class="nbtn tonal" style="flex:1" data-a="mPitchSpeak" data-k="${o.k}">${ic('play')} Dinle</button><button class="btn red" style="flex:1" data-a="closeOv">Tamam</button></div></div></div>`; };
const REJ=['Fiyat yüksek','Müşteride stok var','Rafta / dolapta yer yok','Yetkili yok','İlgilenmiyor','Rakip anlaşması'];
OV.mrej=o=>{ const [m]=findM(o.k); return `<div class="ov" data-a="ovbg"><div class="dlg" data-stop><button class="x" data-a="closeOv">${ic('x')}</button><h2 style="font-size:18px;text-align:left">Müşteri neden reddetti?</h2><div class="st" style="text-align:left">${esc(m.t)}</div><hr>
  <div style="display:flex;flex-wrap:wrap;gap:8px">${REJ.map(r=>`<button class="nchipbtn ${o.r===r?'act':''}" data-a="mRejPick" data-r="${r}">${r}</button>`).join('')}</div>
  <div class="small" style="margin-top:10px;color:#6B7280">Zorunlu. Ret sebepleri, hangi görevin hangi noktada işe yaradığını öğrenmek için kullanılır.</div>
  <button class="btn red" style="width:100%;margin-top:14px" data-a="mRejSave">Kaydet</button></div></div>`; };
OV.mopen=o=>`<div class="ov" data-a="ovbg"><div class="dlg" data-stop><div class="bang">!</div><h2 style="font-size:19px">${o.n} görev sonuçlanmadı</h2><div class="st">Her görev tamamlandı, reddedildi ya da ertelendi olarak kapanmalı.</div><hr>
  <button class="btn red" style="width:100%;margin-top:6px" data-a="mEndBack">Görevlere dön</button><button class="btn gray" style="width:100%;margin-top:8px" data-a="mEndGo">Ertele ve ziyareti bitir</button></div></div>`;
/* ziyareti bitirirken açık görev kontrolü */
const vt10=A.visitToggle;
A.visitToggle=function(d){ const c=selC(); if(c&&S.visit&&S.visit.cust===c.id&&!U._mEndOk){ const n=(S.missions[c.id]?.list||[]).filter(m=>m.st==='open').length; if(n) return ov('mopen',{n}); } return vt10(d); };
/* sipariş kaydı ve tahsilat sonrası kanıt eşleştirme */
const ss10=A.saveSlip; A.saveSlip=function(){ const c=selC(); const r=ss10.apply(this,arguments); if(c) mAuto(c); return r; };
const ps10=A.paySave; A.paySave=function(){ const c=selC(); const r=ps10.apply(this,arguments); if(c) mAuto(c); return r; };
/* ziyaret ekranına görev kartı */
const nsVisit10=NS.visit;
NS.visit=function(){ const c0=selC(); if(c0&&S.missions[c0.id]) mAuto(c0,true); const r=nsVisit10.apply(this,arguments); const c=selC(); if(!c||!r||!r.body) return r; const mark='<div class="ncard"><div class="row" style="margin-bottom:6px"><div class="sp"><b style="font-size:16px">Ziyaret adımları';
  r.body=r.body.includes(mark)?r.body.replace(mark,missionCard(c)+mark):missionCard(c)+r.body; return r; };
/* Bugün: öncelikli ziyaretler */
function prio(c){ const D=digi(c), ld=lastDays(c), gap=avgGap(c), why=[]; let s=0;
  if(D.cart){ s+=40; why.push('yarım dijital sepet '+tl(cartVal(D.cart))); }
  if(ld>gap*1.4){ s+=30; why.push(`döngü aşıldı (${ld}/${gap} gün)`); }
  if(c.overdue>0){ s+=20; why.push('vadesi geçen '+tl(c.overdue)); }
  s+=Math.min(25,(c.ep||0)/40); if(!why.length) why.push('yüksek ciro potansiyeli');
  return {s:Math.round(s),why}; }
const nsHome10=NS.home;
NS.home=function(){ const r=nsHome10.apply(this,arguments); if(!r||!r.body) return r;
  const L=planned().filter(c=>c.status==='planned').map(c=>({c,...prio(c)})).sort((a,b)=>b.s-a.s).slice(0,3);
  if(!L.length) return r;
  const card=`<div class="nsec">Bugünün öncelikleri</div><div class="ncard">${L.map(x=>`<div class="mprio" data-a="nOpenCust" data-k="${x.c.id}" style="cursor:pointer"><div class="navatar">${initials(x.c.name)}</div><div class="sp" style="min-width:0"><b class="ell" style="display:block">${esc(x.c.name)}</b><div class="nsub">${x.why.map(esc).join(' · ')}</div></div><span class="mprim" style="background:#FFE8E8;color:#B42318">${x.s}</span></div>`).join('')}
   <div class="nsub" style="margin-top:6px">Öncelik puanı: yarım dijital sepet, sipariş döngüsü, vadesi geçen bakiye ve ciro potansiyeli.</div></div>`;
  const mark='<div class="nsec">'; const i=r.body.indexOf(mark); r.body=i>=0?r.body.slice(0,i)+card+r.body.slice(i):r.body+card; return r; };
/* prim ekranına görev kalemi */
const incSum10=incSum;
incSum=function(){ const r=incSum10(), L=S.incLog, a=L.filter(x=>x.kind==='mission').reduce((s,x)=>s+x.amt,0), n=L.filter(x=>x.kind==='mission').length;
  const comp=r.comp.concat([{k:'mission',n:'Yönlendirilmiş görevler',d:`${S.incBase.missionN} görev tamamlandı (görev başına 5–20 ₺)`,amt:S.incBase.missionAmt+a}]);
  return {...r,comp,total:comp.reduce((s,x)=>s+x.amt,0)}; };
/* yönetici: görev etkinliği */
function mStats(){ const all=Object.values(S.missions).flatMap(M=>M.list); const by=s=>all.filter(m=>m.st===s).length;
  return {n:all.length,done:by('done'),rej:by('rej'),post:by('post'),open:by('open'),all}; }
const nsMgr10=NS.mgr;
NS.mgr=function(){ const r=nsMgr10.apply(this,arguments); if(!r||!r.body) return r; const St=mStats();
  const team=[['Serpil Y. (sen)',St.n?Math.round(St.done/St.n*100):0,St.n],['Mehmet K.',78,21],['Ayşe D.',71,18],['Burak T.',52,19],['Elif S.',44,17]];
  const grp=[['Satış',64],['Uygulama',83],['İletişim',72]], rej=[['Müşteride stok var',34],['Fiyat yüksek',27],['Yer yok',18],['Yetkili yok',13],['Diğer',8]];
  const card=`<div class="nsec">Yönlendirilmiş görevler · etkinlik</div><div class="ncard">
   <div class="nlabel">Tamamlama oranı · bugün</div>${team.map(([n,p,k])=>`<div class="mrow"><span class="ell">${esc(n)}</span><div class="mbar"><i style="width:${p}%;background:${p<55?'#D08A00':'#F40000'}"></i></div><b>%${p}</b></div>`).join('')}
   <div class="nlabel" style="margin-top:12px">Görev grubuna göre (ekip, son 4 hafta)</div>${grp.map(([n,p])=>`<div class="mrow"><span>${n}</span><div class="mbar"><i style="width:${p}%;background:#000"></i></div><b>%${p}</b></div>`).join('')}
   <div class="nlabel" style="margin-top:12px">Ret sebepleri</div>${rej.map(([n,p])=>`<div class="mrow"><span class="ell">${n}</span><div class="mbar"><i style="width:${p*2}%;background:#9CA3AF"></i></div><b>%${p}</b></div>`).join('')}
   <div class="nbi" style="margin-top:12px;background:#E3F4EA;border-radius:12px;padding:10px 12px"><b style="color:#17703F">Kontrol grubuna göre fark</b><div class="nsub" style="color:#14532D">Görev verilen noktalarda satış <b>+%6,8</b>, ürün dağılımı <b>+%11</b>, dijital sepet tamamlama <b>%58</b> (görev verilmeyen %9 noktayla karşılaştırma, son 4 hafta)</div></div>
   <div class="nsub" style="margin-top:8px">Serpil'in satırı demodan canlı (${St.done} tamam · ${St.rej} ret · ${St.post} ertelendi · ${St.open} açık); diğer satıcılar ve kontrol grubu örnek veridir. Görev kütüphanesi: yarım sepet, dağılım, kampanya baremi, kayıp riski, soğutucu saflığı, Must SKU, fiyat etiketi, Premia, lansman, tahsilat.</div></div>`;
  const mark='<div class="nsec">Ekip · bugün</div>'; r.body=r.body.includes(mark)?r.body.replace(mark,card+mark):r.body+card; return r; };
/* Polar Bear: görev soruları */
const xiAnswer10=xiAnswer;
xiAnswer=function(q0){ const q=q0.toLocaleLowerCase('tr'); if(['görev','misyon','ne yapmalıyım'].some(w=>q.includes(w))){ const c=selC(); if(!c) return {t:'Önce bir müşteri seç; o ziyaretin görevlerini söyleyeyim.'};
   const M=missionsFor(c), op=M.list.filter(m=>m.st==='open'); if(!op.length) return {t:`${c.name} için açık görev kalmadı. Tümü sonuçlandı.`};
   return {t:`${c.name} için ${op.length} görevin var: `+op.map((m,i)=>`${i+1}) ${m.t} (+${m.prim} ₺)`).join('; ')+'. En yüksek etkili olan ilki.',a:[['Ziyareti aç',()=>{ U.overlay=null; go('visit'); }]]}; }
  return xiAnswer10(q0); };
